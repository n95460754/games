<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>На око</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">👁️ На око</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 115. На око
A.add(choiceGame({id:'estimate',cat:'brain',icon:'👁️',name:'На око',desc:'Колко са блоковете? Прецени!',help:'Блоковете са твърде много за броене — прецени на око и избери най-близкото число (клик или 1–4). 60 секунди.',
  next(g){const n=A.ri(15,40+g.score*8);g.pts=[];for(let i=0;i<n;i++)g.pts.push([A.ri(20,450),A.ri(30,230)]);const step=Math.max(5,Math.round(n*.3));g.ans=n;
    const base=[n,n+step,n-step,n+2*step,n-2*step].filter(v=>v>0);g.opts=A.shuffle([n,...A.shuffle(base.slice(1)).slice(0,3)]);},
  pic(g){for(const[x,y]of g.pts)A.block(x,y,12,C.gold);}}));
</script>
</body>
</html>
