<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Средно аритметично</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">📊 Средно аритметично</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 130. Средно аритметично
A.add(numGame({id:'average',cat:'brain',icon:'📊',name:'Средно аритметично',desc:'Средното на няколко числа',lives:true,help:'Събери числата и раздели на броя им. Отговорът винаги е цяло число. 3 грешки и край.',
  next(g){const n=A.ri(2,Math.min(5,2+Math.floor(g.score/3))),avg=A.ri(3,20+g.score*3);const a=[];let s=0;for(let i=0;i<n-1;i++){const v=avg+A.ri(-avg+1,avg);a.push(v);s+=v;}a.push(avg*n-s);if(a[n-1]<0){return this.next(g);}g.ans=avg;g.q='Средно('+a.join(', ')+') = ?';}}));
</script>
</body>
</html>
