<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Делимост</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🔍 Делимост</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 79. Делимост
A.add({id:'divisible',cat:'brain',icon:'🔍',name:'Делимост',desc:'Дели ли се без остатък?',help:'← ДА, ако първото число се дели без остатък на второто, → НЕ. Мисли за признаците за делимост! 45 секунди, грешка = −1.',
  start(g){g.time=45;this.next(g);},
  next(g){g.k=A.pick([2,3,4,5,6,9,10,11,25]);g.n=Math.random()<.5?g.k*A.ri(5,40+g.score*20):A.ri(20,300+g.score*60);},
  key(g,k){const a={ArrowLeft:true,KeyA:true,ArrowRight:false,KeyD:false}[k];if(a===undefined)return;const ok=a===(g.n%g.k===0);flash(g,ok);g.score=Math.max(0,g.score+(ok?1:-1));if(!ok)g.why=g.n+' : '+g.k+' = '+(g.n/g.k).toFixed(2);this.next(g);},
  update(g,dt){tick(g,dt);},
  draw(g){A.bg('#20182c');A.txt(g.n+'  :  '+g.k,240,130,44,'#fff','center');A.txt('← ДА',90,280,22,'#9ccc65','center');A.txt('НЕ →',390,280,22,'#ff8a65','center');A.txt('⏱ '+Math.ceil(g.time),10,14,14);if(g.why)A.txt(g.why,240,340,13,'#bbb','center');drawFlash(g);}
});
</script>
</body>
</html>
