<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рудни суми</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">⛏️ Рудни суми</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 384. Рудни суми
A.add({id:'oresums',cat:'brain',icon:'⛏️',name:'Рудни суми',desc:'Изкопай излишните рудни блокове, така че сборът на всеки ред и колона да стане точно колкото е написано',
  help:'Всеки руден блок има число. Изкопай (махни) блоковете, които не ти трябват, така че сборът на ОСТАНАЛИТЕ числа във всеки ред да е равен на числото вдясно, а във всяка колона — на числото долу. Зелено = сборът е точен. Мишка/пръст: клик = изкопай / върни блока, десен клик = 📌 знак „остава“. Клавиатура: стрелки + Space (копай), K (знак). Решена мрежа = точки и +20 секунди; 120 секунди.',
  ORE:[null,['#7d7d7d','#2a2a2a'],['#7d7d7d','#d8a07a'],['#7d7d7d','#ffd23f'],['#7d7d7d','#d84a3a'],['#7d7d7d','#3b7bd6'],['#7d7d7d','#4de8f5'],['#7d7d7d','#3fd34a'],['#5a3a5a','#c77dff'],['#3a2020','#ff6a00']],
  start(g){g.time=120;g.lvl=0;g.cx=0;g.cy=0;g.win=0;g.parts=[];this.make(g);},
  make(g){
    const N=[4,4,5,5,6][Math.min(g.lvl,4)],mx=g.lvl<2?6:9;g.N=N;
    let keep;
    for(;;){keep=[];for(let i=0;i<N*N;i++)keep.push(Math.random()<.55);
      let ok=!keep.every(v=>v);for(let k=0;k<N;k++){let r=0,cl=0;for(let j=0;j<N;j++){if(keep[k*N+j])r++;if(keep[j*N+k])cl++;}
        if(!r||!cl)ok=false;}
      if(ok)break;}
    g.v=[];for(let i=0;i<N*N;i++)g.v.push(A.ri(1,mx));
    g.rt=[];g.ct=[];for(let k=0;k<N;k++){let r=0,cl=0;for(let j=0;j<N;j++){if(keep[k*N+j])r+=g.v[k*N+j];if(keep[j*N+k])cl+=g.v[j*N+k];}g.rt.push(r);g.ct.push(cl);}
    g.keep=keep;g.st=new Array(N*N).fill(0);g.cs=Math.min(62,Math.floor(300/(N+1)));g.ox=Math.floor((480-g.cs*(N+1))/2);g.oy=34;
    g.cx=Math.min(g.cx,N-1);g.cy=Math.min(g.cy,N-1);
  },
  sums(g){const N=g.N,rs=[],cls=[];for(let k=0;k<N;k++){let r=0,cl=0;for(let j=0;j<N;j++){if(g.st[k*N+j]!==1)r+=g.v[k*N+j];if(g.st[j*N+k]!==1)cl+=g.v[j*N+k];}rs.push(r);cls.push(cl);}return {rs,cls};},
  set(g,i,v){if(g.win>0)return;g.st[i]=v;
    if(v===1){A.beep(220,.06,'square');const N=g.N,x=g.ox+(i%N)*g.cs+g.cs/2,y=g.oy+((i/N)|0)*g.cs+g.cs/2,col=this.ORE[g.v[i]][1];
      for(let k=0;k<8;k++)g.parts.push({x,y,vx:A.rnd(-90,90),vy:A.rnd(-140,-30),t:.6,col:k%2?col:'#7d7d7d'});}
    else A.beep(v===2?520:420,.04,'triangle');
    const {rs,cls}=this.sums(g);
    if(rs.every((s,k)=>s===g.rt[k])&&cls.every((s,k)=>s===g.ct[k])){const pts=g.N-2;g.score+=pts;g.time+=20;g.win=1.2;g.gain=pts;A.tune([523,659,784,1047]);
      for(let k=0;k<30;k++)g.parts.push({x:240,y:180,vx:A.rnd(-170,170),vy:A.rnd(-220,-40),t:1,col:A.pick(['#4de8f5','#ffd23f','#3fd34a'])});}},
  key(g,k){const N=g.N;
    if(k==='ArrowLeft'||k==='KeyA')g.cx=(g.cx+N-1)%N;else if(k==='ArrowRight'||k==='KeyD')g.cx=(g.cx+1)%N;
    else if(k==='ArrowUp'||k==='KeyW')g.cy=(g.cy+N-1)%N;else if(k==='ArrowDown'||k==='KeyS')g.cy=(g.cy+1)%N;
    else if(k==='Space'||k==='Enter'){const i=g.cy*N+g.cx;this.set(g,i,g.st[i]===1?0:1);}
    else if(k==='KeyK'){const i=g.cy*N+g.cx;this.set(g,i,g.st[i]===2?0:2);}},
  click(g,mx,my,b){const N=g.N,x=Math.floor((mx-g.ox)/g.cs),y=Math.floor((my-g.oy)/g.cs);
    if(x<0||y<0||x>=N||y>=N)return;g.cx=x;g.cy=y;const i=y*N+x;
    if(b===2)this.set(g,i,g.st[i]===2?0:2);else this.set(g,i,g.st[i]===1?0:1);},
  update(g,dt){
    if(g.win>0){g.win-=dt;if(g.win<=0){g.lvl++;this.make(g);}}
    else{g.time-=dt;if(g.time<=0)return A.over(g,'Времето изтече! Реши '+g.lvl+' мрежи');}
    for(let i=g.parts.length-1;i>=0;i--){const q=g.parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.t-=dt;if(q.t<=0)g.parts.splice(i,1);}
  },
  ore(x,y,s,n){const [b,o]=this.ORE[n];A.block(x,y,s,b);const u=s/8;c.fillStyle=o;
    [[1,1],[5,1],[3,3],[1,5],[6,5],[4,6]].forEach(([a,d])=>c.fillRect(x+a*u,y+d*u,u*1.4,u*1.4));},
  draw(g){
    A.bg('#2b2420');
    const N=g.N,cs=g.cs,ox=g.ox,oy=g.oy,{rs,cls}=this.sums(g);
    for(let i=0;i<N*N;i++){const x=ox+(i%N)*cs,y=oy+((i/N)|0)*cs,s=g.st[i];
      if(s===1){c.fillStyle='#161210';c.fillRect(x,y,cs,cs);c.strokeStyle='#3a302a';c.lineWidth=1;c.strokeRect(x+.5,y+.5,cs-1,cs-1);
        A.txt(''+g.v[i],x+cs/2,y+cs/2,Math.floor(cs*.32),'#4a3f38','center');continue;}
      this.ore(x,y,cs,g.v[i]);
      c.fillStyle='rgba(0,0,0,.55)';c.fillRect(x+cs*.25,y+cs*.22,cs*.5,cs*.56);
      A.txt(''+g.v[i],x+cs/2,y+cs/2+1,Math.floor(cs*.42),'#fff','center');
      if(s===2){c.strokeStyle='#ffd54f';c.lineWidth=3;c.strokeRect(x+3,y+3,cs-6,cs-6);}
    }
    for(let k=0;k<N;k++){
      const okR=rs[k]===g.rt[k],okC=cls[k]===g.ct[k],fs=Math.floor(cs*.36);
      const rx=ox+N*cs+4,ry=oy+k*cs;A.block(rx,ry+4,cs-8,okR?'#2e7d32':'#4e342e',cs-8);
      A.txt(''+g.rt[k],rx+(cs-8)/2,ry+cs/2-3,fs,'#fff','center');
      if(!okR)A.txt(''+rs[k],rx+(cs-8)/2,ry+cs-8,Math.floor(cs*.2),'#ffab91','center');
      const bx=ox+k*cs,by=oy+N*cs+4;A.block(bx+4,by,cs-8,okC?'#2e7d32':'#4e342e',cs-8);
      A.txt(''+g.ct[k],bx+cs/2,by+(cs-8)/2-3,fs,'#fff','center');
      if(!okC)A.txt(''+cls[k],bx+cs/2,by+cs-12,Math.floor(cs*.2),'#ffab91','center');
    }
    if(g.win<=0){c.strokeStyle='#4de8f5';c.lineWidth=3;c.strokeRect(ox+g.cx*cs+1,oy+g.cy*cs+1,cs-2,cs-2);}
    for(const q of g.parts){c.fillStyle=q.col;c.fillRect(q.x,q.y,5,5);}
    c.fillStyle='rgba(0,0,0,.5)';c.fillRect(0,0,480,26);
    A.txt('⏱ '+Math.ceil(g.time),10,13,14,g.time<15?'#ff8a80':'#fff');
    A.txt('Мрежа '+(g.lvl+1)+' · '+N+'×'+N,240,13,13,'#ffe082','center');
    A.txt('копай излишните',470,13,12,'#b9c6d6','right');
    if(g.win>0)A.txt('Точно! +'+g.gain+' т., +20 с',240,180,24,'#ffd54f','center');
  }
});
</script>
</body>
</html>
