<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Магически квадрат</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">✨ Магически квадрат</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 109. Магически квадрат
A.add({id:'magicsquare',cat:'puzzle',icon:'✨',name:'Магически квадрат',desc:'Всички суми да са 15',low:true,unit:' хода',help:'Кликни две плочки, за да ги размениш. Направи така, че всеки ред, колона и двата диагонала да имат сбор 15.',
  start(g){g.b=A.shuffle([1,2,3,4,5,6,7,8,9]);g.sel=-1;g.moves=0;},
  sums(g){const b=g.b,L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return L.map(l=>l.reduce((a,i)=>a+b[i],0));},
  click(g,mx,my){const x=Math.floor((mx-150)/60),y=Math.floor((my-80)/60);if(x<0||y<0||x>2||y>2)return;const i=y*3+x;if(g.sel<0){g.sel=i;return;}
    [g.b[i],g.b[g.sel]]=[g.b[g.sel],g.b[i]];g.sel=-1;g.moves++;g.score=g.moves;A.beep(500,.03);if(this.sums(g).every(s=>s===15))A.over(g,'✨ Магически квадрат!');},
  draw(g){A.bg('#20182c');const s=this.sums(g);for(let i=0;i<9;i++){const x=150+(i%3)*60,y=80+Math.floor(i/3)*60;A.block(x+3,y+3,54,i===g.sel?C.gold:C.purple);A.txt(g.b[i],x+30,y+30,24,'#fff','center');}
    for(let r=0;r<3;r++){A.txt(s[r],345,110+r*60,16,s[r]===15?'#9ccc65':'#ff8a80');A.txt(s[3+r],180+r*60,270,16,s[3+r]===15?'#9ccc65':'#ff8a80','center');}
    A.txt(s[6],345,280,14,s[6]===15?'#9ccc65':'#ff8a80');A.txt(s[7],120,280,14,s[7]===15?'#9ccc65':'#ff8a80');A.txt('Ходове: '+g.moves,240,40,15,'#fff','center');}
});
</script>
</body>
</html>
