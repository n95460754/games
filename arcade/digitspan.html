<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запомни числото</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🧮 Запомни числото</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 228. Запомни числото
A.add({id:'digitspan',cat:'brain',icon:'🧮',name:'Запомни числото',desc:'Запомни все по-дълги числа',help:'Гледай числото, докато е на екрана, после го напиши по памет (цифри + Enter или бутоните долу). Всеки верен отговор прави числото с една цифра по-дълго. Имаш 3 живота.',
  start(g){g.len=3;g.lives=3;g.best=0;this.next(g);},
  next(g){let s='';for(let i=0;i<g.len;i++)s+=A.ri(i?0:1,9);g.num=s;g.inp='';g.ph='show';g.st=1+g.len*.45;g.fl=null;},
  type(g,ch){if(g.ph!=='in')return;if(ch==='del'){g.inp=g.inp.slice(0,-1);return;}if(ch==='ok')return this.check(g);if(g.inp.length<g.num.length){g.inp+=ch;A.beep(500+(+ch)*40,.04);}if(g.inp.length===g.num.length)this.check(g);},
  check(g){if(!g.inp)return;const ok=g.inp===g.num;g.fl={ok,t:1.2,ans:g.num};g.ph='res';
    if(ok){g.score+=g.len;g.best=Math.max(g.best,g.len);g.len++;A.tune([660,880]);}else{g.lives--;g.len=Math.max(3,g.len-1);A.beep(150,.25,'sawtooth');}},
  key(g,k,ch){if(ch>='0'&&ch<='9')this.type(g,ch);else if(k==='Backspace')this.type(g,'del');else if(k==='Enter'||k==='NumpadEnter')this.type(g,'ok');
    else if(k==='Space'&&g.ph==='show')g.st=0;},
  click(g,mx,my){if(g.ph==='show'){g.st=0;return;}if(my<300||my>348)return;const i=Math.floor((mx-6)/39);const keys=['1','2','3','4','5','6','7','8','9','0','del','ok'];if(i>=0&&i<12)this.type(g,keys[i]);},
  update(g,dt){if(g.ph==='show'){g.st-=dt;if(g.st<=0)g.ph='in';}else if(g.ph==='res'){g.fl.t-=dt;if(g.fl.t<=0){if(g.lives<=0)return A.over(g,'Най-дълго число: '+g.best+' цифри');this.next(g);}}},
  digits(s,y,col,hide){const n=s.length,w=Math.min(40,440/n),x0=240-n*w/2;for(let i=0;i<n;i++){A.block(x0+i*w+2,y,w-4,col,w+6);if(!hide)A.txt(s[i],x0+i*w+w/2,y+(w+6)/2,Math.floor(w*.75),'#fff','center');}},
  draw(g){A.bg('#1d2b3a');A.txt('❤'.repeat(Math.max(0,g.lives)),10,16,16,'#ff5252');A.txt('Цифри: '+g.len,470,16,16,'#ffd54f','right');
    if(g.ph==='show'){A.txt('Запомни!',240,70,22,'#b9c6d6','center');this.digits(g.num,120,C.purple);c.fillStyle='#ffd54f';c.fillRect(140,200,200*Math.max(0,g.st/(1+g.len*.45)),8);}
    else if(g.ph==='in'){A.txt('Напиши числото:',240,70,22,'#b9c6d6','center');const s=g.inp+'·'.repeat(g.num.length-g.inp.length);this.digits(s,120,'#5a6b8c');}
    else{const ok=g.fl.ok;A.txt(ok?'✔ Браво!':'✘ Грешка!',240,60,26,ok?'#69f0ae':'#ff5252','center');this.digits(g.fl.ans,110,ok?'#2e7d32':'#c62828');if(!ok)A.txt('Ти написа: '+g.inp,240,200,16,'#fff','center');}
    ['1','2','3','4','5','6','7','8','9','0','⌫','OK'].forEach((t,i)=>{A.block(8+i*39,302,35,i===11?'#2e7d32':i===10?'#c62828':C.stone,44);A.txt(t,8+i*39+17,324,t.length>1?13:18,'#fff','center');});}
});
</script>
</body>
</html>
