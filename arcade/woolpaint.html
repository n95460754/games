<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оцвети с вълна</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🐑 Оцвети с вълна</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 302. Оцвети с вълна
const WP_W=12,WP_H=9,WP_T=36,WP_OX=24,WP_OY=24;
const WP_COL=['#f9801d','#c74ebd','#3ab3da','#fed83d','#80c71f','#f38baa','#169c9c','#8932b8','#b02e26','#3c44aa'];
const WP_D={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]};
A.add({id:'woolpaint',cat:'puzzle',icon:'🐑',name:'Оцвети с вълна',desc:'Овцата се плъзга до стената и оцветява пътя с вълна — боядисай всяко поле',
  help:'Стрелки / WASD, плъзгане с пръст или клик встрани от овцата — тя се плъзга, докато не удари стена, и оцветява полетата. Оцвети всички зелени полета! R — нивото отначало. Ниво = 1 т., +1 ако се побереш в ходовете. 3 минути.',
  start(g){g.time=180;g.lv=0;this.make(g);},
  make(g){
    const n=Math.min(20,7+g.lv*2);
    for(let tries=0;tries<800;tries++){
      const m=new Array(WP_W*WP_H).fill(1),fix=new Array(WP_W*WP_H).fill(0);
      let x=A.ri(0,WP_W-1),y=A.ri(0,WP_H-1);const sx=x,sy=y;m[y*WP_W+x]=0;let moves=0,last=-1,fails=0;
      while(moves<n&&fails<60){
        const di=A.ri(0,3),[dx,dy]=[[1,0],[-1,0],[0,1],[0,-1]][di];if(di===(last^1)){fails++;continue;}
        let max=0;while(true){const X=x+dx*(max+1),Y=y+dy*(max+1);if(X<0||Y<0||X>=WP_W||Y>=WP_H||fix[Y*WP_W+X])break;max++;}
        if(max<1){fails++;continue;}
        const len=A.ri(1,Math.min(max,6)),ex=x+dx*len,ey=y+dy*len,bx=ex+dx,by=ey+dy;
        if(bx>=0&&by>=0&&bx<WP_W&&by<WP_H&&!m[by*WP_W+bx]){fails++;continue;}
        for(let i=1;i<=len;i++)m[(y+dy*i)*WP_W+x+dx*i]=0;
        if(bx>=0&&by>=0&&bx<WP_W&&by<WP_H)fix[by*WP_W+bx]=1;
        x=ex;y=ey;moves++;last=di;}
      const cnt=m.filter(v=>!v).length;
      const easy=tries>500;if(moves>=(easy?3:n)&&cnt>=(easy?6:Math.min(60,14+g.lv*4))){g.m=m;g.sx=sx;g.sy=sy;g.par=moves;g.col=WP_COL[g.lv%WP_COL.length];this.reset(g);return;}}
  },
  reset(g){g.p=new Array(WP_W*WP_H).fill(0);g.x=g.sx;g.y=g.sy;g.px=g.x;g.py=g.y;g.p[g.y*WP_W+g.x]=1;g.moves=0;g.path=null;g.buf=null;g.win=0;},
  go(g,dx,dy){if(g.win>0)return;if(g.path){g.buf=[dx,dy];return;}
    const path=[];let x=g.x,y=g.y;while(true){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=WP_W||Y>=WP_H||g.m[Y*WP_W+X])break;x=X;y=Y;path.push([x,y]);}
    if(!path.length){A.beep(140,.05);return;}g.moves++;g.path=path;g.pt=0;A.beep(320,.04);},
  key(g,k){if(k==='KeyR'){this.reset(g);return;}const d=WP_D[k];if(d)this.go(g,d[0],d[1]);},
  click(g,mx,my){if(my<20&&mx>380){this.reset(g);return;}const dx=mx-(WP_OX+g.px*WP_T+WP_T/2),dy=my-(WP_OY+g.py*WP_T+WP_T/2);
    if(Math.max(Math.abs(dx),Math.abs(dy))<WP_T/2)return;if(Math.abs(dx)>Math.abs(dy))this.go(g,Math.sign(dx),0);else this.go(g,0,Math.sign(dy));},
  update(g,dt){g.time-=dt;if(g.time<=0)return A.over(g,'Времето изтече!');
    if(g.win>0){g.win-=dt;if(g.win<=0){g.lv++;this.make(g);}return;}
    if(g.path){g.pt+=dt*22;while(g.path&&g.pt>=1){g.pt-=1;const[x,y]=g.path.shift();g.x=x;g.y=y;g.p[y*WP_W+x]=1;
        if(!g.path.length){g.path=null;g.pt=0;}}
      g.px=g.x;g.py=g.y;if(g.path&&g.path.length){const[nx,ny]=g.path[0];g.px=g.x+(nx-g.x)*g.pt;g.py=g.y+(ny-g.y)*g.pt;}
      if(!g.path){let left=0;for(let i=0;i<g.m.length;i++)if(!g.m[i]&&!g.p[i])left++;
        if(!left){const bonus=g.moves<=g.par?1:0;g.score+=1+bonus;g.bonus=bonus;g.win=1;A.tune(bonus?[660,880,1100,1320]:[660,880,1100]);}
        else if(g.buf){const b=g.buf;g.buf=null;this.go(g,b[0],b[1]);}}}},
  draw(g){A.bg('#3a2a1a');
    for(let i=0;i<g.m.length;i++){const x=WP_OX+(i%WP_W)*WP_T,y=WP_OY+Math.floor(i/WP_W)*WP_T;
      if(g.m[i])A.block(x,y,WP_T,(i*7)%5?'#7d7d7d':'#6f6f6f');
      else if(g.p[i]){A.block(x,y,WP_T,g.col);c.fillStyle='rgba(255,255,255,.12)';c.fillRect(x+6,y+8,8,4);c.fillRect(x+20,y+20,10,4);}
      else{c.fillStyle=(i%2)?'#5aa13a':'#62ab40';c.fillRect(x,y,WP_T,WP_T);c.fillStyle='#4a8a2e';c.fillRect(x+8,y+10,3,5);c.fillRect(x+24,y+22,3,5);}}
    // овца
    const sx=WP_OX+g.px*WP_T,sy=WP_OY+g.py*WP_T;
    A.block(sx+5,sy+9,26,'#eeeeee',18);A.block(sx+20,sy+5,12,'#d8c0a8',12);c.fillStyle='#000';c.fillRect(sx+27,sy+8,2,3);
    c.fillStyle='#d8c0a8';c.fillRect(sx+8,sy+27,4,5);c.fillRect(sx+24,sy+27,4,5);c.fillStyle=g.col;c.fillRect(sx+7,sy+11,8,4);
    let left=0;for(let i=0;i<g.m.length;i++)if(!g.m[i]&&!g.p[i])left++;
    A.txt('⏱ '+Math.ceil(g.time)+'  Ниво '+(g.lv+1)+'  Ходове: '+g.moves+'/'+g.par+'  Остават: '+left,8,11,12,'#fff');
    A.block(400,2,74,'#5a6b8c',18);A.txt('↺ R',437,11,12,'#fff','center');
    if(g.win>0){c.fillStyle='rgba(0,0,0,.45)';c.fillRect(0,150,480,60);A.txt(g.bonus?'Браво! +2 (в ходовете)':'Готово! +1',240,180,22,'#ffd54f','center');}
  }
});
</script>
</body>
</html>
