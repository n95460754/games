<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скорост и път</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🚗 Скорост и път</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 134. Скорост, време, път
A.add(numGame({id:'speed',cat:'brain',icon:'🚗',name:'Скорост и път',desc:'s = v · t',lives:true,help:'Път = скорост × време. Внимавай какво се пита! 3 грешки и край.',
  next(g){const v=A.ri(2,12)*10,t=A.ri(1,6),s=v*t,k=A.ri(0,2);if(k===0){g.ans=s;g.q=v+' км/ч за '+t+' ч → ? км';}if(k===1){g.ans=v;g.q=s+' км за '+t+' ч → ? км/ч';}if(k===2){g.ans=t;g.q=s+' км с '+v+' км/ч → ? ч';}}}));
</script>
</body>
</html>
