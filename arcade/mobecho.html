<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ехо от мобове</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🔁 Ехо от мобове</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 276. Ехо от мобове
const ME_T=['pig','chicken','creeper','zombie','sheep'];
A.add({id:'mobecho',cat:'brain',icon:'🔁',name:'Ехо от мобове',desc:'Същият ли е мобът като преди 1, 2 или 3 хода?',
  help:'Появяват се мобове един след друг. Кажи дали сегашният моб е СЪЩИЯТ като този преди N хода (N е горе). ← / A / 1 = Същият, → / D / 2 = Различен, или клик на бутоните. На всеки 8 верни N расте! 3 живота.',
  start(g){g.n=1;g.seq=[];g.lives=3;g.streak=0;g.res='';this.next(g);},
  next(g){const m=g.seq.length>=g.n&&Math.random()<.38?g.seq[g.seq.length-g.n]:A.pick(ME_T);g.seq.push(m);
    g.need=g.seq.length>g.n;g.tl=g.need?Math.max(1.6,3.2-g.score*.03):1.3;g.tm=g.tl;g.ans=null;},
  pick(g,same){if(!g.need||g.ans!==null)return;const ok=(g.seq[g.seq.length-1]===g.seq[g.seq.length-1-g.n])===same;g.ans=ok;g.rok=ok;flash(g,ok);
    if(ok){g.score++;g.streak++;g.res='Вярно!';if(g.streak>=8&&g.n<3){g.n++;g.streak=0;g.res='Сега: преди '+g.n+'!';g.seq=[];A.tune([660,880,1100]);}}
    else{g.lives--;g.streak=0;g.res='Грешка!';if(g.lives<=0)return A.over(g,'Край! N = '+g.n);}
    g.tm=Math.min(g.tm,.45);},
  key(g,k,ch){if(k==='ArrowLeft'||k==='KeyA'||ch==='1')this.pick(g,true);else if(k==='ArrowRight'||k==='KeyD'||ch==='2')this.pick(g,false);},
  click(g,mx,my){if(my>290&&my<350){if(mx>40&&mx<230)this.pick(g,true);else if(mx>250&&mx<440)this.pick(g,false);}},
  update(g,dt){if(g.fl)g.fl.t-=dt;g.tm-=dt;if(g.tm<=0){if(g.need&&g.ans===null){g.lives--;g.streak=0;flash(g,false);g.res='Не отговори!';g.rok=false;if(g.lives<=0)return A.over(g,'Край! N = '+g.n);}this.next(g);}},
  mob(t,x,y){
    if(t==='pig'){A.block(x-40,y-30,80,'#f0a0b0',44);A.block(x+20,y-50,40,'#f4b0c0',40);c.fillStyle='#d77a90';c.fillRect(x+48,y-34,14,12);c.fillStyle='#000';c.fillRect(x+40,y-44,6,6);c.fillStyle='#e08ca0';[-36,-16,8,26].forEach(o=>c.fillRect(x+o,y+14,10,16));return;}
    if(t==='chicken'){A.block(x-26,y-24,52,'#f4f4f4',40);A.block(x+6,y-60,30,'#ffffff',38);c.fillStyle='#ffb300';c.fillRect(x+36,y-46,12,8);c.fillStyle='#d32f2f';c.fillRect(x+32,y-36,8,10);c.fillStyle='#000';c.fillRect(x+24,y-52,5,5);c.fillStyle='#ff9800';c.fillRect(x-10,y+16,5,16);c.fillRect(x+8,y+16,5,16);return;}
    if(t==='creeper'){A.block(x-18,y-30,36,'#4caf50',50);A.block(x-22,y-74,44,'#5cbf60',44);c.fillStyle='#000';c.fillRect(x-16,y-64,10,10);c.fillRect(x+6,y-64,10,10);c.fillRect(x-6,y-54,12,14);c.fillStyle='#3d8b40';c.fillRect(x-18,y+20,16,14);c.fillRect(x+2,y+20,16,14);return;}
    if(t==='sheep'){A.block(x-42,y-30,84,'#eeeeee',46);A.block(x+26,y-50,32,'#dcdcdc',34);c.fillStyle='#c9a888';c.fillRect(x+32,y-42,22,20);c.fillStyle='#000';c.fillRect(x+36,y-38,5,5);c.fillRect(x+46,y-38,5,5);c.fillStyle='#c9a888';[-36,-16,8,26].forEach(o=>c.fillRect(x+o,y+16,10,16));return;}
    A.block(x-20,y-34,40,'#2e8fa8',38);A.block(x-22,y-76,44,'#5a9a4a',42);c.fillStyle='#000';c.fillRect(x-12,y-62,8,6);c.fillRect(x+4,y-62,8,6);c.fillStyle='#5a9a4a';c.fillRect(x+16,y-30,30,12);c.fillStyle='#3a3a8a';c.fillRect(x-18,y+4,16,30);c.fillRect(x+2,y+4,16,30);},
  draw(g){A.bg('#20304a');c.fillStyle=C.grass;c.fillRect(0,232,480,10);c.fillStyle=C.dirt;c.fillRect(0,242,480,40);
    c.fillStyle='rgba(0,0,0,.5)';c.fillRect(0,0,480,30);A.txt('Преди '+g.n+(g.n>1?' хода':' ход'),8,15,15,'#ffd54f');A.txt('❤'.repeat(Math.max(0,g.lives)),472,15,15,'#f55','right');
    for(let i=0;i<8;i++)A.block(170+i*18,9,12,i<g.streak?'#4de8f5':'#3a4a5a');
    const t=g.seq[g.seq.length-1],k=1-g.tm/g.tl,sc=Math.min(1,k*6);
    if(t){c.save();c.translate(240,200);c.scale(sc,sc);this.mob(t,0,0);c.restore();}
    A.txt('Ход '+g.seq.length,240,48,13,'#b9c6d6','center');
    if(g.need){c.fillStyle='#000';c.fillRect(140,252,200,8);c.fillStyle=g.tm/g.tl<.3?'#f55':'#ffd54f';c.fillRect(140,252,200*Math.max(0,g.tm/g.tl),8);}
    else A.txt('Запомни!',240,262,16,'#fff','center');
    A.txt(g.res,240,74,16,g.rok?'#c8f7c5':'#ffccbc','center');
    A.block(40,290,190,g.need?'#3a8a3a':'#344',52);A.txt('1 ← Същият',135,316,17,'#fff','center');
    A.block(250,290,190,g.need?'#8a3a3a':'#344',52);A.txt('Различен → 2',345,316,17,'#fff','center');
    drawFlash(g);}
});
</script>
</body>
</html>
