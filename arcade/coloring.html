<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Книжка за оцветяване</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🖍️ Книжка за оцветяване</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 222. Книжка за оцветяване
A.add({id:'coloring',cat:'board',icon:'🖍️',name:'Книжка за оцветяване',desc:'Оцветявай с кофичка',noScore:true,help:'Избери цвят отдолу (1–8) и кликни в празна област — запълва се цялата (като с кофичка с боя). N — нова картинка, C — изчисти.',
  pal:['#d84a3a','#ff8c1a','#ffd23f','#5aa13a','#3b7bd6','#8e24aa','#8d6e3f','#f8bbd0'],
  start(g){g.sel=0;g.pic=0;this.make(g);},
  make(g){g.cv=document.createElement('canvas');g.cv.width=480;g.cv.height=320;const x=g.cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,480,320);x.strokeStyle='#000';x.lineWidth=3;
    const P=[()=>{x.strokeRect(150,140,180,140);x.beginPath();x.moveTo(140,140);x.lineTo(240,60);x.lineTo(340,140);x.closePath();x.stroke();x.strokeRect(220,210,40,70);x.strokeRect(170,165,40,35);x.strokeRect(270,165,40,35);x.beginPath();x.arc(410,60,30,0,7);x.stroke();x.beginPath();x.moveTo(0,280);x.lineTo(480,280);x.stroke();},
      ()=>{x.beginPath();x.ellipse(240,170,120,70,0,0,7);x.stroke();x.beginPath();x.moveTo(120,170);x.lineTo(60,120);x.lineTo(60,220);x.closePath();x.stroke();x.beginPath();x.arc(310,150,10,0,7);x.stroke();for(const k of[180,220,260])x.beginPath(),x.moveTo(k,110),x.quadraticCurveTo(k+20,170,k,230),x.stroke();},
      ()=>{for(const[cx,cy,r]of[[240,160,40],[240,90,35],[310,160,35],[240,230,35],[170,160,35]]){x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();}x.beginPath();x.moveTo(240,195);x.lineTo(240,320);x.stroke();x.beginPath();x.ellipse(200,280,30,12,-.5,0,7);x.stroke();},
      ()=>{x.strokeRect(100,120,280,100);x.strokeRect(160,70,160,50);x.beginPath();x.arc(160,230,30,0,7);x.stroke();x.beginPath();x.arc(320,230,30,0,7);x.stroke();x.strokeRect(175,80,55,35);x.strokeRect(250,80,55,35);x.beginPath();x.moveTo(0,262);x.lineTo(480,262);x.stroke();}];
    P[g.pic%P.length]();g.img=x.getImageData(0,0,480,320);},
  fill(g,sx,sy){const d=g.img.data,W=480,H=320,i0=(sy*W+sx)*4;const t=[d[i0],d[i0+1],d[i0+2]];if(t[0]<60&&t[1]<60&&t[2]<60)return;const hex=this.pal[g.sel],col=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
    if(t[0]===col[0]&&t[1]===col[1]&&t[2]===col[2])return;const same=i=>Math.abs(d[i]-t[0])<40&&Math.abs(d[i+1]-t[1])<40&&Math.abs(d[i+2]-t[2])<40;const st=[sx+sy*W];const seen=new Uint8Array(W*H);
    while(st.length){const p=st.pop();if(seen[p])continue;seen[p]=1;const i=p*4;if(!same(i))continue;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];const x=p%W,y=(p/W)|0;if(x>0)st.push(p-1);if(x<W-1)st.push(p+1);if(y>0)st.push(p-W);if(y<H-1)st.push(p+W);}
    g.cv.getContext('2d').putImageData(g.img,0,0);A.beep(500,.04);},
  click(g,mx,my){if(my>=320){const i=Math.floor(mx/60);if(i>=0&&i<8)g.sel=i;return;}this.fill(g,Math.floor(mx),Math.floor(my));},
  key(g,k,ch){const n=+ch;if(n>=1&&n<=8)g.sel=n-1;if(k==='KeyN'){g.pic++;this.make(g);}if(k==='KeyC')this.make(g);},
  draw(g){c.drawImage(g.cv,0,0);this.pal.forEach((p,i)=>{c.fillStyle=p;c.fillRect(i*60+2,322,56,36);if(i===g.sel){c.strokeStyle='#000';c.lineWidth=4;c.strokeRect(i*60+3,323,54,34);}});}
});
</script>
</body>
</html>
