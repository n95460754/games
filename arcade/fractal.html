<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фрактално дърво</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🌳 Фрактално дърво</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 124. Фрактално дърво
A.add({id:'fractal',cat:'board',icon:'🌳',name:'Фрактално дърво',desc:'Математическо изкуство',noScore:true,help:'Мести мишката: наляво/надясно сменя ъгъла на клоните, нагоре/надолу — колко се смаляват. ↑ ↓ — дълбочина. Space — сменя цветовете. Всичко е едно правило, повторено отново и отново!',
  start(g){g.depth=9;g.pal=0;},
  key(g,k){if(k==='ArrowUp')g.depth=Math.min(12,g.depth+1);if(k==='ArrowDown')g.depth=Math.max(1,g.depth-1);if(k==='Space')g.pal=(g.pal+1)%3;},
  draw(g){A.bg(['#0b1a12','#1a0b18','#0b1220'][g.pal]);const ang=(A.mouse.x/480)*1.4+.1,sh=.55+(1-A.mouse.y/360)*.25;
    const P=[['#6b4a2a','#3f8a24','#9ccc65'],['#4a148c','#e040fb','#ffd54f'],['#1565c0','#4de8f5','#fff']][g.pal];
    const br=(x,y,len,a,d)=>{const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len;c.strokeStyle=d>g.depth*.6?P[0]:d>g.depth*.25?P[1]:P[2];c.lineWidth=Math.max(1,d*1.2);
      c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();if(d>1){br(x2,y2,len*sh,a-ang,d-1);br(x2,y2,len*sh,a+ang,d-1);}};
    br(240,350,80,-Math.PI/2+Math.sin(g.t)*.03,g.depth);A.txt('Ъгъл '+Math.round(ang*57)+'°  Смаляване '+sh.toFixed(2)+'  Дълбочина '+g.depth+' (= '+(2**g.depth-1)+' клона)',8,12,11,'#ddd');}
});
</script>
</body>
</html>
