<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дама</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">⛀ Дама</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 121. Дама
A.add({id:'checkers',cat:'board',icon:'⛀',name:'Дама',desc:'Класическа дама срещу робота',help:'Кликни своя бял блок, после поле по диагонал. Взимането е задължително (прескачаш противника). Стигнеш ли последния ред — ставаш дама и ходиш назад. Вземи всички черни!',
  start(g){g.b=Array(64).fill(0);for(let i=0;i<64;i++){const x=i%8,y=Math.floor(i/8);if((x+y)%2){if(y<3)g.b[i]=2;if(y>4)g.b[i]=1;}}g.sel=-1;g.turn=1;g.ai=0;g.chain=-1;},
  own(v,p){return v===p||v===p+2;},
  movesOf(g,i,p,capOnly){const v=g.b[i],x=i%8,y=Math.floor(i/8),king=v>2,dirs=[];const fw=p===1?-1:1;for(const dx of[-1,1]){dirs.push([dx,fw]);if(king)dirs.push([dx,-fw]);}
    const r=[];for(const[dx,dy]of dirs){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>7||Y>7)continue;const j=Y*8+X;
      if(!g.b[j]&&!capOnly)r.push({to:j,cap:-1});else if(g.b[j]&&!this.own(g.b[j],p)){const X2=X+dx,Y2=Y+dy;if(X2>=0&&Y2>=0&&X2<8&&Y2<8&&!g.b[Y2*8+X2])r.push({to:Y2*8+X2,cap:j});}}return r;},
  all(g,p){let caps=[],moves=[];for(let i=0;i<64;i++)if(this.own(g.b[i],p))for(const m of this.movesOf(g,i,p))(m.cap>=0?caps:moves).push({from:i,...m});return caps.length?caps:moves;},
  doMove(g,m,p){const v=g.b[m.from];g.b[m.from]=0;g.b[m.to]=v;if(m.cap>=0){g.b[m.cap]=0;if(p===1)g.score++;}const y=Math.floor(m.to/8);if(v===p&&((p===1&&y===0)||(p===2&&y===7)))g.b[m.to]=p+2;A.beep(p===1?600:300,.05);
    if(m.cap>=0&&this.movesOf(g,m.to,p,true).length){g.chain=m.to;return true;}g.chain=-1;return false;},
  end(g){const me=this.all(g,1).length,ai=this.all(g,2).length,nm=g.b.filter(v=>this.own(v,1)).length,na=g.b.filter(v=>this.own(v,2)).length;
    if(!na||!ai){A.tune([523,659,784]);A.over(g,'🏆 Победа!');return true;}if(!nm||!me){A.over(g,'Роботът победи');return true;}return false;},
  click(g,mx,my){if(g.turn!==1)return;const x=Math.floor((mx-100)/35),y=Math.floor((my-40)/35);if(x<0||y<0||x>7||y>7)return;const i=y*8+x;
    const legal=this.all(g,1).filter(m=>g.chain<0||m.from===g.chain);
    if(this.own(g.b[i],1)&&g.chain<0){g.sel=i;return;}const m=legal.find(m=>m.from===g.sel&&m.to===i);if(!m)return;
    const more=this.doMove(g,m,1);if(more){g.sel=m.to;return;}g.sel=-1;if(this.end(g))return;g.turn=2;g.ai=.6;},
  update(g,dt){if(g.turn!==2)return;g.ai-=dt;if(g.ai>0)return;let legal=this.all(g,2).filter(m=>g.chain<0||m.from===g.chain);if(!legal.length){g.turn=1;g.chain=-1;this.end(g);return;}
    const safe=legal.filter(m=>m.cap>=0);const m=A.pick(safe.length?safe:legal.sort((a,b)=>Math.floor(b.to/8)-Math.floor(a.to/8)+A.rnd(-3,3)));
    if(this.doMove(g,m,2)){g.ai=.4;return;}if(this.end(g))return;g.turn=1;},
  draw(g){A.bg('#2a2018');const legal=g.turn===1?this.all(g,1).filter(m=>(g.chain<0||m.from===g.chain)&&m.from===g.sel).map(m=>m.to):[];
    for(let i=0;i<64;i++){const x=100+(i%8)*35,y=40+Math.floor(i/8)*35;c.fillStyle=(i%8+Math.floor(i/8))%2?'#7a5233':'#e0c068';c.fillRect(x,y,35,35);const v=g.b[i];
      if(v){A.block(x+5,y+5,25,this.own(v,1)?'#eee':'#222');if(v>2)A.txt('♛',x+17,y+18,16,v>3?'#ffd54f':'#c9a64a','center');}
      if(i===g.sel){c.strokeStyle='#ffd54f';c.lineWidth=3;c.strokeRect(x+2,y+2,31,31);}if(legal.includes(i)){c.fillStyle='rgba(156,204,101,.7)';c.fillRect(x+13,y+13,9,9);}}
    A.txt(g.turn===1?'Твой ход (бели)':'Роботът мисли...',240,20,15,'#fff','center');}
});
</script>
</body>
</html>
