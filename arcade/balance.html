<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Еквилибрист</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🎋 Еквилибрист</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 82. Еквилибрист
A.add({id:'balance',cat:'skill',icon:'🎋',name:'Еквилибрист',desc:'Пази пръта изправен',unit:' с',dec:1,help:'← → (или мишка) — движи количката, за да пазиш високия прът изправен. Резултатът е колко секунди издържиш.',
  start(g){g.x=240;g.v=0;g.a=A.rnd(-.05,.05);g.w=0;},
  move(g,x){g.mx=x;},
  update(g,dt){g.score=g.t;let f=0;if(A.keys.ArrowLeft||A.keys.KeyA)f=-1;if(A.keys.ArrowRight||A.keys.KeyD)f=1;
    if(!f&&g.mx!==undefined)f=A.clamp((g.mx-g.x)/60,-1,1);
    const acc=f*900;g.v+=acc*dt;g.v*=.98;g.x+=g.v*dt;if(g.x<40){g.x=40;g.v=0;}if(g.x>440){g.x=440;g.v=0;}
    const wind=Math.sin(g.t*.7)*.3*Math.min(1,g.t/20);g.w+=(Math.sin(g.a)*9-acc*Math.cos(g.a)/110+wind)*dt;g.w*=.995;g.a+=g.w*dt;
    if(Math.abs(g.a)>1.1)A.over(g,'Прътът падна!');},
  draw(g){A.bg('#87ceeb');for(let x=0;x<480;x+=20)A.block(x,320,20,C.grass,40);A.block(g.x-30,295,60,'#7d7d85',22);c.fillStyle='#222';c.fillRect(g.x-24,315,10,8);c.fillRect(g.x+14,315,10,8);
    c.save();c.translate(g.x,295);c.rotate(g.a);c.fillStyle=C.wood;c.fillRect(-4,-200,8,200);A.block(-12,-216,24,C.red);c.restore();A.txt('Вятър '+(Math.sin(g.t*.7)>0?'→':'←'),470,16,13,'#123','right');}
});
</script>
</body>
</html>
