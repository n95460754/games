<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Завърти квадратите</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🔄 Завърти квадратите</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 242. Завърти квадратите
const TW_COL=['#d84a3a','#ffd23f','#3b7bd6','#5aa13a','#8e24aa'];
A.add({id:'twist',cat:'puzzle',icon:'🔄',name:'Завърти квадратите',desc:'Върти 2×2 блокове, докато всеки ред стане от един цвят',help:'Мишка: посочи 4 блока, ляв клик = завърти по часовника, десен клик = обратно. Клавиатура: стрелки = избор, Space = по часовника, X = обратно, Backspace = назад, R = отначало. Направи всеки ред от един цвят!',
  start(g){g.time=180;g.lv=0;g.cur=[0,0];this.make(g);},
  make(g){g.lv++;const n=g.lv<3?3:g.lv<6?4:5;g.n=n;g.cell=Math.floor(250/n);g.ox=Math.floor((480-n*g.cell)/2);g.oy=56;
    g.map=A.shuffle([0,1,2,3,4]);g.par=Math.min(1+g.lv,10);
    do{g.b=[];for(let y=0;y<n;y++)g.b.push(Array(n).fill(y));let prev=null;
      for(let k=0;k<g.par;k++){let x,y,cw;do{x=A.ri(0,n-2);y=A.ri(0,n-2);cw=Math.random()<.5;}while(prev&&prev[0]===x&&prev[1]===y&&prev[2]!==cw);
        this.rot(g,x,y,cw);prev=[x,y,cw];}}while(this.solved(g));
    g.init=g.b.map(r=>r.slice());g.hist=[];g.moves=0;g.anim=null;g.done=0;g.cur=[Math.min(g.cur[0],n-2),Math.min(g.cur[1],n-2)];},
  rot(g,x,y,cw){const b=g.b,a=b[y][x],q=b[y][x+1],r=b[y+1][x+1],d=b[y+1][x];
    if(cw){b[y][x]=d;b[y][x+1]=a;b[y+1][x+1]=q;b[y+1][x]=r;}else{b[y][x]=q;b[y][x+1]=r;b[y+1][x+1]=d;b[y+1][x]=a;}},
  rowOk(g,y){return g.b[y].every(v=>v===g.b[y][0]);},
  solved(g){for(let y=0;y<g.n;y++)if(!this.rowOk(g,y))return false;return true;},
  turn(g,cw){if(g.anim||g.done>0)return;const [x,y]=g.cur;this.rot(g,x,y,cw);g.hist.push([x,y,cw]);g.moves++;g.anim={x,y,cw,t:.15};A.beep(cw?520:440,.05,'triangle');
    if(this.solved(g)){const pts=40+10*g.lv+(g.moves<=g.par?50:0);g.score+=pts;g.time+=15;g.done=1.3;g.msg='Готово! +'+pts+(g.moves<=g.par?' (перфектно!)':'')+' · +15 сек';A.tune([523,659,784,1046]);}},
  undo(g){if(g.anim||g.done>0||!g.hist.length)return;const [x,y,cw]=g.hist.pop();g.cur=[x,y];this.rot(g,x,y,!cw);g.moves--;g.anim={x,y,cw:!cw,t:.15};A.beep(300,.05);},
  key(g,k){if(g.done>0)return;const n=g.n;
    if(k==='ArrowLeft'||k==='KeyA')g.cur[0]=Math.max(0,g.cur[0]-1);
    else if(k==='ArrowRight'||k==='KeyD')g.cur[0]=Math.min(n-2,g.cur[0]+1);
    else if(k==='ArrowUp'||k==='KeyW')g.cur[1]=Math.max(0,g.cur[1]-1);
    else if(k==='ArrowDown'||k==='KeyS')g.cur[1]=Math.min(n-2,g.cur[1]+1);
    else if(k==='Space'||k==='Enter'||k==='KeyE')this.turn(g,true);
    else if(k==='KeyX'||k==='KeyQ')this.turn(g,false);
    else if(k==='Backspace'||k==='KeyU')this.undo(g);
    else if(k==='KeyR'&&!g.anim){g.b=g.init.map(r=>r.slice());g.hist=[];g.moves=0;A.beep(200,.1);}},
  aim(g,mx,my){const n=g.n,s=g.cell;if(mx<g.ox-20||mx>g.ox+n*s+20||my<g.oy-20||my>g.oy+n*s+20)return false;
    g.cur=[A.clamp(Math.round((mx-g.ox)/s-1),0,n-2),A.clamp(Math.round((my-g.oy)/s-1),0,n-2)];return true;},
  move(g,mx,my){this.aim(g,mx,my);},
  click(g,mx,my,btn){
    if(my>318&&my<350){if(mx>40&&mx<200)this.undo(g);else if(mx>280&&mx<440&&!g.anim&&g.done<=0){g.b=g.init.map(r=>r.slice());g.hist=[];g.moves=0;A.beep(200,.1);}return;}
    if(this.aim(g,mx,my))this.turn(g,btn!==2);},
  update(g,dt){if(g.anim){g.anim.t-=dt;if(g.anim.t<=0)g.anim=null;}
    if(g.done>0){g.done-=dt;if(g.done<=0)this.make(g);return;}
    g.time-=dt;if(g.time<=0){g.time=0;A.over(g,'Времето изтече! Решени: '+(g.lv-1));}},
  tile(x,y,s,v){const col=g=>TW_COL[g];A.block(x+2,y+2,s-4,col(v));c.fillStyle='rgba(0,0,0,.35)';const m=x+s/2,k=y+s/2,u=Math.max(3,Math.floor(s/9));
    if(v===0)c.fillRect(m-u,k-u,u*2,u*2);
    else if(v===1){c.fillRect(m-u*3,k-u/2,u*6,u);c.fillRect(m-u/2,k-u*3,u,u*6);}
    else if(v===2){c.fillRect(m-u*3,k-u*2,u*6,u);c.fillRect(m-u*3,k+u,u*6,u);}
    else if(v===3){c.fillRect(m-u*2,k-u*3,u,u*6);c.fillRect(m+u,k-u*3,u,u*6);}
    else{c.fillRect(m-u*2,k-u*2,u,u);c.fillRect(m+u,k-u*2,u,u);c.fillRect(m-u*2,k+u,u,u);c.fillRect(m+u,k+u,u,u);c.fillRect(m-u/2,k-u/2,u,u);}},
  draw(g){A.bg('#2b2233');const n=g.n,s=g.cell,an=g.anim;
    c.fillStyle='#3d2f47';c.fillRect(g.ox-8,g.oy-8,n*s+16,n*s+16);
    const inAn=(x,y)=>an&&x>=an.x&&x<=an.x+1&&y>=an.y&&y<=an.y+1;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!inAn(x,y))this.tile(g.ox+x*s,g.oy+y*s,s,g.map[g.b[y][x]]);
    if(an){const cx=g.ox+(an.x+1)*s,cy=g.oy+(an.y+1)*s,ang=(an.cw?-1:1)*Math.PI/2*(an.t/.15);
      c.save();c.translate(cx,cy);c.rotate(ang);for(let y=an.y;y<=an.y+1;y++)for(let x=an.x;x<=an.x+1;x++)this.tile((x-an.x-1)*s,(y-an.y-1)*s,s,g.map[g.b[y][x]]);c.restore();}
    for(let y=0;y<n;y++)if(this.rowOk(g,y))A.txt('✔',g.ox+n*s+16,g.oy+y*s+s/2,18,'#7dff7a');
    if(g.done<=0){const [x,y]=g.cur,p=Math.sin(g.t*6)*1.5;c.strokeStyle='#ffd54f';c.lineWidth=4;c.strokeRect(g.ox+x*s-p,g.oy+y*s-p,s*2+p*2,s*2+p*2);
      c.fillStyle='#ffd54f';c.beginPath();c.arc(g.ox+(x+1)*s,g.oy+(y+1)*s,5,0,7);c.fill();}
    A.txt('⏱ '+Math.ceil(g.time),10,16,16,g.time<20?'#ff6b6b':'#fff');A.txt('Пъзел '+g.lv,240,16,16,'#ffd54f','center');
    A.txt('Ходове: '+g.moves+' / '+g.par,470,16,14,g.moves<=g.par?'#7dff7a':'#fff','right');
    A.txt('Всеки ред — един цвят!',240,36,13,'#cbb8dd','center');
    A.block(40,318,160,'#5a6b8c',32);A.txt('↶ Назад',120,334,15,'#fff','center');A.block(280,318,160,'#5a6b8c',32);A.txt('⟲ Отначало',360,334,15,'#fff','center');
    if(g.done>0){c.fillStyle='rgba(0,0,0,.5)';c.fillRect(0,150,480,60);A.txt(g.msg,240,180,g.msg.length>32?14:18,'#7dff7a','center');}}
});
</script>
</body>
</html>
