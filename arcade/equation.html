<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уравнения</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🟰 Уравнения</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 71. Уравнения
A.add(numGame({id:'equation',cat:'brain',icon:'🟰',name:'Уравнения',desc:'Намери x',help:'Реши уравнението и напиши колко е x. Enter за проверка. 60 секунди.',
  next(g){const s=g.score,x=A.ri(s>6?-9:1,9+s),a=A.ri(2,Math.min(9,2+s)),b=A.ri(-10,20);
    if(s<4){g.q='x + '+b+' = '+(x+b);if(b<0)g.q='x − '+(-b)+' = '+(x+b);}
    else if(s<10)g.q=a+'x '+(b<0?'− '+(-b):'+ '+b)+' = '+(a*x+b);
    else{const c2=A.ri(1,a-1);g.q=a+'x '+(b<0?'− '+(-b):'+ '+b)+' = '+c2+'x + '+((a-c2)*x+b);}
    g.ans=x;g.q+='   x = ?';}}));
</script>
</body>
</html>
