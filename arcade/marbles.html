<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пързалка за топчета</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🔵 Пързалка за топчета</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 224. Пързалка за топчета
A.add({id:'marbles',cat:'board',icon:'🔵',name:'Пързалка за топчета',desc:'Начертай пързалки',noScore:true,help:'Влачи с мишката, за да начертаеш наклонена линия. Топчета падат отгоре и се търкалят по линиите ти. Опитай да ги вкараш в кошчето долу вдясно! C — изчисти линиите.',
  start(g){g.lines=[];g.balls=[];g.sp=0;g.inBox=0;},
  click(g,mx,my){g.drag={x:mx,y:my};},
  release(g,mx,my){if(g.drag&&Math.hypot(mx-g.drag.x,my-g.drag.y)>15)g.lines.push([g.drag.x,g.drag.y,mx,my]);g.drag=null;},
  key(g,k){if(k==='KeyC')g.lines=[];},
  update(g,dt){g.sp-=dt;if(g.sp<=0){g.sp=.6;g.balls.push({x:60+A.rnd(-10,10),y:-10,vx:0,vy:0,col:'hsl('+A.ri(0,360)+',80%,60%)'});}
    for(const b of g.balls){for(let s=0;s<3;s++){const h=dt/3;b.vy+=500*h;b.x+=b.vx*h;b.y+=b.vy*h;
        for(const[x1,y1,x2,y2]of g.lines){const L=Math.hypot(x2-x1,y2-y1),t=A.clamp(((b.x-x1)*(x2-x1)+(b.y-y1)*(y2-y1))/(L*L),0,1),px=x1+(x2-x1)*t,py=y1+(y2-y1)*t,d=Math.hypot(b.x-px,b.y-py);
          if(d<7){const nx=(b.x-px)/(d||1),ny=(b.y-py)/(d||1);b.x=px+nx*7;b.y=py+ny*7;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.3*vn*nx;b.vy-=1.3*vn*ny;}b.vx*=.998;b.vy*=.998;}}}
      if(b.x>400&&b.x<470&&b.y>310&&!b.got){b.got=1;g.inBox++;A.beep(900,.04);}}
    g.balls=g.balls.filter(b=>b.y<380&&b.x>-20&&b.x<500).slice(-60);},
  draw(g){A.bg('#f5f0e6');c.fillStyle='#8d6e3f';c.fillRect(400,310,6,50);c.fillRect(464,310,6,50);c.fillRect(400,354,70,6);A.txt('🎯 '+g.inBox,435,295,14,'#333','center');
    c.strokeStyle='#333';c.lineWidth=5;c.lineCap='round';for(const[a,b,x,y]of g.lines){c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke();}if(g.drag){c.strokeStyle='#999';c.beginPath();c.moveTo(g.drag.x,g.drag.y);c.lineTo(A.mouse.x,A.mouse.y);c.stroke();}c.lineCap='butt';
    for(const b of g.balls){c.fillStyle=b.col;c.beginPath();c.arc(b.x,b.y,6,0,7);c.fill();}A.block(45,0,30,'#555',10);}
});
</script>
</body>
</html>
