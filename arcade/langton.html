<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мравката на Лангтън</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🐜 Мравката на Лангтън</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 97. Мравката на Лангтън
A.add({id:'langton',cat:'board',icon:'🐜',name:'Мравката на Лангтън',desc:'Прости правила, сложен свят',noScore:true,help:'Мравката завива според цвета на полето и го сменя. Space — пауза, ↑ ↓ — скорост, 1–4 — различни правила, R — отначало. След ~10 000 стъпки строи "магистрала"!',
  W:96,H:66,RULES:['RL','RLR','LLRR','LRRRRRLLR'],
  start(g){g.rule=0;this.reset(g);g.speed=50;g.run=true;},
  reset(g){g.m=new Uint8Array(this.W*this.H);g.x=48;g.y=33;g.d=0;g.steps=0;},
  key(g,k,ch){if(k==='Space')g.run=!g.run;if(k==='ArrowUp')g.speed=Math.min(5000,g.speed*2);if(k==='ArrowDown')g.speed=Math.max(1,Math.floor(g.speed/2));if(k==='KeyR')this.reset(g);const n=+ch;if(n>=1&&n<=4){g.rule=n-1;this.reset(g);}},
  update(g){if(!g.run)return;const R=this.RULES[g.rule],W=this.W,H=this.H;for(let s=0;s<g.speed;s++){const i=g.y*W+g.x,v=g.m[i];g.d=(g.d+(R[v]==='R'?1:3))%4;g.m[i]=(v+1)%R.length;
      g.x=(g.x+[0,1,0,-1][g.d]+W)%W;g.y=(g.y+[-1,0,1,0][g.d]+H)%H;g.steps++;}},
  draw(g){A.bg('#111');const cols=['#111',C.gold,C.red,C.water,C.grass,C.purple,'#ff8c1a','#fff',C.gem];for(let i=0;i<g.m.length;i++)if(g.m[i]){c.fillStyle=cols[g.m[i]];c.fillRect((i%this.W)*5,Math.floor(i/this.W)*5,5,5);}
    c.fillStyle='#f33';c.fillRect(g.x*5,g.y*5,5,5);c.fillStyle='#000';c.fillRect(0,332,480,28);A.txt('Правило '+this.RULES[g.rule]+'   Стъпки '+g.steps+'   Скорост x'+g.speed,8,346,12,'#ffd54f');}
});
</script>
</body>
</html>
