<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портал към Недъра</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🟪 Портал към Недъра</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 294. Портал към Недъра
let g_t=0;
const NC_KEYS=['1','2','3','4','5','6','7','8','9','0','−','⌫','✓'];
A.add({id:'nethercoords',cat:'brain',icon:'🟪',name:'Портал към Недъра',desc:'1 блок в Недъра = 8 блока в обикновения свят: смятай къде да строиш порталите',
  help:'В Minecraft 1 блок в Недъра е равен на 8 блока в обикновения свят. От обикновения свят към Недъра — дели на 8, обратно — умножи по 8. Напиши отговора с цифрите + Enter (минус с клавиша -) или с бутоните долу. Бърз отговор (под 12 сек.) = бонус точка. 3 живота, на всеки 4 верни нивото расте.',
  start(g){g.lvl=1;g.ok=0;g.lives=3;g.inp='';g.msg='';g.mt=0;this.next(g);},
  next(g){const L=g.lvl,T=[0,1];if(L>=2)T.push(2);if(L>=3)T.push(3,4);if(L>=4)T.push(5);
    const t=A.pick(T),mx=Math.min(40,6+L*6);g.t2=t;g.inp='';g.qt=0;let n=A.ri(2,mx);
    if(t===0){g.ow=n*8;g.ne=n;g.q='Ти си на X = '+g.ow+'. Къде да е порталът в Недъра?';g.ans=n;g.dir=1;}
    else if(t===1){g.ow=n*8;g.ne=n;g.q='Порталът в Недъра е на X = '+n+'. Къде ще излезеш?';g.ans=g.ow;g.dir=-1;}
    else if(t===2){g.ow=n*8;g.ne=n;g.q='Селото е на '+g.ow+' блока. Колко блока вървиш в Недъра?';g.ans=n;g.dir=1;}
    else if(t===3){g.ow=-n*8;g.ne=-n;if(Math.random()<.5){g.q='Ти си на X = '+g.ow+'. Къде да е порталът в Недъра?';g.ans=g.ne;g.dir=1;}
      else{g.q='Порталът в Недъра е на X = '+g.ne+'. Къде ще излезеш?';g.ans=g.ow;g.dir=-1;}}
    else if(t===4){const a=A.ri(1,mx),b=a+A.ri(2,10);g.ow=b*8;g.ne=b;g.q='В Недъра вървиш от X = '+a+' до X = '+b+'. Колко блока е това горе?';g.ans=(b-a)*8;g.dir=-1;}
    else{g.ow=n*8+A.ri(1,7);g.ne=Math.floor(g.ow/8);g.q='Ти си на X = '+g.ow+'. Недър X = ? (закръгли надолу)';g.ans=g.ne;g.dir=1;}},
  submit(g){if(!g.inp||g.inp==='-'||g.mt>0)return;const ok=+g.inp===g.ans;flash(g,ok);
    if(ok){const pts=g.lvl+(g.qt<12?1:0);g.score+=pts;g.ok++;g.good=1;g.msg='Вярно! +'+pts;if(g.ok%4===0){g.lvl++;g.msg+='  · Ниво '+g.lvl+'!';}}
    else{g.lives--;g.good=0;g.msg='Не! Отговорът е '+g.ans+'  ('+this.why(g)+')';if(g.lives<=0)return A.over(g,'Отговорът беше '+g.ans);}
    g.mt=ok?1.1:3;},
  why(g){return g.t2===4?'('+g.ne+' − '+(g.ne-g.ans/8)+') × 8':g.dir>0?g.ow+' : 8':g.ne+' × 8';},
  key(g,k,ch){if(g.mt>0)return;if(typeNum(g,k,ch))this.submit(g);},
  click(g,mx,my){if(g.mt>0||my<268||my>352)return;const col=Math.floor((mx-9)/66),row=my<310?0:1;if(col<0||col>6)return;
    const kk=NC_KEYS[row*7+col];if(!kk)return;if(kk==='⌫')g.inp=g.inp.slice(0,-1);else if(kk==='✓')this.submit(g);else if(kk==='−'){if(!g.inp)g.inp='-';}else if(g.inp.length<6){g.inp+=kk;A.beep(700,.02);}},
  update(g,dt){if(g.fl)g.fl.t-=dt;g.qt+=dt;if(g.mt>0){g.mt-=dt;if(g.mt<=0){g.msg='';this.next(g);}}},
  portal(x,y){for(let i=0;i<4;i++){A.block(x,y+i*12,12,'#1b1030');A.block(x+36,y+i*12,12,'#1b1030');}A.block(x+12,y,24,'#1b1030',12);A.block(x+12,y+36,24,'#1b1030',12);
    c.fillStyle=Math.sin(g_t*6)>0?'#8e24aa':'#aa47bc';c.fillRect(x+12,y+12,24,24);},
  draw(g){A.bg('#1a1420');g_t=g.t;
    // горе: обикновеният свят, долу: Недъра
    c.fillStyle='#6fb3e8';c.fillRect(10,36,460,58);for(let x=10;x<470;x+=20){A.block(x,94,20,'#5aa13a',8);}
    c.fillStyle='#4a1414';c.fillRect(10,104,460,58);for(let x=10;x<470;x+=20){A.block(x,154,20,'#7b2b2b',8);}
    A.txt('Обикновен свят',462,46,11,'#0d2a44','right');A.txt('Недър',462,114,11,'#ffab91','right');
    // линийка: 8 малки блока горе = 1 голям долу
    for(let i=0;i<8;i++)A.block(300+i*10,80,10,'#7a5233');A.block(300,138,80,'#a33',16);A.txt('8 = 1',388,110,13,'#ffd54f');
    this.portal(g.dir>0?60:200,44);c.save();c.globalAlpha=.9;this.portal(g.dir>0?200:60,108);c.restore();
    A.txt(g.dir>0?'→':'←',165,100,26,'#ffd54f','center');
    A.txt(g.q,240,180,g.q.length>48?11:g.q.length>40?13:15,'#fff','center');
    c.fillStyle='#000';c.fillRect(170,198,140,42);c.strokeStyle=g.mt>0?(g.good?'#4caf50':'#f44336'):'#ffd54f';c.lineWidth=3;c.strokeRect(170,198,140,42);
    A.txt(g.mt>0&&!g.good?String(g.ans):(g.inp+(g.mt<=0&&Math.sin(g.t*8)>0?'_':'')),240,219,24,'#fff','center');
    A.txt(g.qt<12&&g.mt<=0?'⚡'+Math.ceil(12-g.qt):'',360,219,16,'#4dd0e1','center');
    if(g.msg)A.txt(g.msg,240,254,g.msg.length>44?11:13,g.good?'#c8f7c5':'#ffccbc','center');
    NC_KEYS.forEach((k,i)=>{const x=9+(i%7)*66,y=270+Math.floor(i/7)*42;A.block(x,y,62,k==='✓'?'#3f8a24':k==='⌫'?'#a84a3a':k==='−'?'#6a4a8c':'#5a6b8c',38);A.txt(k,x+31,y+19,18,'#fff','center');});
    c.fillStyle='#000';c.fillRect(0,0,480,28);
    A.txt('Ниво '+g.lvl,8,14,14,'#ffd54f');A.txt('Точки: '+g.score,240,14,14,'#fff','center');A.txt('❤'.repeat(Math.max(0,g.lives)),472,14,14,'#f55','right');
    drawFlash(g);}
});

</script>
</body>
</html>
