<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тежкият блок</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">⚖️ Тежкият блок</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 67. Везна: тежкият блок
A.add({id:'weigh',cat:'puzzle',icon:'⚖️',name:'Тежкият блок',desc:'Намери го с 2 претегляния',help:'Един от 9-те блока е по-тежък. Кликни блок, за да го сложиш вляво → вдясно → махни. Space — претегли (имаш 2). После натисни G и кликни тежкия блок.',
  start(g){this.make(g);},
  make(g){g.heavy=A.ri(0,8);g.pan=Array(9).fill(0);g.left=2;g.res=null;g.guess=false;g.hist=[];},
  key(g,k){if(k==='Space'&&g.left>0&&!g.guess){const L=g.pan.map((p,i)=>p===1?i:-1).filter(i=>i>=0),R=g.pan.map((p,i)=>p===2?i:-1).filter(i=>i>=0);
      const wl=L.length+(L.includes(g.heavy)?.5:0),wr=R.length+(R.includes(g.heavy)?.5:0);g.res=wl>wr?-1:wl<wr?1:0;g.left--;A.beep(300,.1);
      g.hist.push('['+L.map(i=>i+1).join(',')+'] '+(g.res<0?'>':g.res>0?'<':'=')+' ['+R.map(i=>i+1).join(',')+']');}
    if(k==='KeyG'){g.guess=true;A.beep(600,.05);}},
  click(g,mx,my){const i=Math.floor((mx-15)/50);if(i<0||i>8||my<280||my>330)return;
    if(g.guess){if(i===g.heavy){g.score++;A.tune([523,659,784]);this.make(g);}else A.over(g,'Беше блок '+(g.heavy+1));return;}g.pan[i]=(g.pan[i]+1)%3;A.beep(400,.03);},
  draw(g){A.bg('#2a2018');const tilt=(g.res||0)*.15;c.save();c.translate(240,120);c.rotate(tilt);c.fillStyle=C.wood;c.fillRect(-170,-4,340,8);
    const L=g.pan.map((p,i)=>p===1?i:-1).filter(i=>i>=0),R=g.pan.map((p,i)=>p===2?i:-1).filter(i=>i>=0);
    L.forEach((b,k)=>A.block(-160+k*22,-26,20,C.stone));R.forEach((b,k)=>A.block(60+k*22,-26,20,C.stone));c.restore();c.fillStyle=C.wood;c.fillRect(236,120,8,120);
    for(let i=0;i<9;i++){const x=15+i*50;A.block(x+5,285,40,g.pan[i]===1?'#5a8ad6':g.pan[i]===2?'#d6845a':C.stone);A.txt(i+1,x+25,305,16,'#fff','center');}
    A.txt('Претегляния: '+g.left+(g.guess?'   👉 Кликни тежкия!':'   (G = познай)'),240,20,14,'#ffd54f','center');g.hist.forEach((h,i)=>A.txt(h,240,250+i*0-0+(i*14)-30,12,'#bbb','center'));
    A.txt('синьо = ляво, оранжево = дясно',240,345,12,'#999','center');}
});
</script>
</body>
</html>
