<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цветна врата</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🌈 Цветна врата</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 155. Цветна врата
A.add({id:'colorgate',cat:'action',icon:'🌈',name:'Цветна врата',desc:'Смени цвета, за да минеш',help:'Стените идват отгоре. Space / клик сменя цвета на блока ти. Минаваш само през стена със СЪЩИЯ цвят!',
  cols:[C.red,C.gold,C.grass,C.water],
  start(g){g.c=0;g.walls=[];g.sp=0;},
  key(g,k){if(k==='Space'||k==='ArrowUp'){g.c=(g.c+1)%4;A.beep(300+g.c*120,.03);}},
  update(g,dt){const v=110+g.t*3;g.sp-=dt;if(g.sp<=0){g.sp=Math.max(.9,2-g.t*.02);g.walls.push({y:-20,c:A.ri(0,Math.min(3,1+Math.floor(g.t/10)))});}
    for(const w of g.walls){w.y+=v*dt;if(!w.done&&w.y>=290&&w.y<=310){w.done=1;if(w.c!==g.c)return A.over(g,'Грешен цвят!');g.score++;A.beep(900,.04);}}g.walls=g.walls.filter(w=>w.y<380);},
  draw(g){A.bg('#14101c');for(const w of g.walls)A.block(0,w.y,480,this.cols[w.c],16);A.block(228,296,24,this.cols[g.c]);c.strokeStyle='#fff';c.lineWidth=2;c.strokeRect(228,296,24,24);}
});
</script>
</body>
</html>
