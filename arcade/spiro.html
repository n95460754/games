<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спирограф</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🌀 Спирограф</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 212. Спирограф
A.add({id:'spiro',cat:'board',icon:'🌀',name:'Спирограф',desc:'Математически шарки',noScore:true,help:'Колело се търкаля в колело и рисува. ← → сменят малкия радиус, ↑ ↓ — разстоянието на писеца. Space — нова шарка, C — изчисти.',
  start(g){g.R=120;g.r=47;g.d=60;this.reset(g);},
  reset(g){g.cv=document.createElement('canvas');g.cv.width=480;g.cv.height=360;g.x=g.cv.getContext('2d');g.x.fillStyle='#0b0b14';g.x.fillRect(0,0,480,360);g.th=0;g.prev=null;g.hue=A.ri(0,360);},
  key(g,k){if(k==='ArrowLeft')g.r=Math.max(5,g.r-3);if(k==='ArrowRight')g.r=Math.min(115,g.r+3);if(k==='ArrowUp')g.d+=4;if(k==='ArrowDown')g.d=Math.max(0,g.d-4);if(k==='Space'){g.r=A.ri(15,100);g.d=A.ri(20,100);}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyC'].includes(k))this.reset(g);},
  repeat:true,
  update(g,dt){const x=g.x;for(let s=0;s<40;s++){g.th+=.02;const R=g.R,r=g.r,d=g.d,t=g.th;const px=240+(R-r)*Math.cos(t)+d*Math.cos((R-r)/r*t),py=180+(R-r)*Math.sin(t)-d*Math.sin((R-r)/r*t);
      if(g.prev){x.strokeStyle='hsl('+((g.hue+g.th*3)%360)+',90%,60%)';x.lineWidth=1.5;x.beginPath();x.moveTo(...g.prev);x.lineTo(px,py);x.stroke();}g.prev=[px,py];}},
  draw(g){c.drawImage(g.cv,0,0);A.txt('R='+g.R+'  r='+g.r+'  d='+g.d,8,12,12,'#bbb');}
});
</script>
</body>
</html>
