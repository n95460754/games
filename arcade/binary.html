<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Двоичен код</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">💾 Двоичен код</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 27. Двоичен код
A.add({id:'binary',cat:'brain',icon:'💾',name:'Двоичен код',desc:'Състави числото от битове',help:'Включи битовете (клик или клавиши 1–8), чийто сбор е равен на числото горе. 128+64+…+1. 60 секунди.',
  start(g){g.time=60;g.bits=Array(8).fill(0);this.next(g);},
  next(g){g.target=A.ri(1,Math.min(255,15+g.score*20));g.bits.fill(0);},
  val(g){return g.bits.reduce((a,b,i)=>a+(b?128>>i:0),0);},
  flip(g,i){g.bits[i]^=1;A.beep(400+i*60,.03);if(this.val(g)===g.target){g.score++;flash(g,true);this.next(g);}},
  key(g,k,ch){const n=+ch;if(n>=1&&n<=8)this.flip(g,n-1);},
  click(g,mx,my){if(my>150&&my<210){const i=Math.floor((mx-24)/56);if(i>=0&&i<8)this.flip(g,i);}},
  update(g,dt){tick(g,dt);},
  draw(g){A.bg('#0f1d14');A.txt('Направи: '+g.target,240,70,32,'#9ccc65','center');
    g.bits.forEach((b,i)=>{A.block(24+i*56+4,150,48,b?'#2ecc40':'#2a3a2a',60);A.txt(b,24+i*56+28,180,22,'#fff','center');A.txt(128>>i,24+i*56+28,230,14,'#bbb','center');});
    A.txt('Сега: '+this.val(g),240,280,20,'#fff','center');A.txt('⏱ '+Math.ceil(g.time),20,20,16);drawFlash(g);}
});
</script>
</body>
</html>
