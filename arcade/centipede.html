<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стоножката</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🐛 Стоножката</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 250. Стоножката
A.add({id:'centipede',cat:'action',icon:'🐛',name:'Стоножката',desc:'Стреляй по стоножката, която пълзи надолу между камъните',help:'Стрелки / WASD — движение, Space (задръж) — стрелба. С мишка / пръст: движи се след показалеца и задръж за стрелба. Ударен сегмент става камък и стоножката се разделя! Паякът дава 50 точки.',
  start(g){g.lives=3;g.wave=0;g.st={};g.bul=null;g.px=240;g.py=330;g.useM=false;g.inv=0;g.parts=[];
    for(let i=0;i<32;i++){const x=A.ri(0,23),y=A.ri(1,13);g.st[x+','+y]=3;}
    this.wave(g);},
  wave(g){g.wave++;const n=Math.min(16,7+g.wave);g.seg=[];for(let i=0;i<n;i++)g.seg.push({x:n-1-i,y:0,dx:1,dy:1});
    g.tick=0;g.sp=Math.max(.05,.13-g.wave*.008);g.spider={x:-20,y:300,vx:90,vy:70,t:A.rnd(3,6),on:false};},
  key(g,k){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS'].includes(k))g.useM=false;},
  move(g){g.useM=true;},
  click(g){g.useM=true;},
  isHead(g,i){if(!i)return true;const a=g.seg[i-1],b=g.seg[i];return Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y))>1;},
  fire(g){if(g.bul)return;g.bul={x:g.px,y:g.py-10};A.beep(1200,.03,'square',.02);},
  boom(g,x,y,col){for(let i=0;i<6;i++)g.parts.push({x,y,vx:A.rnd(-90,90),vy:A.rnd(-120,40),t:.5,col});},
  update(g,dt){
    const K=A.keys,sp=190*dt;
    if(g.useM){const tx=A.clamp(A.mouse.x,10,470),ty=A.clamp(A.mouse.y,290,350);g.px+=A.clamp(tx-g.px,-sp*1.6,sp*1.6);g.py+=A.clamp(ty-g.py,-sp*1.6,sp*1.6);}
    else{if(K.ArrowLeft||K.KeyA)g.px-=sp;if(K.ArrowRight||K.KeyD)g.px+=sp;if(K.ArrowUp||K.KeyW)g.py-=sp;if(K.ArrowDown||K.KeyS)g.py+=sp;}
    g.px=A.clamp(g.px,10,470);g.py=A.clamp(g.py,290,350);
    if(K.Space||A.mouse.down)this.fire(g);
    // куршум
    if(g.bul){const b=g.bul;b.y-=620*dt;if(b.y<0)g.bul=null;else{
      const cx=Math.floor(b.x/20),cy=Math.floor(b.y/20),key=cx+','+cy;
      const si=g.seg.findIndex(s=>s.x===cx&&s.y===cy);
      if(si>=0){const head=this.isHead(g,si);
        g.score+=head?20:10;g.seg.splice(si,1);if(cy<17)g.st[key]=3;this.boom(g,cx*20+10,cy*20+10,'#7cb342');A.beep(500,.06);g.bul=null;}
      else if(g.st[key]){g.st[key]--;if(!g.st[key]){delete g.st[key];g.score++;this.boom(g,cx*20+10,cy*20+10,'#9e9e9e');}A.beep(300,.03);g.bul=null;}
      else{const p=g.spider;if(p.on&&Math.abs(b.x-p.x)<14&&Math.abs(b.y-p.y)<12){g.score+=50;p.on=false;p.t=A.rnd(4,8);this.boom(g,p.x,p.y,'#e53935');A.tune([700,900]);g.bul=null;}}
    }}
    // стоножка
    g.tick+=dt;
    while(g.tick>=g.sp){g.tick-=g.sp;
      for(const s of g.seg){const nx=s.x+s.dx;
        if(nx<0||nx>23||g.st[nx+','+s.y]){s.dx=-s.dx;s.y+=s.dy;
          if(s.y>17){s.y=16;s.dy=-1;}else if(s.dy<0&&s.y<14){s.y=14;s.dy=1;}}
        else s.x=nx;}
    }
    // паяк
    const p=g.spider;
    if(!p.on){p.t-=dt;if(p.t<=0){p.on=true;p.x=Math.random()<.5?-10:490;p.vx=(p.x<0?1:-1)*A.rnd(70,110);p.y=A.rnd(260,330);p.vy=A.rnd(60,110)*(Math.random()<.5?1:-1);}}
    else{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y<240||p.y>350){p.vy=-p.vy;p.y=A.clamp(p.y,240,350);}if(Math.random()<dt*.8)p.vy=-p.vy;
      const k=Math.floor(p.x/20)+','+Math.floor(p.y/20);if(g.st[k]&&Math.random()<dt*3)delete g.st[k];
      if(p.x<-30||p.x>510){p.on=false;p.t=A.rnd(3,7);}}
    // частици
    g.parts=g.parts.filter(q=>(q.t-=dt)>0);g.parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;});
    // сблъсък с играча
    g.inv-=dt;
    if(g.inv<=0){const hit=g.seg.some(s=>Math.abs(s.x*20+10-g.px)<16&&Math.abs(s.y*20+10-g.py)<16)||(p.on&&Math.abs(p.x-g.px)<18&&Math.abs(p.y-g.py)<16);
      if(hit){g.lives--;g.inv=2;A.beep(120,.3,'sawtooth',.06);this.boom(g,g.px,g.py,'#4fc3f7');
        if(!g.lives)return A.over(g,'Стоножката те хвана!');
        g.seg.forEach(s=>{if(s.y>=13){s.y=1;s.dy=1;}});p.on=false;p.t=3;g.px=240;g.py=330;}}
    if(!g.seg.length){g.score+=100;A.tune([660,880,1100]);this.wave(g);}
  },
  draw(g){A.bg('#2b1d14');
    for(let x=0;x<24;x++)for(let y=0;y<18;y++)if((x*7+y*3)%5===0){c.fillStyle='#33241a';c.fillRect(x*20,y*20,20,20);}
    c.fillStyle='rgba(90,161,58,.18)';c.fillRect(0,280,480,80);
    for(const k in g.st){const [x,y]=k.split(',').map(Number),h=g.st[k];A.block(x*20+1,y*20+1,18,h>2?'#8d8d8d':h>1?'#757575':'#5e5e5e');
      if(h<3){c.fillStyle='#222';c.fillRect(x*20+5,y*20+8,8,2);}if(h<2)c.fillRect(x*20+9,y*20+4,2,10);}
    g.seg.forEach((s,i)=>{const x=s.x*20,y=s.y*20,head=this.isHead(g,i);
      A.block(x+1,y+1,18,head?'#c62828':(i%2?'#7cb342':'#8bc34a'));
      c.fillStyle='#1b1b1b';c.fillRect(x+3,y+17,3,3);c.fillRect(x+14,y+17,3,3);
      if(head){c.fillStyle='#fff';c.fillRect(x+(s.dx>0?11:4),y+5,5,5);c.fillStyle='#000';c.fillRect(x+(s.dx>0?13:5),y+6,2,3);}});
    const p=g.spider;if(p.on){A.block(p.x-9,p.y-7,18,'#4a148c',14);c.fillStyle='#000';for(let i=0;i<4;i++){c.fillRect(p.x-16,p.y-6+i*4,7,2);c.fillRect(p.x+9,p.y-6+i*4,7,2);}c.fillStyle='#f44336';c.fillRect(p.x-5,p.y-4,3,3);c.fillRect(p.x+2,p.y-4,3,3);}
    if(g.bul){c.fillStyle='#ffd54f';c.fillRect(g.bul.x-2,g.bul.y-6,4,10);}
    if(g.inv<=0||Math.floor(g.t*10)%2){A.block(g.px-9,g.py-8,18,'#29b6f6',16);c.fillStyle='#ffd54f';c.fillRect(g.px-2,g.py-14,4,7);c.fillStyle='#000';c.fillRect(g.px-5,g.py-3,3,3);c.fillRect(g.px+2,g.py-3,3,3);}
    g.parts.forEach(q=>{c.fillStyle=q.col;c.fillRect(q.x-2,q.y-2,4,4);});
    A.txt('❤'.repeat(g.lives),10,12,14,'#f55');A.txt('Вълна '+g.wave,470,12,13,'#ffd54f','right');}
});
</script>
</body>
</html>
