<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Магазинът</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🛒 Магазинът</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 135. Магазинът
A.add(numGame({id:'shop',cat:'brain',icon:'🛒',name:'Магазинът',desc:'Сметни сметката',help:'Колко струва всичко в кошницата (в евро)? Напиши цялото число. 60 секунди.',
  I:[['🍎','ябълка'],['🍞','хляб'],['🥛','мляко'],['🍫','шоколад'],['🧃','сок'],['🍌','банан'],['🧀','сирене']],
  next(g){g.items=A.shuffle(this.I.slice()).slice(0,A.ri(2,Math.min(4,2+Math.floor(g.score/3)))).map(([e,n])=>({e,n,p:A.ri(1,6),q:A.ri(1,4)}));g.ans=g.items.reduce((s,i)=>s+i.p*i.q,0);g.q='Общо = ? €';},
  pic(g){g.items.forEach((it,i)=>A.txt(it.q+' × '+it.e+' '+it.n+' по '+it.p+' €',240,100+i*30,17,'#fff','center'));}}));
</script>
</body>
</html>
