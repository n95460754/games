<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Монети</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🪙 Монети</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 78. Монети
A.add(numGame({id:'coins',cat:'brain',icon:'🪙',name:'Монети',desc:'Колко пари има тук?',help:'Събери стойността на монетите и напиши сумата в ЦЕНТОВЕ (1 € = 100 цента). 60 секунди.',
  V:[1,2,5,10,20,50,100,200],
  next(g){g.c=[];for(let i=0;i<A.ri(2,Math.min(9,3+g.score));i++)g.c.push(A.pick(g.score<4?[1,2,5,10,20,50]:this.V));g.ans=g.c.reduce((a,b)=>a+b,0);g.q='Общо центове = ?';},
  pic(g){g.c.forEach((v,i)=>{const x=50+(i%5)*95,y=110+Math.floor(i/5)*80,r=v>=100?30:v>=10?26:20;c.fillStyle=v>=100?'#c0c0c0':v>=10?'#e8c050':'#c87533';c.beginPath();c.arc(x,y,r,0,7);c.fill();
    if(v>=100){c.fillStyle='#e8c050';c.beginPath();c.arc(x,y,r-8,0,7);c.fill();}A.txt(v>=100?(v/100)+'€':v+'c',x,y,15,'#222','center');});}}));
</script>
</body>
</html>
