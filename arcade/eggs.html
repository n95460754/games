<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Яйцата</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🥚 Яйцата</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 151. Яйцата
A.add({id:'eggs',cat:'action',icon:'🥚',name:'Яйцата',desc:'Хвани яйцата в кошницата',help:'Кокошките снасят по 4 улея. Q / A / P / L (или ← → ↑ ↓ / клик в ъгъла) — сложи кошницата в съответния ъгъл. 3 счупени и край.',
  start(g){g.pos=0;g.eggs=[];g.sp=0;g.broken=0;},
  key(g,k){const m={KeyQ:0,ArrowUp:0,KeyA:1,ArrowLeft:1,KeyP:2,ArrowRight:2,KeyL:3,ArrowDown:3}[k];if(m!==undefined)g.pos=m;},
  click(g,mx,my){g.pos=(mx<240?0:2)+(my>180?1:0);},
  update(g,dt){g.sp-=dt;if(g.sp<=0){g.sp=Math.max(.45,1.3-g.t*.015);g.eggs.push({c:A.ri(0,3),p:0});}
    for(const e of g.eggs){e.p+=dt*(.45+g.t*.006);if(e.p>=1&&!e.done){e.done=1;if(e.c===g.pos){g.score++;A.beep(800,.04);}else{g.broken++;A.beep(120,.2,'sawtooth');if(g.broken>=3)return A.over(g,'Счупиха се 3 яйца');}}}g.eggs=g.eggs.filter(e=>!e.done);},
  draw(g){A.bg('#ffe0b2');const ch=[[40,60],[40,170],[440,60],[440,170]];ch.forEach(([x,y],i)=>{A.block(x-20,y-30,40,'#fff',30);c.fillStyle=C.red;c.fillRect(x-4,y-38,8,8);c.strokeStyle=C.wood;c.lineWidth=6;c.beginPath();c.moveTo(x+(i<2?20:-20),y);c.lineTo(i<2?190:290,y+70);c.stroke();});
    for(const e of g.eggs){const[x,y]=ch[e.c],tx=e.c<2?190:290,ty=y+70;c.fillStyle='#fff8e1';c.beginPath();c.ellipse(x+(tx-x)*e.p+(e.c<2?20:-20)*(1-e.p),y+(ty-y)*e.p-6,6,8,0,0,7);c.fill();c.strokeStyle='#bba';c.lineWidth=1;c.stroke();}
    const bx=g.pos<2?190:290,by=(g.pos%2?170:60)+80;A.block(bx-24,by,48,'#8d6e3f',20);A.block(225,250,30,'#3b7bd6',60);A.txt('Счупени: '+'🥚'.repeat(g.broken),10,340,13,'#633');}
});
</script>
</body>
</html>
