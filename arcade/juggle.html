<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жонгльор</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🤹 Жонгльор</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 81. Жонгльор
A.add({id:'juggle',cat:'skill',icon:'🤹',name:'Жонгльор',desc:'Не изпускай блоковете',help:'Кликни падащ блок, за да го подхвърлиш нагоре. С времето идват още блокове. Изпуснеш ли един — край!',
  start(g){g.b=[{x:240,y:100,vx:0,vy:0}];g.add=8;},
  click(g,mx,my){for(const b of g.b)if(Math.abs(mx-b.x)<28&&Math.abs(my-b.y)<28){b.vy=-A.rnd(380,460);b.vx=(b.x-mx)*6+A.rnd(-40,40);g.score++;A.beep(500+g.b.length*80,.05);return;}},
  update(g,dt){g.add-=dt;if(g.add<=0&&g.b.length<5){g.add=10;g.b.push({x:A.rnd(80,400),y:-20,vx:0,vy:0});}
    for(const b of g.b){b.vy+=500*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<20||b.x>460){b.vx*=-1;b.x=A.clamp(b.x,20,460);}if(b.y>380)return A.over(g,'Изпусна блок!');}},
  draw(g){A.bg('#2a1f3a');const cols=[C.red,C.gold,C.grass,C.water,C.purple];g.b.forEach((b,i)=>A.block(b.x-20,b.y-20,40,cols[i]));A.txt('Блокове: '+g.b.length,10,14,14);}
});
</script>
</body>
</html>
