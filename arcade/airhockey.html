<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Въздушен хокей</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🏒 Въздушен хокей</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 160. Въздушен хокей
A.add({id:'airhockey',cat:'action',icon:'🏒',name:'Въздушен хокей',desc:'Вкарай шайбата на робота',help:'Мишката движи твоята бухалка (долу). Удари шайбата към горната врата. Първият до 7 печели.',
  start(g){g.mx=240;g.my=300;g.ax=240;g.ay=60;g.s=[0,0];this.reset(g,1);},
  reset(g,d){g.px=240;g.py=180+d*40;g.vx=0;g.vy=0;},
  move(g,x,y){g.tx=x;g.ty=Math.max(190,y);},
  update(g,dt){const omx=g.mx,omy=g.my;if(g.tx!==undefined){g.mx+=(g.tx-g.mx)*Math.min(1,dt*20);g.my+=(g.ty-g.my)*Math.min(1,dt*20);}const mvx=(g.mx-omx)/dt,mvy=(g.my-omy)/dt;
    const ty=g.py<180?g.py-30:70,tx=g.px;g.ax+=A.clamp(tx-g.ax,-200*dt,200*dt);g.ay+=A.clamp(ty-g.ay,-200*dt,200*dt);g.ay=A.clamp(g.ay,30,170);
    g.px+=g.vx*dt;g.py+=g.vy*dt;g.vx*=.995;g.vy*=.995;if(g.px<14||g.px>466){g.vx*=-1;g.px=A.clamp(g.px,14,466);}
    if(g.py<14){if(Math.abs(g.px-240)<60){g.s[0]++;g.score=g.s[0];A.beep(900,.2);this.reset(g,-1);}else{g.vy*=-1;g.py=14;}}if(g.py>346){if(Math.abs(g.px-240)<60){g.s[1]++;A.beep(120,.2);this.reset(g,1);}else{g.vy*=-1;g.py=346;}}
    for(const[bx,by,bvx,bvy]of[[g.mx,g.my,mvx,mvy],[g.ax,g.ay,0,0]]){const dx=g.px-bx,dy=g.py-by,d=Math.hypot(dx,dy);if(d<34){const nx=dx/d,ny=dy/d;g.px=bx+nx*34;g.py=by+ny*34;const rel=(g.vx-bvx)*nx+(g.vy-bvy)*ny;if(rel<0){g.vx-=1.8*rel*nx;g.vy-=1.8*rel*ny;}if(bvx===0)g.vy+=150;A.beep(300,.02);}}
    const sp=Math.hypot(g.vx,g.vy);if(sp>700){g.vx*=700/sp;g.vy*=700/sp;}
    if(g.s[0]>=7)A.over(g,'🏆 Победа '+g.s[0]+':'+g.s[1]);else if(g.s[1]>=7)A.over(g,'Загуба '+g.s[0]+':'+g.s[1]);},
  draw(g){A.bg('#cfe8f5');c.strokeStyle='#e57373';c.lineWidth=3;c.beginPath();c.moveTo(0,180);c.lineTo(480,180);c.stroke();c.beginPath();c.arc(240,180,40,0,7);c.stroke();
    c.fillStyle='#333';c.fillRect(180,0,120,6);c.fillRect(180,354,120,6);c.fillStyle='#111';c.beginPath();c.arc(g.px,g.py,12,0,7);c.fill();
    for(const[x,y,col]of[[g.mx,g.my,'#3b7bd6'],[g.ax,g.ay,C.red]]){c.fillStyle=col;c.beginPath();c.arc(x,y,22,0,7);c.fill();c.fillStyle='rgba(255,255,255,.4)';c.beginPath();c.arc(x,y,10,0,7);c.fill();}
    A.txt(g.s[0]+' : '+g.s[1],440,180,18,'#555','center');}
});
</script>
</body>
</html>
