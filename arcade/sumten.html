<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сбор 10</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🔟 Сбор 10</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 166. Сбор 10
A.add({id:'sumten',cat:'puzzle',icon:'🔟',name:'Сбор 10',desc:'Двойки със сбор 10',help:'Кликни две числа, които дават сбор 10 — изчезват. Изчисти полето! Новите числа падат отгоре. 90 секунди.',
  start(g){g.time=90;g.b=[];for(let i=0;i<48;i++)g.b.push(A.ri(1,9));g.sel=-1;},
  click(g,mx,my){const x=Math.floor((mx-48)/48),y=Math.floor((my-30)/48);if(x<0||y<0||x>7||y>5)return;const i=y*8+x;if(g.sel<0||g.sel===i){g.sel=g.sel===i?-1:i;return;}
    if(g.b[g.sel]+g.b[i]===10){g.score++;A.beep(800,.05);g.b[g.sel]=A.ri(1,9);g.b[i]=A.ri(1,9);}else{A.beep(150,.05);}g.sel=-1;},
  update(g,dt){g.time-=dt;if(g.time<=0)A.over(g,'Времето изтече!');},
  draw(g){A.bg('#20302a');g.b.forEach((v,i)=>{const x=48+(i%8)*48,y=30+Math.floor(i/8)*48;A.block(x+2,y+2,44,i===g.sel?C.gold:['#5a6b8c','#3d6b2a','#6b3d5a'][v%3]);A.txt(v,x+24,y+25,22,'#fff','center');});A.txt('⏱ '+Math.ceil(g.time),10,14,14);}
});
</script>
</body>
</html>
