<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дартс</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🎯 Дартс</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 187. Дартс
A.add({id:'darts',cat:'skill',icon:'🎯',name:'Дартс',desc:'Мерникът трепери!',help:'Мерникът се клатушка сам. Кликни (или Space), когато е над центъра. 10 стрели. Център = 50, после 25, 15, 10, 5.',
  start(g){g.darts=10;g.hits=[];},
  aim(g){return[240+Math.sin(g.t*1.7)*70+Math.sin(g.t*4.3)*25,180+Math.cos(g.t*1.3)*60+Math.sin(g.t*3.7)*25];},
  throw2(g){if(g.darts<=0)return;const[x,y]=this.aim(g);const d=Math.hypot(x-240,y-180);const pts=d<8?50:d<25?25:d<50?15:d<80?10:d<110?5:0;g.score+=pts;g.darts--;g.hits.push([x,y,pts]);A.beep(300+pts*12,.06);if(!g.darts)A.over(g,'Край! '+g.score+' точки');},
  click(g){this.throw2(g);},key(g,k){if(k==='Space')this.throw2(g);},
  draw(g){A.bg('#3a2a1c');[[110,'#222'],[80,'#e8e8e8'],[50,'#2e7d32'],[25,'#d84a3a'],[8,'#ffd23f']].forEach(([r,col])=>{c.fillStyle=col;c.beginPath();c.arc(240,180,r,0,7);c.fill();});
    for(const[x,y]of g.hits){c.fillStyle='#03a9f4';c.fillRect(x-3,y-3,6,6);}const[x,y]=this.aim(g);c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(x,y,10,0,7);c.moveTo(x-16,y);c.lineTo(x+16,y);c.moveTo(x,y-16);c.lineTo(x,y+16);c.stroke();
    A.txt('Стрели: '+g.darts,10,14,14);if(g.hits.length)A.txt('+'+g.hits[g.hits.length-1][2],470,14,16,'#ffd54f','right');}
});
</script>
</body>
</html>
