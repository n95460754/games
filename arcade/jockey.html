<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пилешки рицари</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🐔 Пилешки рицари</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 367. Пилешки рицари
// Двубой във въздуха като в старата аркада "Joust": яздиш кокошка и махаш с крила.
// Който е ПО-ВИСОКО при сблъсъка, печели. Победеният враг става яйце —
// събери го, преди да се излюпи отново (и то по-бърз!). Лавата долу е смъртоносна.
const JW=18,JH=24,GRAV=520,FLAP=-205;
const PLAT=[[0,96,90],[390,96,90],[150,150,180],[30,232,110],[340,232,110],[100,318,280]]; // x,y,ширина
const LAVA=340;
const FOES=[{n:'зомби',sp:70,head:'#5d9b47',body:'#2f7fb0',hen:'#8a6a4a',flap:1.0},
            {n:'скелет',sp:95,head:'#d8d8d8',body:'#a9a9a9',hen:'#6b6b6b',flap:.8},
            {n:'уидър скелет',sp:125,head:'#2b2b2b',body:'#1a1a1a',hen:'#3d2b4a',flap:.6}];
A.add({id:'jockey',cat:'action',icon:'🐔',name:'Пилешки рицари',desc:'Летиш на кокошка и се бориш с копие — който е по-високо при удара, печели!',
  help:'←/→ или A/D — посока, Space/↑/W — размахай крила. С мишка/пръст: кликай/докосвай, за да махаш, а задръж от едната страна на героя, за да летиш натам. Удряй враговете ОТГОРЕ, събирай яйцата и не падай в лавата! 3 живота.',
  start(g){g.lives=3;g.wave=0;g.foes=[];g.eggs=[];g.parts=[];g.msg='';g.msgT=0;g.streak=0;this.spawnP(g);this.nextWave(g);},
  spawnP(g){g.p={x:231,y:318-JH,vx:0,vy:0,face:1,fl:0,inv:2,ground:true};},
  nextWave(g){g.wave++;g.streak=0;const n=Math.min(8,1+g.wave);
    for(let i=0;i<n;i++){const t=g.wave<3?0:A.ri(0,Math.min(2,Math.floor((g.wave-1)/2)));this.addFoe(g,t,i%2?440:40,40+i*12,i*.6);}
    g.msg='Вълна '+g.wave;g.msgT=1.6;A.tune([523,659,784]);},
  addFoe(g,t,x,y,delay){g.foes.push({x,y,vx:0,vy:0,t,face:x<240?1:-1,fl:0,ai:A.rnd(.2,1),ty:A.ri(40,280),dir:x<240?1:-1,born:delay||0,ground:false});},
  flap(g){const p=g.p;if(!p)return;p.vy=Math.max(p.vy+FLAP,FLAP*1.15);p.fl=.18;p.ground=false;A.beep(330,.04,'triangle',.03);},
  key(g,k){if(k==='Space'||k==='ArrowUp'||k==='KeyW')this.flap(g);},
  click(g){this.flap(g);},
  physics(o,dt,maxV){
    o.vy=Math.min(o.vy+GRAV*dt,300);
    const oy=o.y;o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.x<-JW)o.x+=480+JW;if(o.x>480)o.x-=480+JW;
    if(o.y<0){o.y=0;o.vy=Math.abs(o.vy)*.3;}
    o.ground=false;
    for(const[px,py,pw]of PLAT){
      if(o.x+JW>px+2&&o.x<px+pw-2){
        if(o.vy>=0&&oy+JH<=py+1&&o.y+JH>=py){o.y=py-JH;o.vy=0;o.ground=true;}
        else if(o.vy<0&&oy>=py+14-1&&o.y<py+14){o.y=py+14;o.vy=Math.abs(o.vy)*.4;}
      }
    }
    if(o.ground)o.vx*=Math.pow(.02,dt);
    if(o.fl>0)o.fl-=dt;
  },
  burst(g,x,y,col,n){for(let i=0;i<n;i++)g.parts.push({x,y,vx:A.rnd(-90,90),vy:A.rnd(-140,20),t:A.rnd(.4,.8),col});},
  hurt(g,why,force){if(g.p.inv>0&&!force)return;this.burst(g,g.p.x+9,g.p.y+12,'#fff',16);g.lives--;g.streak=0;A.beep(140,.3,'sawtooth',.06);
    if(g.lives<=0){g.p=null;return A.over(g,why);}this.spawnP(g);g.msg=why;g.msgT=1.2;},
  update(g,dt){
    const p=g.p;if(!p)return;
    if(g.msgT>0)g.msgT-=dt;
    // управление
    let ax=0;if(A.keys.ArrowLeft||A.keys.KeyA)ax=-1;if(A.keys.ArrowRight||A.keys.KeyD)ax=1;
    if(!ax&&A.mouse.down){const dx=A.mouse.x-(p.x+JW/2);if(Math.abs(dx)>22)ax=Math.sign(dx);}
    if(ax){p.vx=A.clamp(p.vx+ax*(p.ground?420:300)*dt,-150,150);p.face=ax;}
    this.physics(p,dt);if(p.inv>0)p.inv-=dt;
    if(p.y+JH>LAVA)return this.hurt(g,'Падна в лавата!',true);
    // врагове
    for(const f of g.foes){
      if(f.born>0){f.born-=dt;continue;}
      const T=FOES[f.t];f.ai-=dt;
      if(f.ai<=0){f.ai=A.rnd(.8,2.2);f.ty=A.ri(30,300);if(Math.random()<.35)f.dir=Math.sign((p.x-f.x)||1);else if(Math.random()<.3)f.dir=-f.dir;
        if(f.t>0&&Math.random()<.5)f.ty=p.y-A.ri(10,40);}
      f.vx+=(f.dir*T.sp-f.vx)*Math.min(1,dt*2);f.face=f.dir;
      if(f.y>f.ty&&f.vy>-60&&Math.random()<dt*6/T.flap){f.vy+=FLAP*.8;f.fl=.18;}
      if(f.y>LAVA-60&&f.vy>0){f.vy+=FLAP*.9;f.fl=.18;}
      this.physics(f,dt);
      if(f.y+JH>LAVA){f.y=LAVA-JH-30;f.vy=FLAP;}
    }
    // двубои
    for(let i=g.foes.length-1;i>=0;i--){const f=g.foes[i];if(f.born>0)continue;
      if(Math.abs(f.x-p.x)<JW-2&&Math.abs(f.y-p.y)<JH-4){
        const d=f.y-p.y;
        if(d>5){g.foes.splice(i,1);g.score+=50*(f.t+1);this.burst(g,f.x+9,f.y+10,FOES[f.t].head,12);A.tune([660,880]);
          g.eggs.push({x:f.x+4,y:f.y+6,vx:f.vx*.5,vy:-60,t:f.t,h:7-Math.min(3,g.wave*.3),ground:false});p.vy=-90;}
        else if(d<-5&&p.inv<=0){f.vy=-80;return this.hurt(g,'Удари те '+FOES[f.t].n+' отгоре!');}
        else{const s=Math.sign(p.x-f.x)||1;p.vx=s*130;f.vx=-s*130;p.vy=-60;f.vy=-60;f.dir=-s;A.beep(200,.05,'square',.03);}
      }}
    // яйца
    for(let i=g.eggs.length-1;i>=0;i--){const e=g.eggs[i];
      e.vy=Math.min(e.vy+GRAV*dt,300);const oy=e.y;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.x<-10)e.x+=490;if(e.x>480)e.x-=490;
      e.ground=false;for(const[px,py,pw]of PLAT)if(e.x+10>px&&e.x<px+pw&&e.vy>=0&&oy+12<=py+1&&e.y+12>=py){e.y=py-12;e.vy=0;e.vx*=.9;e.ground=true;}
      if(e.ground)e.h-=dt;
      if(e.y>LAVA){g.eggs.splice(i,1);continue;}
      if(Math.abs(e.x+5-(p.x+JW/2))<14&&Math.abs(e.y+6-(p.y+JH/2))<16){g.eggs.splice(i,1);g.streak++;
        const pts=(e.ground?25:75)*Math.min(4,g.streak);g.score+=pts;g.parts.push({x:e.x,y:e.y-8,vx:0,vy:-30,t:.8,txt:'+'+pts});A.beep(990,.07,'triangle');continue;}
      if(e.h<=0){g.eggs.splice(i,1);this.burst(g,e.x+5,e.y+6,'#f3ead2',8);this.addFoe(g,Math.min(2,e.t+1),e.x,e.y-16,0);g.foes[g.foes.length-1].vy=FLAP;}
    }
    for(let i=g.parts.length-1;i>=0;i--){const q=g.parts[i];q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(!q.txt)q.vy+=300*dt;if(q.t<=0)g.parts.splice(i,1);}
    if(!g.foes.length&&!g.eggs.length){g.score+=100*g.wave;this.nextWave(g);}
  },
  drawRider(x,y,face,fl,hen,head,body,lance,blink){
    if(blink)return;
    c.save();c.translate(Math.round(x+JW/2),Math.round(y));if(face<0)c.scale(-1,1);
    // кокошка
    c.fillStyle='#e0a020';c.fillRect(-5,20,2,4);c.fillRect(3,20,2,4);
    A.block(-9,10,18,hen,10);
    A.block(5,4,8,hen,9);c.fillStyle='#000';c.fillRect(9,6,2,2);
    c.fillStyle='#f0a020';c.fillRect(13,7,4,3);c.fillStyle='#d32';c.fillRect(11,10,3,4);
    // крило
    c.fillStyle='rgba(0,0,0,.25)';if(fl>0)c.fillRect(-10,0,12,8);else c.fillRect(-8,13,11,6);
    c.fillStyle=hen==='#ffffff'?'#e6e6e6':hen;if(fl>0)c.fillRect(-9,1,10,6);else c.fillRect(-7,13,9,5);
    // ездач
    A.block(-6,0,9,body,10);A.block(-6,-9,9,head);
    c.fillStyle='#000';c.fillRect(0,-6,2,2);
    // копие
    c.fillStyle=lance;c.fillRect(2,3,18,2);c.fillStyle='#ddd';c.fillRect(20,2,4,4);
    c.restore();
  },
  draw(g){
    A.bg('#1b1020');
    c.fillStyle='#2a1830';for(let i=0;i<12;i++)c.fillRect((i*97+g.t*4)%500-20,(i*53)%300,3,3);
    // лава
    for(let x=0;x<480;x+=20){const h=Math.sin(g.t*3+x*.05)*3;A.block(x,LAVA+h,20,C.lava,40);}
    c.fillStyle='rgba(255,140,0,.15)';c.fillRect(0,LAVA-30,480,30);
    // платформи
    for(const[px,py,pw]of PLAT)for(let x=px;x<px+pw;x+=15)A.block(x,py,Math.min(15,px+pw-x),py>300?'#5a4a42':C.stone,14);
    // яйца
    for(const e of g.eggs){const sh=e.h<2&&Math.sin(g.t*30)>0?1:0;A.block(e.x+sh,e.y,10,'#f3ead2',12);c.fillStyle='#c9b48a';c.fillRect(e.x+sh+3,e.y+4,2,2);}
    // врагове
    for(const f of g.foes){const T=FOES[f.t];if(f.born>0){c.globalAlpha=.4;}
      this.drawRider(f.x,f.y,f.face,f.fl,T.hen,T.head,T.body,'#6b4a2a',false);c.globalAlpha=1;}
    const p=g.p;
    if(p)this.drawRider(p.x,p.y,p.face,p.fl,'#ffffff','#e0b088','#3a7bd5','#c8a060',p.inv>0&&Math.sin(g.t*25)>0);
    for(const q of g.parts){if(q.txt)A.txt(q.txt,q.x,q.y,13,'#ffd54f','center');else{c.fillStyle=q.col;c.fillRect(q.x,q.y,4,4);}}
    A.txt('❤'.repeat(Math.max(0,g.lives)),10,14,14,'#f55');
    A.txt('Вълна '+g.wave,470,14,14,'#fff','right');
    if(g.streak>1)A.txt('Яйца x'+Math.min(4,g.streak),240,14,13,'#ffd54f','center');
    if(g.msgT>0)A.txt(g.msg,240,60,24,'#ffd54f','center');
  }
});
</script>
</body>
</html>
