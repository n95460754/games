<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мерни единици</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">📏 Мерни единици</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 112. Мерни единици
A.add(numGame({id:'units',cat:'brain',icon:'📏',name:'Мерни единици',desc:'Метри, грамове, минути',help:'Превърни мерната единица и напиши числото. 60 секунди.',
  next(g){const T=[['м','см',100],['км','м',1000],['см','мм',10],['кг','г',1000],['т','кг',1000],['ч','мин',60],['мин','с',60],['л','мл',1000],['дни','ч',24]];const[a,b,k]=A.pick(T);
    if(Math.random()<.5){const n=A.ri(1,12);g.ans=n*k;g.q=n+' '+a+' = ? '+b;}else{const n=A.ri(1,12);g.ans=n;g.q=n*k+' '+b+' = ? '+a;}}}));
</script>
</body>
</html>
