<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блокови участъци</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🟨 Блокови участъци</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 344. Блокови участъци (Филомино)
// Логически пъзел: попълни всяко празно поле с число. Всеки участък от еднакви съседни
// числа N трябва да има точно N блока, а два участъка с еднакво число не бива да се допират.
const FCOL=['#444','#ffd23f','#5aa13a','#3b7bd6','#ff2e55','#8e24aa','#ff6a00','#4de8f5','#d8a07a','#e8e8e8'];
const FSZ=[5,6,6,7],FD4=[[1,0],[-1,0],[0,1],[0,-1]],FPX=360;
A.add({id:'fillomino',cat:'puzzle',icon:'🟨',name:'Блокови участъци',desc:'Филомино: всеки участък с число N трябва да има точно N блока',
  help:'Попълни празните полета с числа 1–5. Съседните еднакви числа образуват участък — участък с число 3 трябва да има точно 3 блока, с 4 — точно 4 и т.н. Два различни участъка с едно и също число не може да се допират. Готовите участъци светят, твърде големите стават червени. Мишка/пръст: цъкни поле, после бутон вдясно (или цъкни пак полето за следващо число). Клавиатура: стрелки + 1–5, 0/Backspace = изтрий. 4 пъзела — колкото по-бързо, толкова повече точки!',
  start(g){g.lv=0;this.newPuz(g);},
  gen(n){const nb=q=>{const x=q%n,y=q/n|0,r=[];for(const[dx,dy]of FD4){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<n&&Y<n)r.push(Y*n+X);}return r;};
    for(let t=0;t<3000;t++){const reg=Array(n*n).fill(-1),sz=[];let id=0,bad=false;
      const near=s=>new Set(s.flatMap(nb).filter(r=>reg[r]>=0&&reg[r]!==id).map(r=>sz[reg[r]]));
      while(!bad){let best=-1,bf=9;for(const q of A.shuffle([...Array(n*n).keys()]))if(reg[q]<0){const f=nb(q).filter(r=>reg[r]<0).length;if(f<bf){bf=f;best=q;}}
        if(best<0)break;
        const want=A.shuffle([1,2,2,3,3,3,4,4,4,5,5]).find(w=>!near([best]).has(w));if(!want){bad=true;break;}
        const cells=[best];reg[best]=id;
        while(cells.length<want){const fr=[...new Set(cells.flatMap(nb))].filter(r=>reg[r]<0&&!near([r]).has(want));if(!fr.length)break;const q=A.pick(fr);reg[q]=id;cells.push(q);}
        sz[id]=cells.length;if(near(cells).has(cells.length))bad=true;id++;}
      if(bad)continue;let ok=true;
      for(let i=0;i<n*n&&ok;i++){if(i%n<n-1&&reg[i]!==reg[i+1]&&sz[reg[i]]===sz[reg[i+1]])ok=false;if(i+n<n*n&&reg[i]!==reg[i+n]&&sz[reg[i]]===sz[reg[i+n]])ok=false;}
      if(ok)return {sol:reg.map(r=>sz[r]),reg};}
    return null;},
  newPuz(g){const n=FSZ[g.lv];let r=null;while(!r)r=this.gen(n);g.n=n;g.S=Math.floor(300/n);g.ox=20+Math.floor((300-n*g.S)/2);g.oy=40+Math.floor((300-n*g.S)/2);
    g.sol=r.sol;g.clue=Array(n*n).fill(false);
    // по едно число от всеки участък с размер над 1, плюс още случайни
    const seen={};for(const i of A.shuffle([...Array(n*n).keys()])){const id=r.reg[i];if(!seen[id]&&r.sol[i]>1){seen[id]=1;g.clue[i]=true;}}
    for(let i=0;i<n*n;i++)if(!g.clue[i]&&Math.random()<.18&&r.sol[i]>1)g.clue[i]=true;
    g.v=g.clue.map((k,i)=>k?r.sol[i]:0);g.cx=0;g.cy=0;g.pt=0;g.done=0;this.scan(g);},
  // размер на свързаните участъци от еднакви числа
  scan(g){const n=g.n,cs=Array(n*n).fill(0),seen=Array(n*n).fill(false);let full=true,ok=true;
    for(let i=0;i<n*n;i++){if(!g.v[i]){full=false;continue;}if(seen[i])continue;const st=[i],grp=[];seen[i]=true;
      while(st.length){const q=st.pop();grp.push(q);const x=q%n,y=q/n|0;for(const[dx,dy]of FD4){const X=x+dx,Y=y+dy,j=Y*n+X;if(X>=0&&Y>=0&&X<n&&Y<n&&!seen[j]&&g.v[j]===g.v[i]){seen[j]=true;st.push(j);}}}
      for(const q of grp)cs[q]=grp.length;if(grp.length!==g.v[i])ok=false;}
    g.cs=cs;return full&&ok;},
  set(g,val){if(g.done)return;const i=g.cy*g.n+g.cx;if(g.clue[i]){A.beep(110,.06);return;}g.v[i]=val;A.beep(val?400+val*60:200,.04,'triangle');
    if(this.scan(g)){const p=Math.max(20,120-Math.floor(g.pt));g.score+=p;g.done=1.8;g.msg='Решено! +'+p+' точки';A.tune([523,659,784,1046]);}},
  key(g,k,ch){const d={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]}[k];
    if(d){g.cx=A.clamp(g.cx+d[0],0,g.n-1);g.cy=A.clamp(g.cy+d[1],0,g.n-1);return;}
    if(ch>='1'&&ch<='9')this.set(g,+ch);else if(ch==='0'||k==='Backspace'||k==='Delete')this.set(g,0);
    else if(k==='Space'||k==='Enter'){const i=g.cy*g.n+g.cx;this.set(g,(g.v[i]+1)%6);}},
  click(g,mx,my){if(mx>=FPX){const b=Math.floor((my-44)/48);if(b>=0&&b<5)this.set(g,b+1);else if(b===5)this.set(g,0);return;}
    const x=Math.floor((mx-g.ox)/g.S),y=Math.floor((my-g.oy)/g.S);if(x<0||y<0||x>=g.n||y>=g.n)return;
    if(x===g.cx&&y===g.cy){const i=y*g.n+x;this.set(g,(g.v[i]+1)%6);}else{g.cx=x;g.cy=y;A.beep(600,.02);}},
  update(g,dt){if(g.done){g.done-=dt;if(g.done<=0){g.lv++;if(g.lv>=FSZ.length)A.over(g,'Всички 4 пъзела са решени!');else this.newPuz(g);}return;}g.pt+=dt;},
  draw(g){A.bg('#1d2b3a');const n=g.n,S=g.S;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x,v=g.v[i],px=g.ox+x*S,py=g.oy+y*S;
      if(!v){A.block(px,py,S,'#5a5a5a');c.fillStyle='rgba(0,0,0,.25)';c.fillRect(px+4,py+4,S-8,S-8);continue;}
      const done=g.cs[i]===v,over=g.cs[i]>v;A.block(px,py,S,FCOL[v]||'#999');
      if(!done){c.fillStyle='rgba(0,0,0,.35)';c.fillRect(px,py,S,S);}
      if(over){c.fillStyle='rgba(255,0,0,'+(.35+.15*Math.sin(g.t*8))+')';c.fillRect(px,py,S,S);}
      A.txt(''+v,px+S/2,py+S/2+1,Math.floor(S*.5),g.clue[i]?'#fff':'#ffe9a8','center');
      if(g.clue[i]){c.fillStyle='rgba(0,0,0,.5)';c.fillRect(px+3,py+3,5,5);}}
    // граници между различни числа
    c.fillStyle='#000';for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x,px=g.ox+x*S,py=g.oy+y*S;
      if(x<n-1&&g.v[i]!==g.v[i+1])c.fillRect(px+S-1,py,3,S);if(y<n-1&&g.v[i]!==g.v[i+n])c.fillRect(px,py+S-1,S,3);}
    c.strokeStyle='#000';c.lineWidth=3;c.strokeRect(g.ox,g.oy,n*S,n*S);
    c.strokeStyle='#4de8f5';c.lineWidth=3;c.strokeRect(g.ox+g.cx*S+2,g.oy+g.cy*S+2,S-4,S-4);
    for(let b=0;b<6;b++){const y=44+b*48;A.block(FPX,y,104,b<5?FCOL[b+1]:'#7d7d7d',42);A.txt(b<5?''+(b+1):'✖ изтрий',FPX+52,y+21,b<5?22:14,'#fff','center');}
    A.txt('Пъзел '+(g.lv+1)+'/'+FSZ.length,20,20,15,'#ffd54f');A.txt('⏱ '+Math.floor(g.pt)+' с',FPX-12,20,15,'#fff','right');
    if(g.done){c.fillStyle='rgba(0,0,0,.65)';c.fillRect(20,160,320,50);A.txt(g.msg,180,185,18,'#7dff7d','center');}}
});
</script>
</body>
</html>
