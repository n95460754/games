<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Попълни кутията</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">📦 Попълни кутията</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 269. Попълни кутията
const PCOL=['#e53935','#43a047','#1e88e5','#fdd835','#8e24aa','#fb8c00','#00acc1','#6d4c41','#ec407a','#7cb342','#5c6bc0','#26a69a','#bdbdbd','#ff7043'];
const DIMS=[[3,3],[4,3],[4,4],[5,4],[5,5],[6,5],[6,6]];
A.add({id:'boxfill',cat:'puzzle',icon:'📦',name:'Попълни кутията',desc:'Нареди блоковите фигури така, че да запълнят кутията докрай',help:'Избери фигура отдясно (клик или 1–9), завърти я (R / десен клик / бутона ↻) и я сложи в кутията (клик или стрелки + Space). Клик върху сложена фигура я вдига обратно. Запълни цялата кутия! Всяка кутия дава точки и още време. N — нова кутия (−10 с).',
  start(g){g.lvl=0;g.time=60;g.score=0;this.newBoard(g);},
  newBoard(g){const [W,H]=DIMS[Math.min(g.lvl,DIMS.length-1)];g.W=W;g.H=H;g.sel=-1;g.cx=0;g.cy=0;g.keys=false;g.won=0;
    const id=[];for(let y=0;y<H;y++){id.push([]);for(let x=0;x<W;x++)id[y].push(-1);}
    const groups=[],N4=[[1,0],[-1,0],[0,1],[0,-1]],inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(id[y][x]>=0)continue;
      const k=groups.length,want=A.ri(3,W*H>20?5:4),cells=[[x,y]];id[y][x]=k;
      while(cells.length<want){const fr=[];for(const [a,b] of cells)for(const [dx,dy] of N4){const p=a+dx,q=b+dy;if(inb(p,q)&&id[q][p]<0)fr.push([p,q]);}
        if(!fr.length)break;const [p,q]=A.pick(fr);id[q][p]=k;cells.push([p,q]);}
      groups.push(cells);}
    // малките парчета (1–2 клетки) се сливат със съсед
    for(let k=0;k<groups.length;k++){const cl=groups[k];if(!cl.length||cl.length>2)continue;let to=-1;
      for(const [a,b] of cl)for(const [dx,dy] of N4){const p=a+dx,q=b+dy;if(inb(p,q)&&id[q][p]!==k&&id[q][p]>=0&&(to<0||groups[id[q][p]].length<groups[to].length))to=id[q][p];}
      if(to>=0){for(const [a,b] of cl){id[b][a]=to;groups[to].push([a,b]);}groups[k]=[];}}
    g.P=A.shuffle(groups.filter(cl=>cl.length)).map((cl,i)=>{let cells=cl.map(([a,b])=>[a,b]);const r=A.ri(0,3);for(let j=0;j<r;j++)cells=this.rot(cells);return {cells:this.norm(cells),col:PCOL[i%PCOL.length],at:null};});
    g.cs=Math.min(40,Math.floor(240/W),Math.floor(290/H));g.bx=20+Math.floor((250-g.cs*W)/2);g.by=40+Math.floor((300-g.cs*H)/2);},
  norm(cells){const mx=Math.min(...cells.map(p=>p[0])),my=Math.min(...cells.map(p=>p[1]));return cells.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);},
  rot(cells){return this.norm(cells.map(([x,y])=>[-y,x]));},
  size(cells){return [Math.max(...cells.map(p=>p[0]))+1,Math.max(...cells.map(p=>p[1]))+1];},
  grid(g,skip){const o=[];for(let y=0;y<g.H;y++)o.push(new Array(g.W).fill(-1));g.P.forEach((p,i)=>{if(p.at&&i!==skip)for(const [x,y] of p.cells)o[p.at[1]+y][p.at[0]+x]=i;});return o;},
  fits(g,p,ax,ay){const o=this.grid(g);return p.cells.every(([x,y])=>{const X=ax+x,Y=ay+y;return X>=0&&Y>=0&&X<g.W&&Y<g.H&&o[Y][X]<0;});},
  ghost(g){const p=g.P[g.sel];if(!p)return null;if(g.keys)return [g.cx,g.cy];const [w,h]=this.size(p.cells);
    return [Math.round((A.mouse.x-g.bx)/g.cs-w/2),Math.round((A.mouse.y-g.by)/g.cs-h/2)];},
  slots(g){const free=[];g.P.forEach((p,i)=>{if(!p.at&&i!==g.sel)free.push(i);});return free;},
  slotRect(n){const col=n%3,row=Math.floor(n/3);return [284+col*64,40+row*64,60,60];},
  pickUp(g,i){g.sel=i;g.P[i].at=null;A.beep(600,.04);},
  place(g){const p=g.P[g.sel],gh=this.ghost(g);if(!p||!gh)return;
    if(this.fits(g,p,gh[0],gh[1])){p.at=[gh[0],gh[1]];g.sel=-1;A.beep(760,.05,'triangle');this.check(g);}else A.beep(140,.12,'sawtooth');},
  check(g){if(g.P.every(p=>p.at)){const n=g.W*g.H;g.score+=n;g.time+=Math.round(n*1.3);g.won=1.2;A.tune([660,880,990,1320]);}},
  rotate(g){if(g.sel<0)return;const p=g.P[g.sel];p.cells=this.rot(p.cells);A.beep(500,.03);
    if(g.keys){const [w,h]=this.size(p.cells);g.cx=A.clamp(g.cx,0,g.W-w);g.cy=A.clamp(g.cy,0,g.H-h);}},
  move(g){g.keys=false;},
  key(g,k,ch){if(g.won>0)return;const n=+ch;
    if(n>=1&&n<=9){const i=this.slots(g)[n-1];
      if(i!==undefined){g.sel=i;g.keys=true;const [w,h]=this.size(g.P[i].cells);g.cx=A.clamp(g.cx,0,g.W-w);g.cy=A.clamp(g.cy,0,g.H-h);A.beep(600,.04);}return;}
    if(k==='KeyR'||k==='KeyX')return this.rotate(g);
    if(k==='KeyN'){g.time-=10;this.newBoard(g);return;}
    if(k==='Backspace'||k==='KeyZ'){let last=-1;g.P.forEach((p,i)=>{if(p.at)last=i;});if(last>=0){if(g.sel>=0)g.sel=-1;g.cx=g.P[last].at[0];g.cy=g.P[last].at[1];this.pickUp(g,last);g.keys=true;}return;}
    if(g.sel<0){if(k==='Space'||k==='Enter'){const s=this.slots(g);if(s.length){g.sel=s[0];g.keys=true;g.cx=0;g.cy=0;}}return;}
    const p=g.P[g.sel],[w,h]=this.size(p.cells);
    if(k==='ArrowLeft'||k==='KeyA')g.cx--;else if(k==='ArrowRight'||k==='KeyD')g.cx++;else if(k==='ArrowUp'||k==='KeyW')g.cy--;else if(k==='ArrowDown'||k==='KeyS')g.cy++;
    else if(k==='Space'||k==='Enter'){g.keys=true;return this.place(g);}
    else if(k==='KeyQ'||k==='KeyE'){const s=this.slots(g);if(s.length){g.sel=s[k==='KeyE'?0:s.length-1];}return;}
    else return;
    if(!g.keys){const gh=this.ghost(g);g.cx=gh[0];g.cy=gh[1];}
    g.keys=true;g.cx=A.clamp(g.cx,0,g.W-w);g.cy=A.clamp(g.cy,0,g.H-h);},
  click(g,mx,my,btn){if(g.won>0)return;g.keys=false;
    if(btn===2||(mx>=284&&mx<=476&&my>=318&&my<=352))return this.rotate(g);
    if(mx>=280){if(g.sel>=0){g.sel=-1;A.beep(400,.04);return;}
      const s=this.slots(g);s.forEach((i,n)=>{const [x,y,w,h]=this.slotRect(n);if(mx>=x&&mx<x+w&&my>=y&&my<y+h)this.pickUp(g,i);});return;}
    if(g.sel>=0)return this.place(g);
    const X=Math.floor((mx-g.bx)/g.cs),Y=Math.floor((my-g.by)/g.cs);if(X<0||Y<0||X>=g.W||Y>=g.H)return;
    const i=this.grid(g)[Y][X];if(i>=0)this.pickUp(g,i);},
  update(g,dt){if(g.won>0){g.won-=dt;if(g.won<=0){g.lvl++;this.newBoard(g);}return;}
    g.time-=dt;if(g.time<=0){g.time=0;A.over(g,'Времето изтече!');}},
  draw(g){A.bg('#2b2118');const cs=g.cs;
    A.block(g.bx-10,g.by-10,cs*g.W+20,'#9a6a3a',cs*g.H+20);
    for(let y=0;y<g.H;y++)for(let x=0;x<g.W;x++){c.fillStyle=(x+y)%2?'#3a2c20':'#433325';c.fillRect(g.bx+x*cs,g.by+y*cs,cs,cs);}
    g.P.forEach(p=>{if(p.at)for(const [x,y] of p.cells)A.block(g.bx+(p.at[0]+x)*cs,g.by+(p.at[1]+y)*cs,cs,p.col);});
    if(g.sel>=0){const p=g.P[g.sel],gh=this.ghost(g);
      if(gh&&gh[0]>-6&&gh[0]<g.W+2&&gh[1]>-6&&gh[1]<g.H+2){const ok=this.fits(g,p,gh[0],gh[1]);c.globalAlpha=.75;
        for(const [x,y] of p.cells){const X=g.bx+(gh[0]+x)*cs,Y=g.by+(gh[1]+y)*cs;A.block(X,Y,cs,p.col);if(!ok){c.fillStyle='rgba(255,0,0,.45)';c.fillRect(X,Y,cs,cs);}}
        c.globalAlpha=1;}
      else{const [w,h]=this.size(p.cells);c.globalAlpha=.8;for(const [x,y] of p.cells)A.block(A.mouse.x+(x-w/2)*24,A.mouse.y+(y-h/2)*24,24,p.col);c.globalAlpha=1;}}
    // тава с фигури
    c.fillStyle='#1c150f';c.fillRect(280,36,196,280);
    this.slots(g).forEach((i,n)=>{const [x,y,w,h]=this.slotRect(n);c.fillStyle='#3d3024';c.fillRect(x,y,w,h);const p=g.P[i],[pw,ph]=this.size(p.cells),s=Math.min(12,Math.floor(50/Math.max(pw,ph)));
      for(const [a,b] of p.cells)A.block(x+(w-pw*s)/2+a*s,y+(h-ph*s)/2+b*s,s,p.col);if(n<9)A.txt(''+(n+1),x+4,y+8,10,'#c9b79c');});
    A.block(284,320,188,g.sel>=0?'#5a6b8c':'#3e4656',32);A.txt('↻ Завърти (R)',378,336,14,'#fff','center');
    A.txt('📦 Кутия '+(g.lvl+1)+'  '+g.W+'×'+g.H,10,16,14,'#ffd54f');A.txt('⏱ '+Math.ceil(g.time),470,16,14,g.time<10?'#ff5252':'#fff','right');
    if(g.won>0)A.txt('Пълна кутия! +'+g.W*g.H,140,190,22,'#69f0ae','center');}
});
</script>
</body>
</html>
