<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Налей точно</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🥛 Налей точно</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 194. Налей точно
A.add({id:'pour',cat:'skill',icon:'🥛',name:'Налей точно',desc:'Спри точно на чертата',help:'Задръж Space / мишката, за да наливаш. Пусни, когато водата стигне червената черта. Колкото по-точно, толкова повече точки. 8 чаши.',
  start(g){g.cups=8;this.cup(g);},
  cup(g){g.level=0;g.target=A.rnd(.3,.9);g.st='wait';g.sp=A.rnd(.25,.45);},
  update(g,dt){const hold=A.keys.Space||A.mouse.down;if(g.st==='wait'&&hold)g.st='pour';if(g.st==='pour'){if(hold)g.level+=g.sp*dt;else{g.st='done';const e=Math.abs(g.level-g.target);const pts=Math.max(0,10-Math.round(e*100));g.score+=pts;g.last='+'+pts;A.beep(300+pts*60,.1);g.dt2=1.2;}if(g.level>=1){g.level=1;g.st='done';g.last='Преля! +0';g.dt2=1.2;A.beep(120,.2);}}
    if(g.st==='done'){g.dt2-=dt;if(g.dt2<=0){g.cups--;if(!g.cups)return A.over(g,'Край! '+g.score+' точки');this.cup(g);}}},
  draw(g){A.bg('#e3f2fd');c.fillStyle='rgba(255,255,255,.6)';c.fillRect(190,80,100,220);c.fillStyle='#4fc3f7';c.fillRect(190,300-220*g.level,100,220*g.level);c.strokeStyle='#555';c.lineWidth=4;c.strokeRect(190,80,100,220);
    c.fillStyle=C.red;c.fillRect(180,300-220*g.target-1,120,3);if(g.st==='pour'){c.fillStyle='#4fc3f7';c.fillRect(236,40,8,260-220*g.level);}A.block(220,20,40,'#999',24);
    A.txt('Чаши: '+g.cups,10,14,14,'#123');if(g.st==='done')A.txt(g.last,240,340,20,'#123','center');}
});
</script>
</body>
</html>
