<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цвят или дума?</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🎨 Цвят или дума?</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 137. Ефектът на Струп
A.add(choiceGame({id:'stroop',cat:'brain',icon:'🎨',name:'Цвят или дума?',desc:'Избери ЦВЕТА на буквите',help:'Изписана е дума за цвят, но с ДРУГ цвят. Избери цвета на БУКВИТЕ, не думата! (клик или 1–4). 45 секунди.',time:45,
  K:[['червен',C.red],['жълт',C.gold],['зелен',C.grass],['син',C.water],['лилав',C.purple],['бял','#fff']],
  next(g){const w=A.pick(this.K);let col;do{col=A.pick(this.K);}while(col===w&&Math.random()<.8);g.word=w[0];g.col=col[1];g.ans=col[0];g.opts=opts4(g.ans,()=>A.pick(this.K)[0]);if(!g.opts.includes(w[0])&&w[0]!==g.ans){g.opts[g.opts.indexOf(g.ans)===0?1:0]=w[0];}},
  pic(g){A.txt(g.word.toUpperCase(),240,130,58,g.col,'center');}}));
</script>
</body>
</html>
