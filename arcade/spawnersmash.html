<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разбий спаунъра</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">⚔️ Разбий спаунъра</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 385. Разбий спаунъра
A.add({id:'spawnersmash',cat:'action',icon:'⚔️',name:'Разбий спаунъра',desc:'Пробий си път през мобовете и строши спаунъра с меча, преди да те затрупат',
  help:'Спаунърът в клетката пуска мобове. Стрелки / WASD — движение, Space — удар с меча наоколо. Мишка/пръст: клик/докосване = върви натам и удряй. Удари спаунъра много пъти, за да го строшиш (+10 × ниво). Зомби = 1 удар, паяците са бързи, бронираните искат 2 удара. Ябълката лекува. 3 сърца.',
  start(g){g.p={x:240,y:300};g.hp=3;g.inv=0;g.cd=0;g.sw=0;g.lvl=1;g.mobs=[];g.items=[];g.parts=[];g.tx=null;g.msg=0;this.newSp(g);},
  newSp(g){let x,y;do{x=A.ri(60,420);y=A.ri(60,300);}while(Math.hypot(x-g.p.x,y-g.p.y)<150);
    g.sp={x,y,hp:6+g.lvl*2,max:6+g.lvl*2,t:1.2,hit:0};},
  swing(g){if(g.cd>0)return;g.cd=.32;g.sw=.15;A.beep(300,.05,'sawtooth');const R=38,p=g.p;
    for(const m of g.mobs)if(Math.hypot(m.x-p.x,m.y-p.y)<R+m.s/2){m.hp--;m.fl=.12;const a=Math.atan2(m.y-p.y,m.x-p.x);m.x+=Math.cos(a)*18;m.y+=Math.sin(a)*18;
      if(m.hp<=0){g.score++;A.beep(520,.05);this.boom(g,m.x,m.y,m.col);if(Math.random()<.08&&g.hp<3)g.items.push({x:m.x,y:m.y,t:8});}}
    g.mobs=g.mobs.filter(m=>m.hp>0);
    const s=g.sp;if(Math.hypot(s.x-p.x,s.y-p.y)<R+16){s.hp--;s.hit=.12;A.beep(160,.06,'square');
      if(s.hp<=0){g.score+=10*g.lvl;A.tune([523,659,784,1046]);this.boom(g,s.x,s.y,'#333');this.boom(g,s.x,s.y,'#ff6a00');g.lvl++;g.msg=1.5;this.newSp(g);}}},
  boom(g,x,y,col){for(let i=0;i<10;i++)g.parts.push({x,y,vx:A.rnd(-90,90),vy:A.rnd(-90,90),t:.5,col});},
  key(g,k){if(k==='Space')this.swing(g);},
  click(g,mx,my){g.tx=mx;g.ty=my;this.swing(g);},
  move(g,mx,my){if(A.mouse.down){g.tx=mx;g.ty=my;}},
  update(g,dt){const p=g.p,K=A.keys;g.cd-=dt;g.sw-=dt;g.inv-=dt;g.msg-=dt;
    let dx=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0),dy=(K.ArrowDown||K.KeyS?1:0)-(K.ArrowUp||K.KeyW?1:0);
    if(dx||dy)g.tx=null;else if(g.tx!==null){const ex=g.tx-p.x,ey=g.ty-p.y,d=Math.hypot(ex,ey);if(d>4){dx=ex/d;dy=ey/d;}else g.tx=null;}
    const l=Math.hypot(dx,dy)||1;p.x=A.clamp(p.x+dx/l*150*dt,10,470);p.y=A.clamp(p.y+dy/l*150*dt,30,350);
    const s=g.sp;s.hit-=dt;s.t-=dt;
    if(s.t<=0&&g.mobs.length<8+g.lvl){s.t=Math.max(.55,2-g.lvl*.18);const r=Math.random(),L=g.lvl;
      const m=r<.25&&L>1?{s:18,v:95+L*5,hp:1,col:'#3a2a2a',eye:'#f22'}:r<.45&&L>2?{s:20,v:45+L*3,hp:2,col:'#4f7f8f',eye:'#000'}:{s:18,v:55+L*4,hp:1,col:'#3f8a3a',eye:'#000'};
      m.x=s.x+A.rnd(-20,20);m.y=s.y+A.rnd(-20,20);m.fl=0;g.mobs.push(m);}
    for(const m of g.mobs){m.fl-=dt;const ex=p.x-m.x,ey=p.y-m.y,d=Math.hypot(ex,ey)||1;m.x+=ex/d*m.v*dt;m.y+=ey/d*m.v*dt;
      if(d<(m.s+14)/2&&g.inv<=0){g.hp--;g.inv=1;A.beep(120,.2,'sawtooth');m.x-=ex/d*30;m.y-=ey/d*30;if(g.hp<=0)return A.over(g,'Мобовете те победиха! Ниво '+g.lvl);}}
    for(const it of g.items){it.t-=dt;if(Math.hypot(it.x-p.x,it.y-p.y)<18){it.t=0;g.hp=Math.min(3,g.hp+1);A.tune([660,880]);}}
    g.items=g.items.filter(i=>i.t>0);
    for(const q of g.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;}g.parts=g.parts.filter(q=>q.t>0);},
  draw(g){A.bg('#4a4a4a');for(let x=0;x<480;x+=24)for(let y=24;y<360;y+=24){c.fillStyle=((x+y)/24)%2?'#555':'#505050';c.fillRect(x,y,24,24);}
    const s=g.sp;A.block(s.x-16,s.y-16,32,s.hit>0?'#fff':'#1d2430');c.strokeStyle='#6d7a8a';c.lineWidth=2;
    for(let i=1;i<4;i++){c.beginPath();c.moveTo(s.x-16+i*8,s.y-16);c.lineTo(s.x-16+i*8,s.y+16);c.moveTo(s.x-16,s.y-16+i*8);c.lineTo(s.x+16,s.y-16+i*8);c.stroke();}
    c.fillStyle='rgba(255,120,30,'+(.4+.3*Math.sin(g.t*6))+')';c.fillRect(s.x-6,s.y-6,12,12);
    c.fillStyle='#000';c.fillRect(s.x-18,s.y-26,36,5);c.fillStyle='#e33';c.fillRect(s.x-18,s.y-26,36*s.hp/s.max,5);
    for(const it of g.items){A.block(it.x-7,it.y-7,14,C.red);c.fillStyle=C.leaf;c.fillRect(it.x-1,it.y-11,3,4);}
    for(const m of g.mobs){A.block(m.x-m.s/2,m.y-m.s/2,m.s,m.fl>0?'#fff':m.col);c.fillStyle=m.eye;c.fillRect(m.x-5,m.y-3,3,3);c.fillRect(m.x+2,m.y-3,3,3);
      if(m.hp>1){c.strokeStyle='#cfd8dc';c.lineWidth=2;c.strokeRect(m.x-m.s/2,m.y-m.s/2,m.s,m.s);}}
    const p=g.p;if(g.sw>0){c.strokeStyle='rgba(220,240,255,.8)';c.lineWidth=5;c.beginPath();c.arc(p.x,p.y,34,0,Math.PI*2);c.stroke();}
    if(g.inv<=0||Math.floor(g.t*12)%2){A.block(p.x-8,p.y-8,16,'#2e7dd1');A.block(p.x-8,p.y-12,16,'#c8946a',7);c.fillStyle='#000';c.fillRect(p.x-4,p.y-9,2,2);c.fillRect(p.x+2,p.y-9,2,2);
      c.fillStyle=C.gem;c.fillRect(p.x+8,p.y-14,3,14);c.fillStyle='#6b4a2a';c.fillRect(p.x+6,p.y,7,3);}
    for(const q of g.parts){c.fillStyle=q.col;c.fillRect(q.x-2,q.y-2,4,4);}
    c.fillStyle='rgba(0,0,0,.5)';c.fillRect(0,0,480,22);A.txt('❤'.repeat(g.hp)+'♡'.repeat(Math.max(0,3-g.hp)),8,11,14,'#f55');
    A.txt('Ниво '+g.lvl+' · спаунър '+s.hp+'/'+s.max,472,11,13,'#ffd54f','right');
    if(g.msg>0)A.txt('Спаунърът е строшен! Ниво '+g.lvl,240,180,22,'#ffd54f','center');}
});
</script>
</body>
</html>
