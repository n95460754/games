<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лампи по двойки</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">💡 Лампи по двойки</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 383. Лампи по двойки
A.add({id:'lamppairs',cat:'puzzle',icon:'💡',name:'Лампи по двойки',desc:'Запали точно 2 лампи във всяка стая — и всяка лампа трябва да има точно един светещ съсед',
  help:'Норинори с червени лампи: във всяка стая (оградена с дебела линия) трябва да светят ТОЧНО 2 лампи. Всяка светеща лампа трябва да докосва (отгоре, отдолу, отляво или отдясно) ТОЧНО една друга светеща лампа — значи лампите винаги са на двойки, а двойките не се допират по страна. Мишка/пръст: клик = лампа → ✕ → празно. Клавиатура: стрелки + Space (лампа), X (знак ✕). Решен пъзел = точки и +30 секунди; 150 секунди.',
  PAL:['#8d8d8d','#a1887f','#9fa8b3','#c2b280','#7e8c74','#9c8aa5','#b08c7a','#7d95a8'],
  start(g){g.time=150;g.lvl=0;g.cx=0;g.cy=0;g.win=0;g.parts=[];this.make(g);},
  make(g){
    const N=[5,6,6,7,7,8][Math.min(g.lvl,5)];g.N=N;
    let sh,tries=0;
    do{sh=this.dominoes(N);tries++;}while(sh.count<Math.max(3,Math.floor(N*N/7))&&tries<50);
    // стаи: всяка двойка е семе, стаите растат случайно
    const reg=new Array(N*N).fill(-1);sh.pairs.forEach((p,i)=>{reg[p[0]]=i;reg[p[1]]=i;});
    let left=reg.filter(r=>r<0).length;
    while(left>0){const i=A.ri(0,N*N-1);if(reg[i]>=0)continue;
      const nb=this.nbs(N,i).filter(j=>reg[j]>=0);if(!nb.length)continue;
      const j=A.pick(nb);
      // не пускаме стая да погълне клетка до чужда лампа, ако може иначе — без ограничения, всяко решение по правилата важи
      reg[i]=reg[j];left--;}
    g.reg=reg;g.R=sh.count;g.sol=sh.pairs;g.st=new Array(N*N).fill(0);g.cs=Math.floor(300/N);
    g.ox=Math.floor((480-g.cs*N)/2);g.oy=40;g.cx=Math.min(g.cx,N-1);g.cy=Math.min(g.cy,N-1);
    g.col=[];for(let r=0;r<g.R;r++)g.col.push(this.PAL[r%this.PAL.length]);
    // съседни стаи с различни цветове, ако може
    for(let r=0;r<g.R;r++){const used=new Set();for(let i=0;i<N*N;i++)if(reg[i]===r)for(const j of this.nbs(N,i))if(reg[j]!==r&&reg[j]<r)used.add(g.col[reg[j]]);
      const free=this.PAL.filter(p=>!used.has(p));if(free.length)g.col[r]=free[r%free.length];}
  },
  nbs(N,i){const x=i%N,y=(i/N)|0,o=[];if(x>0)o.push(i-1);if(x<N-1)o.push(i+1);if(y>0)o.push(i-N);if(y<N-1)o.push(i+N);return o;},
  dominoes(N){
    const on=new Array(N*N).fill(0),pairs=[],max=Math.floor(N*N/6);
    const cand=[];for(let i=0;i<N*N;i++){if(i%N<N-1)cand.push([i,i+1]);if(i+N<N*N)cand.push([i,i+N]);}
    A.shuffle(cand);
    for(const [a,b] of cand){if(pairs.length>=max)break;if(on[a]||on[b])continue;
      const ok=[a,b].every(k=>this.nbs(N,k).every(j=>j===a||j===b||!on[j]));
      if(ok){on[a]=on[b]=1;pairs.push([a,b]);}}
    return {pairs,count:pairs.length};
  },
  bad(g){ // кои лампи и стаи са сгрешени
    const N=g.N,badC=new Set(),cnt=new Array(g.R).fill(0);
    for(let i=0;i<N*N;i++)if(g.st[i]===1){cnt[g.reg[i]]++;const n=this.nbs(N,i).filter(j=>g.st[j]===1).length;if(n>1)badC.add(i);}
    return {badC,cnt};
  },
  solved(g){const N=g.N,{cnt}=this.bad(g);if(cnt.some(v=>v!==2))return false;
    for(let i=0;i<N*N;i++)if(g.st[i]===1&&this.nbs(N,i).filter(j=>g.st[j]===1).length!==1)return false;return true;},
  set(g,i,v){if(g.win>0)return;g.st[i]=v;A.beep(v===1?660:v===2?300:420,.04,'triangle');
    if(this.solved(g)){const pts=g.N-3;g.score+=pts;g.time+=30;g.win=1.2;g.gain=pts;A.tune([523,659,784,1047]);
      for(let k=0;k<30;k++)g.parts.push({x:240,y:190,vx:A.rnd(-160,160),vy:A.rnd(-200,-40),t:1,col:A.pick(['#ffd54f','#ff7043','#fff59d'])});}},
  key(g,k){const N=g.N;
    if(k==='ArrowLeft'||k==='KeyA')g.cx=(g.cx+N-1)%N;else if(k==='ArrowRight'||k==='KeyD')g.cx=(g.cx+1)%N;
    else if(k==='ArrowUp'||k==='KeyW')g.cy=(g.cy+N-1)%N;else if(k==='ArrowDown'||k==='KeyS')g.cy=(g.cy+1)%N;
    else if(k==='Space'||k==='Enter'){const i=g.cy*N+g.cx;this.set(g,i,g.st[i]===1?0:1);}
    else if(k==='KeyX'){const i=g.cy*N+g.cx;this.set(g,i,g.st[i]===2?0:2);}},
  click(g,mx,my,b){const N=g.N,x=Math.floor((mx-g.ox)/g.cs),y=Math.floor((my-g.oy)/g.cs);
    if(x<0||y<0||x>=N||y>=N)return;g.cx=x;g.cy=y;const i=y*N+x;
    if(b===2)this.set(g,i,g.st[i]===2?0:2);else this.set(g,i,(g.st[i]+1)%3);},
  update(g,dt){
    if(g.win>0){g.win-=dt;if(g.win<=0){g.lvl++;this.make(g);}}
    else{g.time-=dt;if(g.time<=0)return A.over(g,'Времето изтече! Реши '+g.lvl+' пъзела');}
    for(let i=g.parts.length-1;i>=0;i--){const q=g.parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=260*dt;q.t-=dt;if(q.t<=0)g.parts.splice(i,1);}
  },
  draw(g){
    A.bg('#1a1410');
    const N=g.N,cs=g.cs,ox=g.ox,oy=g.oy,{badC,cnt}=this.bad(g);
    for(let i=0;i<N*N;i++){const x=ox+(i%N)*cs,y=oy+((i/N)|0)*cs,r=g.reg[i];
      A.block(x,y,cs,g.col[r]);
      if(cnt[r]>2){c.fillStyle='rgba(255,40,40,.25)';c.fillRect(x,y,cs,cs);}
      if(cnt[r]===2){c.fillStyle='rgba(120,255,120,.12)';c.fillRect(x,y,cs,cs);}
      const s=g.st[i],m=Math.round(cs*.14),w=cs-2*m;
      if(s===1){const lit=badC.has(i)?'#ff5252':'#ffb74d';A.block(x+m,y+m,w,lit);
        c.fillStyle=badC.has(i)?'#b71c1c':'#fff3c4';const u=w/5;
        c.fillRect(x+m+u,y+m+u*2,u*3,u);c.fillRect(x+m+u*2,y+m+u,u,u*3);
        c.fillStyle='rgba(255,200,80,.18)';c.fillRect(x-2,y-2,cs+4,cs+4);}
      else if(s===2){c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=3;const a=cs*.35;
        c.beginPath();c.moveTo(x+a,y+a);c.lineTo(x+cs-a,y+cs-a);c.moveTo(x+cs-a,y+a);c.lineTo(x+a,y+cs-a);c.stroke();}
      else{c.fillStyle='rgba(60,30,20,.35)';c.fillRect(x+m*2,y+m*2,cs-4*m,cs-4*m);}
    }
    // дебели линии между стаите
    c.fillStyle='#120c08';
    for(let i=0;i<N*N;i++){const gx=i%N,gy=(i/N)|0,x=ox+gx*cs,y=oy+gy*cs;
      if(gx<N-1&&g.reg[i]!==g.reg[i+1])c.fillRect(x+cs-2,y-1,4,cs+2);
      if(gy<N-1&&g.reg[i]!==g.reg[i+N])c.fillRect(x-1,y+cs-2,cs+2,4);}
    c.strokeStyle='#120c08';c.lineWidth=4;c.strokeRect(ox,oy,cs*N,cs*N);
    if(g.win<=0){c.strokeStyle='#4de8f5';c.lineWidth=3;c.strokeRect(ox+g.cx*cs+2,oy+g.cy*cs+2,cs-4,cs-4);}
    for(const q of g.parts){c.fillStyle=q.col;c.fillRect(q.x,q.y,5,5);}
    c.fillStyle='rgba(0,0,0,.5)';c.fillRect(0,0,480,28);
    A.txt('⏱ '+Math.ceil(g.time),10,14,14,g.time<15?'#ff8a80':'#fff');
    A.txt('Пъзел '+(g.lvl+1)+' · '+N+'×'+N+' · стаи: '+g.R,240,14,13,'#ffe082','center');
    A.txt('2 лампи в стая',470,14,12,'#b9c6d6','right');
    if(g.win>0)A.txt('Светна! +'+g.gain+' т., +30 с',240,190,24,'#ffd54f','center');
  }
});
</script>
</body>
</html>
