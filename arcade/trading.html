<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Търговия със селяни</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">💎 Търговия със селяни</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 270. Търговия със селяни
const GOODS=[['хляба','🍞'],['моркова','🥕'],['ябълки','🍎'],['стрели','🏹'],['листа хартия','📜'],['риби','🐟'],['картофа','🥔'],['яйца','🥚']];
const TOOLS=[['меч','меча','🗡️'],['кирка','кирки','⛏️'],['брадва','брадви','🪓'],['щит','щита','🛡️'],['лък','лъка','🏹'],['книга','книги','📖']];
const em=n=>n+(n===1?' изумруд':' изумруда');
A.add(choiceGame({id:'trading',cat:'brain',icon:'💎',name:'Търговия със селяни',desc:'Пазарувай с изумруди: смятай цени, ресто и най-изгодната сделка',time:90,help:'Селяните търгуват с изумруди 💎. Прочети сделката и сметни: колко изумруда трябват, колко стока получаваш, колко ресто ти остава и коя сделка е най-изгодна. Избери верния отговор с клик или 1–4. След 6 точки идват задачи с две стъпки! 90 секунди.',
  next(g){const hard=g.score>=6,N=A.ri(2,hard?9:5),t=A.pick(hard?['buy','get','sell','left','chain','chain','best']:['buy','get','buy','sell','best']),gd=A.pick(GOODS),tl=A.pick(TOOLS);g.show=null;
    const near=()=>Math.max(0,g.ans+A.pick([-3,-2,-1,1,2,3,g.ans]));
    if(t==='buy'){const a=A.ri(2,hard?9:6);g.q='Селянинът дава '+a+' '+gd[0]+' за 1 изумруд.';g.q2='Колко изумруда трябват за '+a*N+' '+gd[0]+'?';g.ans=N;g.show=[a,gd[1],1];}
    else if(t==='get'){const b=A.ri(2,hard?5:3),a=A.ri(2,hard?12:6);g.q='За '+em(b)+' селянинът дава '+a+' '+gd[0]+'.';g.q2='Колко '+gd[0]+' за '+em(b*N)+'?';g.ans=a*N;g.show=[a,gd[1],b];}
    else if(t==='sell'){const a=A.ri(hard?6:3,hard?20:10),r=A.ri(0,a-1),M=a*N+r;g.q='Селянинът купува '+a+' '+gd[0]+' за 1 изумруд.';g.q2='Имаш '+M+' '+gd[0]+'. Колко изумруда ще получиш?';g.ans=N;g.show=[a,gd[1],1];}
    else if(t==='left'){const p=A.ri(2,hard?9:5),k=A.ri(1,3),M=p*k+A.ri(0,12);g.q='1 '+tl[0]+' струва '+em(p)+'. Имаш '+em(M)+'.';g.q2='Купуваш '+k+' '+(k===1?tl[0]:tl[1])+'. Колко изумруда ти остават?';g.ans=M-p*k;g.show=[1,tl[2],p];}
    else if(t==='chain'){const a=A.ri(2,6),p=A.ri(2,hard?8:4);g.q='1 изумруд = '+a+' '+gd[0]+'. 1 '+tl[0]+' = '+em(p)+'.';g.q2='Колко '+gd[0]+' струва 1 '+tl[0]+'?';g.ans=a*p;g.show=[1,tl[2],p];}
    else{const rs=A.shuffle([2,3,4,5,6,7,8]).slice(0,4),best=Math.max(...rs);g.q='Четирима селяни продават '+gd[1]+'. Кой е най-изгоден?';g.q2='Кой дава най-много '+gd[0]+' за 1 изумруд?';
      g.opts=rs.map(r=>{const b=A.ri(1,hard?4:3);return (r*b)+' за '+b+'💎';});g.ans=g.opts[rs.indexOf(best)];return;}
    g.opts=opts4(g.ans,near);},
  pic(g){A.bg('#2a3a24');A.txt(g.q,240,34,g.q.length>44?12:g.q.length>34?14:17,'#fff','center');A.txt(g.q2,240,58,g.q2.length>44?12:g.q2.length>34?14:16,'#ffd54f','center');
    // селянин
    const x=50,y=86,b=Math.sin(g.t*3)*2;A.block(x,y+b,50,'#c58c5c',46);c.fillStyle='#4a2f1a';c.fillRect(x,y+b,50,10);c.fillStyle='#fff';c.fillRect(x+10,y+18+b,8,6);c.fillRect(x+32,y+18+b,8,6);
    c.fillStyle='#2e7d32';c.fillRect(x+12,y+20+b,4,4);c.fillRect(x+34,y+20+b,4,4);A.block(x+20,y+24+b,10,'#b07a4a',16);c.fillStyle='#3b2a1a';c.fillRect(x+16,y+18+b,18,3);
    A.block(x-4,y+46,58,'#7b5a3a',80);A.block(x+6,y+60,38,'#6a4a2e',16);c.fillStyle='#4a3420';c.fillRect(x+22,y+76,6,50);
    // сергия
    A.block(150,90,300,'#7a5233',20);for(let i=0;i<6;i++){c.fillStyle=i%2?'#e8e8e8':'#d84a3a';c.fillRect(150+i*50,70,50,20);}
    A.block(150,110,300,'#5a3d26',120);
    if(g.show){const [a,ic,b]=g.show;A.block(170,130,110,'#3d2a1a',80);A.txt(ic,205,170,30,'#fff','center');A.txt('×'+a,250,170,18,'#fff','center');
      c.fillStyle='#fff';c.fillRect(290,166,30,8);c.beginPath();c.moveTo(320,158);c.lineTo(334,170);c.lineTo(320,182);c.fill();c.fillRect(300,152,22,4);c.beginPath();c.moveTo(300,146);c.lineTo(290,154);c.lineTo(300,162);c.fill();
      A.block(342,130,96,'#3d2a1a',80);this.gem(362,152);A.txt('×'+b,414,170,18,'#fff','center');}
    else{for(let i=0;i<4;i++){A.block(166+i*70,140,60,'#3d2a1a',60);A.txt(''+(i+1),196+i*70,170,22,'#ffd54f','center');}}},
  gem(x,y){c.fillStyle='#17a34a';c.beginPath();c.moveTo(x+12,y);c.lineTo(x+24,y+14);c.lineTo(x+12,y+36);c.lineTo(x,y+14);c.fill();c.fillStyle='#4be27a';c.fillRect(x+8,y+8,8,10);c.fillStyle='#b8ffd0';c.fillRect(x+9,y+9,3,3);}
}));
</script>
</body>
</html>
