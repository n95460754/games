<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Падащи камъни</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">💎 Падащи камъни</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 253. Падащи камъни
// 0 празно, 1 пръст, 2 скала, 3 камък, 4 диамант, 5 изход
A.add({id:'boulderdash',cat:'action',icon:'💎',name:'Падащи камъни',desc:'Копай под земята, събирай диаманти и не позволявай камък да те затисне',help:'Стрелки / WASD (задръж) или задръж мишката / пръста встрани от миньора — копай. Събери нужните диаманти, за да се отвори изходът 🚪. Камъните и диамантите падат, ако копаеш под тях! Можеш да буташ камък встрани. Пусни камък върху паяк — става на диаманти.',
  W:24,H:16,S:20,
  start(g){g.lvl=0;this.level(g);},
  level(g){g.lvl++;const W=this.W,H=this.H;g.m=[];g.f=[];
    for(let y=0;y<H;y++){g.m.push([]);g.f.push([]);for(let x=0;x<W;x++){let v=1;
      if(x===0||y===0||x===W-1||y===H-1)v=2;else{const r=Math.random();if(r<.13+g.lvl*.01)v=3;else if(r<.2+g.lvl*.01)v=4;else if(r<.25)v=0;else if(r<.27)v=2;}
      g.m[y].push(v);g.f[y].push(false);}}
    for(let y=1;y<4;y++)for(let x=1;x<4;x++)g.m[y][x]=1;
    g.px=1;g.py=1;g.m[1][1]=0;
    g.sp=[];const ns=Math.min(4,Math.floor(g.lvl/2)+1);
    for(let i=0;i<ns;i++){const y=A.ri(5,H-3),x=A.ri(4,W-8);for(let k=0;k<4;k++)g.m[y][x+k]=0;g.sp.push({x:x+1,y,d:[1,0]});}
    let cnt=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g.m[y][x]===4)cnt++;
    g.need=Math.max(3,Math.min(cnt-2,6+g.lvl*2));g.got=0;
    let ex;do{ex=[A.ri(10,W-2),A.ri(8,H-2)];}while(g.m[ex[1]][ex[0]]===4);g.ex=ex;g.m[ex[1]][ex[0]]=2;
    g.time=100;g.step=0;g.mv=0;g.open=false;g.parts=[];g.msg='Ниво '+g.lvl+' — събери '+g.need+' 💎';g.mt=2.5;},
  dir(g){const k=A.keys;let d=null;
    if(k.ArrowUp||k.KeyW)d=[0,-1];else if(k.ArrowDown||k.KeyS)d=[0,1];else if(k.ArrowLeft||k.KeyA)d=[-1,0];else if(k.ArrowRight||k.KeyD)d=[1,0];
    if(!d&&A.mouse.down){const S=this.S,dx=A.mouse.x-(g.px*S+S/2),dy=A.mouse.y-(40+g.py*S+S/2);
      if(Math.max(Math.abs(dx),Math.abs(dy))>12)d=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];}
    return d;},
  click(g){g.mv=1;},
  boom(g,x,y,col){for(let i=0;i<10;i++)g.parts.push({x:x*20+10,y:40+y*20+10,vx:A.rnd(-80,80),vy:A.rnd(-120,20),t:.6,col});},
  update(g,dt){g.time-=dt;g.mt-=dt;g.mv+=dt;g.parts=g.parts.filter(p=>(p.t-=dt)>0);g.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;});
    if(g.time<=0)return A.over(g,'Въздухът свърши! ⏱');
    const d=this.dir(g);
    if(d&&g.mv>=.13){g.mv=0;const nx=g.px+d[0],ny=g.py+d[1],v=g.m[ny][nx];
      if(nx===g.ex[0]&&ny===g.ex[1]){if(g.open){g.score+=50+Math.floor(g.time);A.tune([523,659,784,1047]);return this.level(g);}}
      else if(v===0||v===1){if(v===1)A.beep(160,.03,'square',.02);g.px=nx;g.py=ny;g.m[ny][nx]=0;}
      else if(v===4){g.m[ny][nx]=0;g.px=nx;g.py=ny;g.got++;g.score+=10;A.beep(1200,.06,'triangle');this.boom(g,nx,ny,C.gem);this.gotGem(g);}
      else if(v===3&&d[1]===0&&!g.f[ny][nx]&&g.m[ny][nx+d[0]]===0&&!this.spAt(g,nx+d[0],ny)){g.m[ny][nx+d[0]]=3;g.m[ny][nx]=0;g.px=nx;A.beep(90,.05);}
      if(this.spAt(g,g.px,g.py))return A.over(g,'Паякът те ухапа! 🕷');}
    g.step+=dt;if(g.step<.12)return;g.step=0;this.phys(g);},
  gotGem(g){if(g.got>=g.need&&!g.open){g.open=true;g.m[g.ex[1]][g.ex[0]]=5;g.msg='Изходът е отворен! 🚪';g.mt=2;A.tune([660,880]);}},
  spAt(g,x,y){return g.sp.some(s=>s.x===x&&s.y===y);},
  phys(g){const W=this.W,H=this.H,m=g.m,f=g.f;
    for(let y=H-2;y>0;y--)for(let x=1;x<W-1;x++){const v=m[y][x];if(v!==3&&v!==4)continue;
      const below=m[y+1][x];
      if(x===g.px&&y+1===g.py){if(f[y][x]){if(v===3)return A.over(g,'Затисна те камък! 🪨');m[y][x]=0;g.got++;g.score+=10;A.beep(1200,.06,'triangle');this.gotGem(g);}f[y][x]=false;continue;}
      const si=g.sp.findIndex(s=>s.x===x&&s.y===y+1);
      if(si>=0){if(f[y][x]){const s=g.sp.splice(si,1)[0];m[y][x]=0;f[y][x]=false;g.score+=20;A.beep(300,.2,'sawtooth');
          for(let yy=s.y-1;yy<=s.y+1;yy++)for(let xx=s.x-1;xx<=s.x+1;xx++)if(m[yy][xx]!==2&&m[yy][xx]!==5&&!(xx===g.px&&yy===g.py))m[yy][xx]=4;this.boom(g,s.x,s.y,C.ruby);}continue;}
      if(below===0){m[y+1][x]=v;m[y][x]=0;f[y+1][x]=true;f[y][x]=false;continue;}
      if(f[y][x]&&(below===3||below===4||below===2)){A.beep(70,.04,'square',.03);}
      // търкаляне от заоблени камъни
      if(below===3||below===4){let moved=false;for(const s of [-1,1]){if(m[y][x+s]===0&&m[y+1][x+s]===0&&!(g.px===x+s&&(g.py===y||g.py===y+1))&&!this.spAt(g,x+s,y)){m[y][x+s]=v;m[y][x]=0;f[y][x]=false;f[y][x+s]=true;moved=true;if(s===1)x++;break;}}if(moved)continue;}
      f[y][x]=false;}
    g.tk=(g.tk||0)+1;if(g.tk%2)return;
    for(const s of g.sp){const L=[-s.d[1],s.d[0]];const tryD=[L,s.d,[-L[0],-L[1]],[-s.d[0],-s.d[1]]];
      for(const d of tryD){const nx=s.x+d[0],ny=s.y+d[1];if(m[ny][nx]===0&&!this.spAt(g,nx,ny)){s.x=nx;s.y=ny;s.d=d;break;}}
      if(s.x===g.px&&s.y===g.py)return A.over(g,'Паякът те ухапа! 🕷');}},
  draw(g){A.bg('#1b120c');const S=this.S;
    for(let y=0;y<this.H;y++)for(let x=0;x<this.W;x++){const v=g.m[y][x],X=x*S,Y=40+y*S;
      if(v===1){c.fillStyle=C.dirt;c.fillRect(X,Y,S,S);c.fillStyle='#6a4529';c.fillRect(X+3,Y+4,3,3);c.fillRect(X+12,Y+11,3,3);c.fillStyle='#8a6240';c.fillRect(X+14,Y+3,2,2);}
      else if(v===2)A.block(X,Y,S,'#4a4a52');
      else if(v===3){A.block(X+1,Y+1,S-2,C.stone);c.fillStyle='#666';c.fillRect(X+5,Y+6,4,4);c.fillRect(X+11,Y+11,3,3);}
      else if(v===4){const s=Math.sin(g.t*6+x+y)*.5+.5;A.block(X+3,Y+3,S-6,s>.7?'#b5fbff':C.gem);c.fillStyle='#fff';c.fillRect(X+6,Y+6,3,3);}
      else if(v===5){A.block(X,Y,S,Math.sin(g.t*8)>0?C.gold:'#c08a20');c.fillStyle='#3a2410';c.fillRect(X+5,Y+4,10,16);}}
    for(const s of g.sp){const X=s.x*S,Y=40+s.y*S,l=Math.sin(g.t*15)>0?1:0;c.fillStyle='#222';for(let i=0;i<4;i++){c.fillRect(X+1,Y+4+i*4-l,5,2);c.fillRect(X+14,Y+4+i*4+l,5,2);}
      A.block(X+5,Y+4,10,'#3b2b2b',12);c.fillStyle=C.ruby;c.fillRect(X+7,Y+7,2,2);c.fillRect(X+11,Y+7,2,2);}
    const X=g.px*S,Y=40+g.py*S;A.block(X+4,Y+8,12,'#2e7dd1',10);A.block(X+5,Y+1,10,'#e0ac69',8);c.fillStyle='#ffd23f';c.fillRect(X+4,Y,12,3);c.fillStyle='#000';c.fillRect(X+7,Y+4,2,2);c.fillRect(X+11,Y+4,2,2);
    g.parts.forEach(p=>{c.fillStyle=p.col;c.fillRect(p.x,p.y,4,4);});
    c.fillStyle='#000';c.fillRect(0,0,480,40);
    A.txt('💎 '+g.got+' / '+g.need,10,20,16,g.open?'#7cff7c':C.gem);A.txt('Ниво '+g.lvl,240,20,16,'#fff','center');A.txt('⏱ '+Math.ceil(g.time),470,20,16,g.time<20?'#f55':'#fff','right');
    if(g.mt>0)A.txt(g.msg,240,200,20,'#ffd54f','center');}
});
</script>
</body>
</html>
