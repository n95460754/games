<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хекс</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">⬡ Хекс</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 207. Хекс
A.add({id:'hex',cat:'board',icon:'⬡',name:'Хекс',desc:'Свържи двата бряга',help:'Ти си синият: свържи ЛЯВАТА и ДЯСНАТА страна с непрекъсната верига. Роботът (червен) свързва горе с долу. Кликни шестоъгълник. Равенство няма!',
  N:7,
  start(g){g.b=Array(49).fill(0);g.turn=1;g.ai=0;},
  pos(i){const x=i%7,y=Math.floor(i/7);return[90+x*34+y*17,60+y*30];},
  nb(i){const x=i%7,y=Math.floor(i/7),r=[];for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]]){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<7&&Y<7)r.push(Y*7+X);}return r;},
  won(g,p){const start=[...Array(7).keys()].map(k=>p===1?k*7:k).filter(i=>g.b[i]===p),seen=new Set(start),st=start.slice();while(st.length){const i=st.pop();if(p===1?i%7===6:Math.floor(i/7)===6)return true;for(const j of this.nb(i))if(g.b[j]===p&&!seen.has(j)){seen.add(j);st.push(j);}}return false;},
  dist(g,p){const D=Array(49).fill(1e9),q=[];for(let k=0;k<7;k++){const i=p===1?k*7:k;if(g.b[i]===3-p)continue;D[i]=g.b[i]===p?0:1;q.push(i);}
    for(let it=0;it<200&&q.length;it++){q.sort((a,b)=>D[a]-D[b]);const i=q.shift();for(const j of this.nb(i)){if(g.b[j]===3-p)continue;const nd=D[i]+(g.b[j]===p?0:1);if(nd<D[j]){D[j]=nd;q.push(j);}}}
    let m=1e9;for(let k=0;k<7;k++)m=Math.min(m,D[p===1?k*7+6:42+k]);return m;},
  click(g,mx,my){if(g.turn!==1)return;let bi=-1,bd=16;for(let i=0;i<49;i++){const[x,y]=this.pos(i);const d=Math.hypot(mx-x,my-y);if(d<bd){bd=d;bi=i;}}if(bi<0||g.b[bi])return;
    g.b[bi]=1;A.beep(600,.04);if(this.won(g,1)){g.score=1;A.tune([523,659,784]);return A.over(g,'🏆 Свърза бреговете!');}g.turn=2;g.ai=.5;},
  update(g,dt){if(g.turn!==2)return;g.ai-=dt;if(g.ai>0)return;let best=-1,bs=-1e9;for(let i=0;i<49;i++){if(g.b[i])continue;g.b[i]=2;const s=-this.dist(g,2)*1.1+this.dist(g,1)+Math.random()*.5;g.b[i]=0;if(s>bs){bs=s;best=i;}}
    g.b[best]=2;A.beep(300,.04);if(this.won(g,2))return A.over(g,'Роботът свърза горе и долу');g.turn=1;},
  draw(g){A.bg('#20302a');c.fillStyle=C.red;c.fillRect(70,30,290,6);c.fillRect(170,250,290,6);c.fillStyle='#3b7bd6';c.fillRect(64,40,6,200);c.fillRect(400,40,6,200);
    for(let i=0;i<49;i++){const[x,y]=this.pos(i);c.fillStyle=g.b[i]===1?'#3b7bd6':g.b[i]===2?C.red:'#cfd8dc';c.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3+Math.PI/6;c.lineTo(x+Math.cos(a)*17,y+Math.sin(a)*17);}c.fill();c.strokeStyle='#20302a';c.lineWidth=2;c.stroke();}
    A.txt(g.turn===1?'Твой ход: свържи ляво ↔ дясно':'Роботът...',240,330,14,'#fff','center');}
});
</script>
</body>
</html>
