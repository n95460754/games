<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нарисувай кръг</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">⭕ Нарисувай кръг</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 197. Нарисувай кръг
A.add({id:'drawcircle',cat:'skill',icon:'⭕',name:'Нарисувай кръг',desc:'Колко перфектен е кръгът ти?',help:'Натисни и задръж мишката, нарисувай кръг около червената точка с едно движение и пусни. Резултатът е колко % перфектен е! Имаш 5 опита — брои се най-добрият.',
  start(g){g.pts=[];g.res=null;g.tries=5;},
  click(g,mx,my){g.pts=[[mx,my]];g.res=null;g.drawing=true;},
  move(g,mx,my){if(g.drawing&&A.mouse.down)g.pts.push([mx,my]);},
  release(g){if(!g.drawing)return;g.drawing=false;if(g.pts.length<20){g.res='Твърде малко!';return;}
    const r=g.pts.map(([x,y])=>Math.hypot(x-240,y-180)),avg=r.reduce((a,b)=>a+b)/r.length;if(avg<40){g.res='Твърде малък!';return;}
    const dev=Math.sqrt(r.reduce((a,v)=>a+(v-avg)**2,0)/r.length)/avg;let ang=0;for(let i=1;i<g.pts.length;i++){const a1=Math.atan2(g.pts[i-1][1]-180,g.pts[i-1][0]-240),a2=Math.atan2(g.pts[i][1]-180,g.pts[i][0]-240);let d=a2-a1;if(d>Math.PI)d-=6.283;if(d<-Math.PI)d+=6.283;ang+=d;}
    if(Math.abs(ang)<5.6){g.res='Затвори кръга!';return;}const pct=Math.max(0,Math.round((1-dev*4)*100));g.res=pct+'%';g.tries--;if(pct>g.score){g.score=pct;A.tune([523,659,784]);}else A.beep(400,.1);if(pct>=95)A.over(g,'🏆 '+pct+'% — почти перфектен!');else if(!g.tries)A.over(g,'Най-добрият ти кръг: '+g.score+'%');},
  draw(g){A.bg('#14202c');c.fillStyle=C.red;c.fillRect(236,176,8,8);c.strokeStyle=C.gold;c.lineWidth=4;c.lineJoin='round';c.beginPath();g.pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();
    if(g.res)A.txt(g.res,240,40,30,'#fff','center');A.txt('Най-добър: '+g.score+'%   Опити: '+g.tries,10,345,13,'#bbb');}
});
</script>
</body>
</html>
