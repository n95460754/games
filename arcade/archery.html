<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стрелец с лък</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🏹 Стрелец с лък</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 53. Стрелец с лък
A.add({id:'archery',cat:'action',icon:'🏹',name:'Стрелец с лък',desc:'Улучи движещите се мишени',help:'Мишката насочва лъка. Задръж бутона за сила, пусни — стрелата лети по дъга. 15 стрели.',
  start(g){g.arrows=15;g.tg=[];g.fly=[];g.ch=0;for(let i=0;i<3;i++)this.add2(g);},
  add2(g){g.tg.push({x:A.ri(260,440),y:A.ri(60,300),vy:A.rnd(-60,60)});},
  click(g){if(g.arrows>0)g.charging=true;g.ch=0;},
  release(g,mx,my){if(!g.charging)return;g.charging=false;const a=Math.atan2(my-260,mx-40),p=200+g.ch*500;g.fly.push({x:40,y:260,vx:Math.cos(a)*p,vy:Math.sin(a)*p});g.arrows--;A.beep(300,.06);},
  update(g,dt){if(g.charging)g.ch=Math.min(1,g.ch+dt*1.2);
    for(const t of g.tg){t.y+=t.vy*dt;if(t.y<40||t.y>320)t.vy*=-1;}
    for(const f of g.fly){f.vy+=300*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
      for(const t of g.tg){const d=Math.hypot(f.x-t.x,f.y-t.y);if(!f.done&&d<22){f.done=1;const pts=d<7?10:d<14?5:2;g.score+=pts;A.beep(600+pts*60,.1);t.dead=1;}}}
    g.tg=g.tg.filter(t=>!t.dead);while(g.tg.length<3)this.add2(g);g.fly=g.fly.filter(f=>!f.done&&f.x<500&&f.y<380);
    if(g.arrows<=0&&!g.fly.length&&!g.charging)A.over(g,'Свършиха стрелите!');},
  draw(g){A.bg('#87ceeb');for(let x=0;x<480;x+=20)A.block(x,330,20,C.grass,30);
    for(const t of g.tg){[[22,'#fff'],[15,'#d84a3a'],[8,'#fff'],[4,'#d84a3a']].forEach(([r,col])=>{c.fillStyle=col;c.fillRect(t.x-r,t.y-r,r*2,r*2);});}
    const a=Math.atan2(A.mouse.y-260,A.mouse.x-40);c.save();c.translate(40,260);c.rotate(a);c.strokeStyle='#6b4a2a';c.lineWidth=4;c.beginPath();c.arc(0,0,22,-1.2,1.2);c.stroke();c.fillStyle='#ddd';c.fillRect(-g.ch*10,-1,34,2);c.restore();
    for(const f of g.fly){c.save();c.translate(f.x,f.y);c.rotate(Math.atan2(f.vy,f.vx));c.fillStyle='#5e4428';c.fillRect(-14,-1,20,3);c.fillStyle='#888';c.fillRect(6,-2,5,5);c.restore();}
    c.fillStyle='#333';c.fillRect(10,10,104,10);c.fillStyle='#ffb300';c.fillRect(12,12,100*g.ch,6);A.txt('Стрели: '+g.arrows,470,16,14,'#123','right');}
});
</script>
</body>
</html>
