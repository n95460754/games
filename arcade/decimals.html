<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Десетични дроби</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🔟 Десетични дроби</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 132. Десетични дроби
A.add(choiceGame({id:'decimals',cat:'brain',icon:'🔟',name:'Десетични дроби',desc:'Смятане със запетая',help:'Избери верния отговор (клик или 1–4). 60 секунди.',
  next(g){const a=A.ri(1,99)/10,b=A.ri(1,99)/100,f=v=>(Math.round(v*100)/100).toString().replace('.',',');const op=Math.random()<.6?'+':'−';const r=op==='+'?a+b:a-b;
    g.q=f(a)+' '+op+' '+f(b);g.ans=f(r);g.opts=opts4(g.ans,()=>f(r+A.pick([-1,1])*A.pick([.1,.01,1,.09,.11])));},
  pic(g){A.txt(g.q+' = ?',240,120,34,'#fff','center');}}));
</script>
</body>
</html>
