<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мобова алгебра</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🧮 Мобова алгебра</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 279. Мислена разходка
// 281. Мобова алгебра
const PA_KEYS=['1','2','3','4','5','6','7','8','9','0','⌫','OK'];
A.add({id:'picalgebra',cat:'brain',icon:'🧮',name:'Мобова алгебра',desc:'Всеки моб е число — разбери колко струва и реши задачата',
  help:'Всеки моб струва някакво число. От първите редове разбери колко е всеки моб, после реши последния ред с „?“. Пиши отговора с цифрите и Enter (или кликай бутоните долу). Умножението е преди събирането! 3 живота.',
  start(g){g.lvl=1;g.lives=3;g.inp='';this.next(g);},
  next(g){const L=g.lvl,mx=L<3?6:L<6?9:12;const a=A.ri(1,mx),b=A.ri(1,mx),c0=A.ri(1,mx);
    const M=A.shuffle(['cr','pig','zom','sl']).slice(0,3);g.mobs=M;g.val=[a,b,c0];
    // редове: [[индекси на мобове], оператор между тях]
    const rows=[];const n1=A.pick([2,3]);rows.push({t:Array(n1).fill(0),op:'+',v:a*n1});
    rows.push({t:[0,1,1].slice(0,L<2?2:3),op:'+'});rows[1].v=rows[1].t.reduce((s,i)=>s+g.val[i],0);
    if(L>=4&&Math.random()<.5){rows.push({t:[1,2],op:'×',v:b*c0});}else{rows.push({t:[2,2,1].slice(0,L<3?2:3),op:'+'});rows[2].v=rows[2].t.reduce((s,i)=>s+g.val[i],0);}
    const Qs=[[[0,'+',1,'+',2],a+b+c0],[[2,'+',0],c0+a],[[1,'+',2,'+',2],b+c0*2]];
    if(L>=3)Qs.push([[0,'×',1],a*b],[[2,'×',2],c0*c0]);
    if(L>=5)Qs.push([[0,'+',1,'×',2],a+b*c0],[[2,'×',0,'+',1],c0*a+b]);
    const q=A.pick(L>=5?Qs.slice(3):L>=3?Qs.slice(1):Qs);g.rows=rows;g.q=q[0];g.ans=q[1];g.inp='';g.ph='ask';g.reveal=0;},
  submit(g){if(g.ph!=='ask'||!g.inp||g.inp==='-')return;const ok=+g.inp===g.ans;flash(g,ok);
    if(ok){g.score+=g.lvl;g.lvl++;g.msg='Браво! +'+(g.lvl-1);}else{g.lives--;g.msg='Отговорът е '+g.ans;}
    g.ph='res';g.reveal=ok?1.2:2.8;},
  press(g,k){if(g.ph!=='ask')return;if(k==='⌫')g.inp=g.inp.slice(0,-1);else if(k==='OK')this.submit(g);else if(g.inp.length<4){g.inp+=k;A.beep(700,.02);}},
  key(g,k,ch){if(g.ph!=='ask')return;if(typeNum(g,k,ch))this.submit(g);},
  click(g,mx,my){if(my>=316&&my<=354){const i=Math.floor((mx-6)/39);if(i>=0&&i<12)this.press(g,PA_KEYS[i]);}},
  update(g,dt){if(g.fl)g.fl.t-=dt;if(g.ph==='res'){g.reveal-=dt;if(g.reveal<=0){if(g.lives<=0)return A.over(g,'Край! Стигна ниво '+g.lvl);this.next(g);}}},
  mob(type,x,y,s){const u=s/8;
    if(type==='cr'){A.block(x,y,s,'#4caf50');c.fillStyle='#1b3d1b';c.fillRect(x+u*1.5,y+u*2,u*1.6,u*1.6);c.fillRect(x+s-u*3.1,y+u*2,u*1.6,u*1.6);c.fillRect(x+u*3.2,y+u*3.6,u*1.6,u*1.4);c.fillRect(x+u*2.4,y+u*4.6,u*3.2,u*1.6);}
    else if(type==='pig'){A.block(x,y,s,'#f2a7b5');c.fillStyle='#000';c.fillRect(x+u*1.4,y+u*2.4,u,u);c.fillRect(x+s-u*2.4,y+u*2.4,u,u);c.fillStyle='#e07a90';c.fillRect(x+u*2.6,y+u*4,u*2.8,u*2);c.fillStyle='#8a3a4a';c.fillRect(x+u*3.1,y+u*4.6,u*.6,u*.8);c.fillRect(x+u*4.3,y+u*4.6,u*.6,u*.8);}
    else if(type==='zom'){A.block(x,y,s,'#3e8a6e');c.fillStyle='#2a4a2a';c.fillRect(x,y,s,u*1.6);c.fillStyle='#111';c.fillRect(x+u*1.6,y+u*3,u*1.4,u);c.fillRect(x+s-u*3,y+u*3,u*1.4,u);c.fillStyle='#244a3a';c.fillRect(x+u*2.6,y+u*5.2,u*2.8,u*.9);}
    else{c.fillStyle='rgba(110,200,90,.9)';c.fillRect(x,y,s,s);A.block(x+u*1.5,y+u*1.5,s-u*3,'#5cb84a');c.fillStyle='#1d3d1d';c.fillRect(x+u*2.2,y+u*2.8,u*1.2,u*1.2);c.fillRect(x+s-u*3.4,y+u*2.8,u*1.2,u*1.2);c.fillRect(x+u*3.6,y+u*5,u*.9,u*.7);}},
  line(g,toks,y,right,s){// toks: масив от индекси и оператори
    const S=s||36,parts=[];toks.forEach((t,i)=>{if(typeof t==='number')parts.push({m:t});else parts.push({o:t});});
    let w=0;parts.forEach(p=>w+=p.m!==undefined?S:28);w+=28+70;let x=240-w/2;
    parts.forEach(p=>{if(p.m!==undefined){this.mob(g.mobs[p.m],x,y-S/2,S);x+=S;}else{A.txt(p.o,x+14,y,22,'#fff','center');x+=28;}});
    A.txt('=',x+14,y,22,'#fff','center');x+=28;A.txt(right,x+4,y,24,right==='?'?'#ffd54f':'#c8f7c5');},
  draw(g){A.bg('#1d2b3a');c.fillStyle='#000';c.fillRect(0,0,480,28);
    A.txt('Ниво '+g.lvl,8,14,14,'#ffd54f');A.txt('Точки: '+g.score,240,14,14,'#fff','center');A.txt('❤'.repeat(Math.max(0,g.lives)),472,14,14,'#f55','right');
    g.rows.forEach((r,i)=>{const toks=[];r.t.forEach((m,j)=>{if(j)toks.push(r.op);toks.push(m);});this.line(g,toks,62+i*50,String(r.v));});
    c.fillStyle='#ffd54f';c.fillRect(40,210,400,2);
    this.line(g,g.q,240,'?',38);
    if(g.ph==='ask'){c.fillStyle='#000';c.fillRect(170,268,140,40);c.strokeStyle='#ffd54f';c.lineWidth=3;c.strokeRect(170,268,140,40);A.txt(g.inp+(Math.sin(g.t*8)>0?'_':''),240,288,24,'#fff','center');}
    else{A.block(90,268,300,g.fl&&g.fl.ok?'#2e6b30':'#7a2a2a',40);A.txt(g.msg,240,288,18,'#fff','center');}
    PA_KEYS.forEach((k,i)=>{const x=6+i*39;A.block(x,316,37,k==='OK'?'#2e7d32':k==='⌫'?'#8a4a3a':'#5a6b8c',38);A.txt(k,x+18.5,335,k==='OK'?13:16,'#fff','center');});
    if(g.ph==='res'&&!(g.fl&&g.fl.ok)){c.fillStyle='rgba(0,0,0,.85)';c.fillRect(60,218,360,44);
      g.mobs.forEach((m,i)=>{const x=80+i*120;this.mob(m,x,226,28);A.txt('= '+g.val[i],x+34,240,18,'#fff');});}
    drawFlash(g);}
});
</script>
</body>
</html>
