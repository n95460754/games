<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Небесен стрелец</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">✈️ Небесен стрелец</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 163. Небесен стрелец
A.add({id:'skyshooter',cat:'action',icon:'✈️',name:'Небесен стрелец',desc:'Хоризонтален стрелец',help:'Стрелки — летиш, Space (задръж) — стреляш. Сваляй враговете, вземай сини кутии за двойна стрелба. 3 живота.',
  start(g){g.x=60;g.y=180;g.b=[];g.e=[];g.eb=[];g.pu=[];g.sp=0;g.cd=0;g.hp=3;g.dbl=0;g.inv=0;},
  update(g,dt){const dx=(A.keys.ArrowRight||A.keys.KeyD?1:0)-(A.keys.ArrowLeft||A.keys.KeyA?1:0),dy=(A.keys.ArrowDown||A.keys.KeyS?1:0)-(A.keys.ArrowUp||A.keys.KeyW?1:0);g.x=A.clamp(g.x+dx*220*dt,10,300);g.y=A.clamp(g.y+dy*220*dt,10,350);
    g.cd-=dt;g.dbl-=dt;g.inv-=dt;if((A.keys.Space||A.mouse.down)&&g.cd<=0){g.cd=.16;g.b.push({x:g.x+14,y:g.y});if(g.dbl>0){g.b.push({x:g.x+14,y:g.y-10,vy:-80},{x:g.x+14,y:g.y+10,vy:80});}A.beep(900,.015);}
    g.sp-=dt;if(g.sp<=0){g.sp=Math.max(.35,1-g.t*.01);const big=Math.random()<.2;g.e.push({x:500,y:A.ri(20,340),big,hp:big?4:1,a:A.rnd(0,6),cd:A.rnd(1,3)});}
    for(const b of g.b){b.x+=500*dt;b.y+=(b.vy||0)*dt;}
    for(const e of g.e){e.x-=(90+g.t)*dt;e.y+=Math.sin(g.t*2+e.a)*60*dt;e.cd-=dt;if(e.cd<=0){e.cd=A.rnd(1.5,3);g.eb.push({x:e.x,y:e.y,vx:-200});}
      for(const b of g.b)if(Math.abs(b.x-e.x)<14&&Math.abs(b.y-e.y)<12){b.x=999;e.hp--;if(e.hp<=0){e.dead=1;g.score+=e.big?3:1;A.beep(200,.05);if(Math.random()<.12)g.pu.push({x:e.x,y:e.y});}}
      if(!e.dead&&g.inv<=0&&Math.abs(e.x-g.x)<18&&Math.abs(e.y-g.y)<14){e.dead=1;this.hurt(g);}}
    for(const q of g.eb){q.x+=q.vx*dt;if(g.inv<=0&&Math.abs(q.x-g.x)<10&&Math.abs(q.y-g.y)<8){q.x=-99;this.hurt(g);}}
    for(const p of g.pu){p.x-=80*dt;if(Math.abs(p.x-g.x)<16&&Math.abs(p.y-g.y)<16){p.x=-99;g.dbl=8;A.tune([660,880]);}}
    g.b=g.b.filter(b=>b.x<490);g.e=g.e.filter(e=>!e.dead&&e.x>-30);g.eb=g.eb.filter(q=>q.x>-10);g.pu=g.pu.filter(p=>p.x>-10);},
  hurt(g){g.hp--;g.inv=1.5;A.beep(80,.3,'sawtooth');if(!g.hp)A.over(g,'Свалиха те!');},
  draw(g){A.bg('#5aa0dc');c.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<6;i++){const x=480-((g.t*60+i*97)%560);c.fillRect(x,30+i*55,70,16);}
    for(const e of g.e)A.block(e.x-12,e.y-10,24,e.hp>1?'#5a2b4a':C.red,20);c.fillStyle='#ff0';for(const b of g.b)c.fillRect(b.x-4,b.y-1,8,3);c.fillStyle='#f50';for(const q of g.eb)c.fillRect(q.x-3,q.y-3,6,6);
    for(const p of g.pu)A.block(p.x-8,p.y-8,16,C.water);if(g.inv<=0||Math.sin(g.t*25)>0){A.block(g.x-14,g.y-6,28,'#eee',12);c.fillStyle='#3b7bd6';c.fillRect(g.x-8,g.y-12,8,24);}
    A.txt('❤'.repeat(g.hp)+(g.dbl>0?'  ⚡x3':''),10,14,14,'#f55');}
});
</script>
</body>
</html>
