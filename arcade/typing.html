<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бързи пръсти</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">⌨️ Бързи пръсти</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 88. Бързи пръсти
A.add({id:'typing',cat:'skill',icon:'⌨️',name:'Бързи пръсти',desc:'Пиши буквите, преди да паднат',help:'Букви падат отгоре. Натисни клавиша с тази латинска буква (работи и на българска подредба), за да ги разбиеш. Ако 3 стигнат земята — край.',
  start(g){g.L=[];g.sp=0;g.miss=0;},
  key(g,k,ch){if(!k.startsWith('Key'))return;const up=k.slice(3);const t=g.L.filter(l=>l.ch===up).sort((a,b)=>b.y-a.y)[0];if(t){t.dead=1;g.score++;A.beep(800,.03);}else A.beep(150,.04);},
  update(g,dt){g.sp-=dt;if(g.sp<=0){g.sp=Math.max(.35,1.2-g.t*.02);g.L.push({ch:'ASDFGHJKLQWERTYUIOPZXCVBNM'[A.ri(0,g.t<20?8:25)],x:A.ri(20,440),y:-20,v:40+g.t*1.5});}
    for(const l of g.L){l.y+=l.v*dt;if(l.y>330&&!l.dead){l.dead=1;g.miss++;A.beep(100,.2,'sawtooth');if(g.miss>=3)return A.over(g,'3 букви паднаха');}}g.L=g.L.filter(l=>!l.dead);},
  draw(g){A.bg('#1d2b3a');for(let x=0;x<480;x+=20)A.block(x,340,20,C.stone,20);for(const l of g.L){A.block(l.x,l.y,32,'#5a6b8c');A.txt(l.ch,l.x+16,l.y+16,20,'#fff','center');}A.txt('✖'.repeat(g.miss),10,14,14,'#f66');}
});
</script>
</body>
</html>
