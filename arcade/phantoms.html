<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фантоми в нощта</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">👻 Фантоми в нощта</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 295. Фантоми в нощта
const PH_STARS=[];for(let i=0;i<40;i++)PH_STARS.push([A.ri(0,479),A.ri(24,250),A.ri(1,2)]);
A.add({id:'phantoms',cat:'action',icon:'👻',name:'Фантоми в нощта',desc:'Не си спал три нощи — стреляй с лъка по пикиращите фантоми',
  help:'← → / A D или мишка / пръст — движение. Space / клик / докосване — стрела нагоре. Пикиращ фантом = 2 точки. Хващай падащите мембрани (+3). 3 сърца.',
  start(g){g.x=240;g.tx=null;g.ph=[];g.ar=[];g.drops=[];g.parts=[];g.lives=3;g.inv=0;g.cd=0;g.spawn=1.2;g.face=1;},
  shoot(g){if(g.cd>0)return;g.cd=.28;g.ar.push({x:g.x,y:292});A.beep(520,.05,'square',.03);},
  key(g,k){if(k==='Space'||k==='ArrowUp'||k==='KeyW')this.shoot(g);if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(k))g.tx=null;},
  move(g,x){g.tx=A.clamp(x,12,468);},
  click(g,x){g.tx=A.clamp(x,12,468);this.shoot(g);},
  update(g,dt){
    const L=A.keys.ArrowLeft||A.keys.KeyA,R=A.keys.ArrowRight||A.keys.KeyD,sp=210*dt;
    if(L){g.x-=sp;g.face=-1;}if(R){g.x+=sp;g.face=1;}
    if(!L&&!R&&g.tx!==null){const d=g.tx-g.x;if(Math.abs(d)>2){g.x+=Math.sign(d)*Math.min(Math.abs(d),sp*1.2);g.face=Math.sign(d);}}
    g.x=A.clamp(g.x,12,468);g.cd-=dt;g.inv-=dt;
    // нови фантоми
    g.spawn-=dt;if(g.spawn<=0){g.spawn=Math.max(.45,1.6-g.t*.012)*A.rnd(.7,1.2);const s=Math.random()<.5?-1:1;
      g.ph.push({x:s<0?-30:510,y:A.rnd(40,130),vx:-s*A.rnd(60,95)*(1+g.t*.004),st:'fly',tt:A.rnd(1,3),w:A.rnd(0,6)});}
    for(const p of g.ph){
      p.w+=dt*6;
      if(p.st==='fly'){p.x+=p.vx*dt;p.y+=Math.sin(p.w)*20*dt;p.tt-=dt;
        if(p.tt<=0&&p.x>20&&p.x<460){p.st='dive';const dx=g.x-p.x,dy=300-p.y,l=Math.hypot(dx,dy),v=170+g.t*1.2;p.dx=dx/l*v;p.dy=dy/l*v;A.beep(180,.15,'sawtooth',.03);}}
      else if(p.st==='dive'){p.x+=p.dx*dt;p.y+=p.dy*dt;if(p.y>300){p.st='up';p.dy=-p.dy*.8;}}
      else{p.x+=p.dx*dt;p.y+=p.dy*dt;if(p.y<-30)p.dead=true;}
      if(p.x<-60||p.x>540)p.dead=true;
      if(!p.dead&&g.inv<=0&&Math.abs(p.x-g.x)<22&&Math.abs(p.y-(300))<22){p.dead=true;g.lives--;g.inv=1.2;A.beep(120,.3,'sawtooth',.06);
        if(g.lives<=0)return A.over(g,'Фантомите те хванаха!');}
    }
    for(const a of g.ar){a.y-=420*dt;if(a.y<0)a.dead=true;
      for(const p of g.ph)if(!p.dead&&Math.abs(a.x-p.x)<20&&Math.abs(a.y-p.y)<10){p.dead=true;a.dead=true;g.score+=p.st==='fly'?1:2;A.beep(880,.06,'triangle');
        for(let i=0;i<8;i++)g.parts.push({x:p.x,y:p.y,vx:A.rnd(-80,80),vy:A.rnd(-80,40),t:.6});
        if(Math.random()<.18)g.drops.push({x:p.x,y:p.y});break;}}
    for(const d of g.drops){d.y+=90*dt;if(d.y>330)d.dead=true;
      if(Math.abs(d.x-g.x)<18&&d.y>282){d.dead=true;g.score+=3;A.tune([660,880,1100]);}}
    for(const q of g.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=200*dt;q.t-=dt;}
    g.ph=g.ph.filter(p=>!p.dead);g.ar=g.ar.filter(a=>!a.dead);g.drops=g.drops.filter(d=>!d.dead);g.parts=g.parts.filter(q=>q.t>0);
  },
  draw(g){
    A.bg('#0b1030');c.fillStyle='#fff';for(const s of PH_STARS){if((s[0]+Math.floor(g.t*2))%17)c.fillRect(s[0],s[1],s[2],s[2]);}
    A.block(400,40,32,'#f4f0d0');c.fillStyle='#d8d2b0';c.fillRect(408,48,6,6);c.fillRect(420,60,5,5);
    for(let x=0;x<480;x+=20){A.block(x,320,20,C.grass,6);A.block(x,326,20,C.dirt,34);}
    // фантоми
    for(const p of g.ph){const f=Math.sin(p.w*2)*6,dir=p.st==='fly'?Math.sign(p.vx):Math.sign(p.dx||1);
      c.fillStyle='#3b4f8c';c.fillRect(p.x-18,p.y-4+f,12,5);c.fillRect(p.x+6,p.y-4+f,12,5);
      A.block(p.x-9,p.y-5,18,'#4b62a8',10);c.fillStyle='#7fe85a';c.fillRect(p.x+(dir>0?3:-7),p.y-3,4,3);
      c.fillStyle='#2c3a6a';c.fillRect(p.x-dir*13,p.y-2,5,4);}
    for(const a of g.ar){c.fillStyle='#c9a26a';c.fillRect(a.x-1,a.y,2,14);c.fillStyle='#ddd';c.fillRect(a.x-2,a.y-3,4,4);c.fillStyle='#fff';c.fillRect(a.x-2,a.y+12,4,3);}
    for(const d of g.drops){A.block(d.x-6,d.y-6,12,'#c8c8d8');}
    for(const q of g.parts){c.fillStyle='rgba(120,140,220,'+(q.t/.6)+')';c.fillRect(q.x,q.y,4,4);}
    // играч
    if(g.inv<=0||Math.floor(g.t*12)%2){const x=g.x-8;
      A.block(x,286,16,'#c99a72',12);c.fillStyle='#3a2a1a';c.fillRect(x,286,16,4);c.fillStyle='#fff';c.fillRect(x+(g.face>0?9:3),292,3,3);
      A.block(x,298,16,'#2f9fb5',12);A.block(x,310,16,'#3b45a8',10);
      c.fillStyle='#8a5a2a';c.fillRect(x+(g.face>0?16:-3),294,3,14);}
    A.txt('❤'.repeat(Math.max(0,g.lives)),10,14,15,'#f55');A.txt('Нощ: '+Math.floor(g.t)+' с',470,14,13,'#bcd','right');
  }
});
</script>
</body>
</html>
