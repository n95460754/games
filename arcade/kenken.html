<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калкудоку</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🧮 Калкудоку</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 359. Калкудоку
// Пъзел като судоку, но със сметки: в квадрат N×N всяко число от 1 до N е веднъж във
// всеки ред и колона. Цветните рудни жили показват резултат и действие (6+, 2÷, 12×, 1−) —
// числата в жилата трябва да дават точно това. Започва с 3×3, после 4×4 и 5×5.
A.add({id:'kenken',cat:'puzzle',icon:'🧮',name:'Калкудоку',desc:'Числа без повторения в ред и колона — и всяка рудна жила трябва да дава своята сметка!',
  help:'Попълни всеки ред и колона с числата 1…N без повторения. Числото в ъгъла на всяка цветна жила е резултатът: + събиране, − разлика, × умножение, ÷ деление. Стрелки + цифри (0 = изтрий) или клик на поле и после на число. Решен пъзел = точки и +25 секунди.',
  start(g){g.time=180;g.done=0;g.sel=[0,0];this.gen(g);},
  gen(g){const N=g.done<2?3:g.done<5?4:5;g.N=N;g.wait=0;
    const rp=A.shuffle([...Array(N).keys()]),cp=A.shuffle([...Array(N).keys()]),sp=A.shuffle([...Array(N)].map((_,i)=>i+1));
    g.sol=rp.map(r=>cp.map(cc=>sp[(r+cc)%N]));g.val=[...Array(N)].map(()=>Array(N).fill(0));
    g.cg=[...Array(N)].map(()=>Array(N).fill(-1));g.cages=[];
    const cells=A.shuffle([...Array(N*N).keys()]);
    for(const k of cells){const r0=Math.floor(k/N),c0=k%N;if(g.cg[r0][c0]>=0)continue;
      const q=Math.random(),size=Math.min(N===3?3:4,q<.1?1:q<.6?2:q<.92?3:4),id=g.cages.length,cl=[[r0,c0]];g.cg[r0][c0]=id;
      while(cl.length<size){const nb=[];for(const [r,cc] of cl)for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const R=r+dr,Cc=cc+dc;
          if(R>=0&&Cc>=0&&R<N&&Cc<N&&g.cg[R][Cc]<0)nb.push([R,Cc]);}
        if(!nb.length)break;const p=A.pick(nb);g.cg[p[0]][p[1]]=id;cl.push(p);}
      g.cages.push({cl});}
    for(const cg of g.cages){const v=cg.cl.map(([r,cc])=>g.sol[r][cc]);cg.cl.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
      if(v.length===1){cg.op='';cg.t=v[0];}
      else if(v.length===2){const a=Math.max(...v),b=Math.min(...v),ops=['+','−','×'];if(a%b===0&&b>1)ops.push('÷','÷');if(a!==b&&b===1)ops.push('−');
        cg.op=A.pick(ops);cg.t=cg.op==='+'?a+b:cg.op==='−'?a-b:cg.op==='×'?a*b:a/b;}
      else{const pr=v.reduce((x,y)=>x*y,1);cg.op=pr<=120&&Math.random()<.45?'×':'+';cg.t=cg.op==='×'?pr:v.reduce((x,y)=>x+y,0);}
      cg.lab=cg.t+cg.op;}
    const pal=['#c9b48a','#9fc7e0','#b8d89a','#e8a8a8','#d0b0e8','#ead27a','#a0d8c8','#e8c0a0'];
    g.cages.forEach((cg,i)=>{const bad=new Set();for(const [r,cc] of cg.cl)for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const R=r+dr,Cc=cc+dc;
        if(R>=0&&Cc>=0&&R<N&&Cc<N){const o=g.cg[R][Cc];if(o<i)bad.add(g.cages[o].col);}}
      cg.col=pal.find(p=>!bad.has(p))||pal[i%pal.length];});
    g.sel=[Math.min(g.sel[0],N-1),Math.min(g.sel[1],N-1)];},
  cageOk(g,cg){const v=cg.cl.map(([r,cc])=>g.val[r][cc]);if(v.includes(0))return null;
    if(cg.op==='')return v[0]===cg.t;if(cg.op==='+')return v.reduce((a,b)=>a+b,0)===cg.t;if(cg.op==='×')return v.reduce((a,b)=>a*b,1)===cg.t;
    const a=Math.max(...v),b=Math.min(...v);return cg.op==='−'?a-b===cg.t:a===b*cg.t;},
  dup(g,r,cc){const v=g.val[r][cc];if(!v)return false;for(let i=0;i<g.N;i++){if(i!==cc&&g.val[r][i]===v)return true;if(i!==r&&g.val[i][cc]===v)return true;}return false;},
  check(g){const N=g.N;for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++)if(!g.val[r][cc]||this.dup(g,r,cc))return;
    if(!g.cages.every(cg=>this.cageOk(g,cg)))return;
    g.done++;g.score+=N-2;g.time+=25;g.wait=1.4;flash(g,true);A.tune([660,880,1100,1320]);},
  set(g,v){if(g.wait>0||v<0||v>g.N)return;const [r,cc]=g.sel;g.val[r][cc]=v;A.beep(v?500+v*60:250,.05);if(v)this.check(g);},
  geo(g){const cs=Math.floor(300/g.N);return {x0:16+(300-cs*g.N)/2,y0:46,cs};},
  key(g,k,ch){if(g.wait>0)return;const d={ArrowUp:[-1,0],KeyW:[-1,0],ArrowDown:[1,0],KeyS:[1,0],ArrowLeft:[0,-1],KeyA:[0,-1],ArrowRight:[0,1],KeyD:[0,1]}[k];
    if(d){g.sel=[(g.sel[0]+d[0]+g.N)%g.N,(g.sel[1]+d[1]+g.N)%g.N];return;}
    if(k==='Backspace'||k==='Delete'||ch==='0')return this.set(g,0);const n=+ch;if(n>=1&&n<=g.N)this.set(g,n);},
  click(g,mx,my){const {x0,y0,cs}=this.geo(g);
    if(mx>=x0&&mx<x0+cs*g.N&&my>=y0&&my<y0+cs*g.N){g.sel=[Math.floor((my-y0)/cs),Math.floor((mx-x0)/cs)];A.beep(400,.02);return;}
    if(mx>=338&&mx<=466){const i=Math.floor((my-46)/50);if(i>=0&&i<g.N&&(my-46)%50<44)this.set(g,i+1);else if(i===g.N&&(my-46)%50<44)this.set(g,0);}},
  update(g,dt){tick(g,dt);if(g.wait>0){g.wait-=dt;if(g.wait<=0)this.gen(g);}},
  draw(g){A.bg('#2b2f3a');for(let x=0;x<480;x+=40)for(let y=0;y<360;y+=40)A.block(x,y,40,(x*3+y*7)%9?'#333845':'#383d4a');
    const N=g.N,{x0,y0,cs}=this.geo(g);
    for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++){const cg=g.cages[g.cg[r][cc]],x=x0+cc*cs,y=y0+r*cs,ok=this.cageOk(g,cg);
      A.block(x,y,cs,ok===false?'#e57373':cg.col);c.fillStyle='rgba(0,0,0,.12)';c.fillRect(x+cs*.7,y+cs*.65,5,5);c.fillRect(x+cs*.2,y+cs*.8,4,4);}
    if(g.wait<=0){const [sr,sc]=g.sel;c.fillStyle='rgba(255,255,255,.35)';c.fillRect(x0+sc*cs,y0+sr*cs,cs,cs);}
    c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;for(let i=1;i<N;i++){c.beginPath();c.moveTo(x0+i*cs,y0);c.lineTo(x0+i*cs,y0+N*cs);c.moveTo(x0,y0+i*cs);c.lineTo(x0+N*cs,y0+i*cs);c.stroke();}
    c.fillStyle='#111';for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++){const id=g.cg[r][cc],x=x0+cc*cs,y=y0+r*cs;
      if(cc<N-1&&g.cg[r][cc+1]!==id)c.fillRect(x+cs-2,y-1,4,cs+2);if(r<N-1&&g.cg[r+1][cc]!==id)c.fillRect(x-1,y+cs-2,cs+2,4);}
    c.strokeStyle='#111';c.lineWidth=4;c.strokeRect(x0,y0,N*cs,N*cs);
    for(const cg of g.cages){const [r,cc]=cg.cl[0];c.font='bold '+(N>4?12:14)+'px Consolas,monospace';c.textAlign='left';c.textBaseline='top';c.fillStyle='#1a1a1a';c.fillText(cg.lab,x0+cc*cs+5,y0+r*cs+4);}
    for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++){const v=g.val[r][cc];if(v)A.txt(String(v),x0+cc*cs+cs/2,y0+r*cs+cs/2+5,Math.floor(cs*.48),this.dup(g,r,cc)?'#ff5252':'#fff','center');}
    if(g.wait<=0&&Math.sin(g.t*6)>-.3){const [sr,sc]=g.sel;c.strokeStyle='#ffd54f';c.lineWidth=3;c.strokeRect(x0+sc*cs+2,y0+sr*cs+2,cs-4,cs-4);}
    for(let i=0;i<=N;i++){const y=46+i*50;A.block(338,y,128,i<N?'#5a6b8c':'#7a4a4a',44);A.txt(i<N?String(i+1):'⌫ изтрий',402,y+23,i<N?22:14,'#fff','center');}
    A.txt('⏱ '+Math.ceil(g.time),10,16,15,g.time<20?'#ff6b6b':'#fff');A.txt('Пъзел '+(g.done+1)+' · '+N+'×'+N,330,16,14,'#ffd54f','right');
    if(g.wait>0)A.txt('Решено! +25 с ✔',x0+N*cs/2,y0+N*cs/2,24,'#9cff8a','center');
    drawFlash(g);}
});
</script>
</body>
</html>
