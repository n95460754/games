<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зигзаг</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">↗️ Зигзаг</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 154. Зигзаг
A.add({id:'zigzag',cat:'action',icon:'↗️',name:'Зигзаг',desc:'Стой на пътеката',help:'Топчето се движи по диагонал. Space / клик — смени посоката. Не падай от пътеката!',
  start(g){g.x=240;g.dir=1;g.path=[];let x=240;for(let i=0;i<60;i++){g.path.push(x);}g.off=0;g.cx=240;g.seg=0;},
  key(g,k){if(k==='Space'){g.dir*=-1;g.score++;A.beep(500,.03);}},
  update(g,dt){const sp=120+g.t*3;g.off+=sp*dt;g.x+=g.dir*sp*dt;while(g.off>=8){g.off-=8;g.path.shift();g.seg--;if(g.seg<=0){g.seg=A.ri(4,14);g.pd=A.pick([-1,1]);}g.cx=A.clamp(g.cx+g.pd*8,90,390);g.path.push(g.cx);}
    const w=Math.max(30,60-g.t*.6),cx=g.path[25];if(Math.abs(g.x-cx)>w/2)A.over(g,'Падна от пътеката!');},
  draw(g){A.bg('#7e57c2');const w=Math.max(30,60-g.t*.6);g.path.forEach((x,i)=>{const y=360-i*8+g.off-8;if(y<-8)return;c.fillStyle=i%2?'#ede7f6':'#d1c4e9';c.fillRect(x-w/2,y,w,9);});
    c.fillStyle=C.gold;c.beginPath();c.arc(g.x,360-25*8+4,9,0,7);c.fill();}
});
</script>
</body>
</html>
