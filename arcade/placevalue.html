<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Строй числото</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🔢 Строй числото</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 257. Строй числото
A.add({id:'placevalue',cat:'brain',icon:'🔢',name:'Строй числото',desc:'Построй числото от стотици, десетици и единици — и с прехвърляне',help:'Построй търсеното число с блокове: стотици (златни плочи), десетици (железни пръчки) и единици (тревни кубчета). Клик на − / + под колоната или стрелки ← → (колона) и ↑ ↓ (добави / махни). Можеш и да напишеш цифрите. Enter / Space или „Готово“ — провери. Грешка = −5 секунди. 90 секунди.',
  CX:[110,240,370],NM:['Стотици','Десетици','Единици'],
  w(n,i){return n+' '+(n===1?['стотица','десетица','единица']:['стотици','десетици','единици'])[i];},
  start(g){g.time=90;g.why='';this.next(g);},
  next(g){g.n=[0,0,0];g.sel=0;const lv=g.score,typ=A.pick(lv<3?[0,1,2]:lv<7?[1,2,3,4]:[2,3,3,4,4]);
    let T=A.ri(typ<3&&lv<3?10:100,999),q;
    const h=Math.floor(T/100),t=Math.floor(T/10)%10,o=T%10;
    if(typ===0)q=String(T);
    else if(typ===1)q=A.shuffle([h*100,t*10,o].filter(v=>v)).join(' + ');
    else if(typ===2){const p=[];if(h)p.push(this.w(h,0));if(t)p.push(this.w(t,1));if(o)p.push(this.w(o,2));q=A.shuffle(p).join(', ');}
    else if(typ===3){const v=[[0,h*10+t,o],[h,0,t*10+o]];if(h)v.push([h-1,t+10,o]);if(t)v.push([h,t-1,o+10]);const s=A.pick(v);
      const p=[];s.forEach((n,i)=>{if(n)p.push(this.w(n,i));});q=p.join(', ');}
    else{let d,X,up;do{d=A.pick([1,10,100]);up=Math.random()<.5;X=up?T-d:T+d;}while(X<1||X>999);
      q='с '+d+(up?' повече':' по-малко')+' от '+X;}
    g.T=T;g.q=q;},
  inc(g,i,d){g.sel=i;g.n[i]=A.clamp(g.n[i]+d,0,9);A.beep(d>0?600:420,.03);},
  check(g){const v=g.n[0]*100+g.n[1]*10+g.n[2],ok=v===g.T;flash(g,ok);if(ok){g.score++;g.why='';}else{g.time-=5;g.why='Беше '+g.T;}this.next(g);},
  key(g,k,ch){
    if(k==='ArrowLeft'||k==='KeyA')g.sel=(g.sel+2)%3;else if(k==='ArrowRight'||k==='KeyD')g.sel=(g.sel+1)%3;
    else if(k==='ArrowUp'||k==='KeyW')this.inc(g,g.sel,1);else if(k==='ArrowDown'||k==='KeyS')this.inc(g,g.sel,-1);
    else if(ch>='0'&&ch<='9'){g.n[g.sel]=+ch;g.sel=Math.min(2,g.sel+1);A.beep(700,.02);}
    else if(k==='Backspace'){g.n=[0,0,0];g.sel=0;}
    else if(k==='Enter'||k==='NumpadEnter'||k==='Space')this.check(g);},
  click(g,mx,my){if(my>320&&my<354&&mx>170&&mx<310)return this.check(g);
    for(let i=0;i<3;i++){const x=this.CX[i];if(mx>x-62&&mx<x+62&&my>84&&my<316){g.sel=i;if(my>272&&my<312&&Math.abs(mx-x)>14)this.inc(g,i,mx<x?-1:1);}}},
  update(g,dt){tick(g,dt);},
  draw(g){A.bg('#1d2b3a');
    c.fillStyle='#000';c.fillRect(34,32,420,52);c.fillStyle='#2f4a63';c.fillRect(30,28,420,52);
    A.txt('Построй:',40,40,11,'#b9c6d6');A.txt(g.q,240,60,g.q.length>30?15:g.q.length>20?19:28,'#fff','center');
    for(let i=0;i<3;i++){const x=this.CX[i],n=g.n[i];
      if(g.sel===i){c.strokeStyle='#ffd54f';c.lineWidth=2;c.strokeRect(x-62,86,124,230);}
      A.txt(this.NM[i],x,98,13,['#ffd23f','#d8dde6','#7fd35a'][i],'center');
      if(i===0)for(let k=0;k<n;k++){const y=258-(k+1)*15;A.block(x-45,y,90,C.gold,13);c.fillStyle='rgba(120,80,0,.5)';for(let j=1;j<10;j++)c.fillRect(x-45+j*9,y+2,1,9);}
      else if(i===1)for(let k=0;k<n;k++){const rx=x-54+k*12;for(let j=0;j<10;j++)A.block(rx,258-(j+1)*10,10,'#c8ccd4');}
      else for(let k=0;k<n;k++){A.block(x-30+(k%3)*21,258-(Math.floor(k/3)+1)*21,19,C.grass);c.fillStyle=C.dirt;c.fillRect(x-30+(k%3)*21,258-(Math.floor(k/3)+1)*21+10,19,9);}
      c.fillStyle='#3a4a5e';c.fillRect(x-58,261,116,3);
      A.block(x-58,274,36,'#5a6b8c',36);A.txt('−',x-40,292,22,'#fff','center');
      A.block(x+22,274,36,'#5a6b8c',36);A.txt('+',x+40,292,22,'#fff','center');
      A.txt(String(n),x,292,26,'#ffd54f','center');}
    A.block(170,320,140,'#3f8a24',34);A.txt('Готово ✔',240,337,16,'#fff','center');
    A.txt('Ти: '+(g.n[0]*100+g.n[1]*10+g.n[2]),20,337,14,'#b9c6d6');
    A.txt('⏱ '+Math.ceil(g.time),10,14,14);if(g.why)A.txt(g.why,470,14,12,'#bbb','right');A.txt('Точки: '+g.score,240,14,12,'#b9c6d6','center');
    drawFlash(g);}
});
</script>
</body>
</html>
