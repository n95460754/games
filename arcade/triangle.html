<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ъгли в триъгълник</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🔺 Ъгли в триъгълник</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 131. Ъгли в триъгълника
A.add(numGame({id:'triangle',cat:'brain',icon:'🔺',name:'Ъгли в триъгълник',desc:'Сборът е 180°',help:'Сборът на ъглите в триъгълник е 180°. Намери третия ъгъл. 60 секунди.',
  next(g){const a=A.ri(20,110),b=A.ri(15,160-a);g.ans=180-a-b;g.a=[a,b];g.q='α = '+a+'°, β = '+b+'°, γ = ?';},
  pic(g){c.strokeStyle='#ffd54f';c.lineWidth=3;c.beginPath();c.moveTo(150,250);c.lineTo(330,250);c.lineTo(230,120);c.closePath();c.stroke();A.txt(g.a[0]+'°',175,238,14,'#fff','center');A.txt(g.a[1]+'°',305,238,14,'#fff','center');A.txt('?',230,150,16,'#ff8a80','center');}}));
</script>
</body>
</html>
