<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хвърли кирката</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">⛏️ Хвърли кирката</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 238. Хвърли кирката
A.add({id:'axethrow',cat:'skill',icon:'⛏️',name:'Хвърли кирката',desc:'Забивай кирки във въртящия се дънер, без да удряш другите',help:'Space / клик / докосване — хвърли кирка. Не уцелвай вече забитите кирки! Ябълка на дънера = +3 точки. Забий всички кирки, за да счупиш дънера и да минеш нататък.',
  CX:240,CY:130,R:58,
  start(g){g.lvl=0;g.parts=[];this.level(g);},
  level(g){g.lvl++;g.rot=0;g.stuck=[];g.apples=[];g.fly=null;g.left=Math.min(11,4+g.lvl);g.base=1.5+g.lvl*.18;g.dir=g.lvl%2?1:-1;
    const pre=Math.min(5,Math.floor(g.lvl/2));
    for(let i=0;i<pre;i++){let a,n=0;do{a=Math.random()*Math.PI*2;n++;}while(n<50&&g.stuck.some(s=>this.diff(s,a)<.5));g.stuck.push(a);}
    const ap=A.ri(1,2);for(let i=0;i<ap;i++){let a,n=0;do{a=Math.random()*Math.PI*2;n++;}while(n<50&&(g.stuck.some(s=>this.diff(s,a)<.4)||g.apples.some(s=>this.diff(s,a)<.5)));g.apples.push(a);}
    g.msg={s:'Ниво '+g.lvl,t:1.2};},
  diff(a,b){let d=Math.abs(a-b)%(Math.PI*2);return d>Math.PI?Math.PI*2-d:d;},
  key(g,k){if(k==='Space'||k==='ArrowUp'||k==='KeyW')this.throw(g);},
  click(g){this.throw(g);},
  throw(g){if(g.fly||g.left<=0||g.brk)return;g.fly={y:316};g.left--;A.beep(300,.05,'triangle');},
  update(g,dt){
    if(g.msg){g.msg.t-=dt;if(g.msg.t<=0)g.msg=null;}
    g.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.t-=dt;});g.parts=g.parts.filter(p=>p.t>0);
    if(g.brk){g.brk-=dt;if(g.brk<=0){g.brk=0;this.level(g);}return;}
    let sp=g.base;if(g.lvl>=3)sp*=1+.7*Math.sin(g.t*1.4);if(g.lvl>=5&&Math.sin(g.t*.55)<0)sp=-sp;
    g.rot+=sp*g.dir*dt;
    if(g.fly){g.fly.y-=900*dt;
      if(g.fly.y<=this.CY+this.R){const a=((Math.PI/2-g.rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
        if(g.stuck.some(s=>this.diff(s,a)<.2)){g.fly=null;A.beep(120,.3,'sawtooth',.06);g.bounce={t:.5};return A.over(g,'Удари друга кирка!');}
        g.stuck.push(a);g.fly=null;g.score++;A.beep(520,.05);g.shake=.12;
        const hit=g.apples.findIndex(s=>this.diff(s,a)<.28);
        if(hit>=0){g.apples.splice(hit,1);g.score+=3;A.tune([700,940]);this.burst(g,this.CX,this.CY+this.R,C.red,8);}
        if(g.left<=0){g.score+=5;g.brk=1;A.tune([523,659,784,1046]);for(let i=0;i<24;i++){const q=Math.random()*Math.PI*2;g.parts.push({x:this.CX+Math.cos(q)*40,y:this.CY+Math.sin(q)*40,vx:Math.cos(q)*A.rnd(80,240),vy:Math.sin(q)*A.rnd(80,240)-120,t:1.4,col:A.pick([C.wood,'#7a5233','#b9854a']),s:A.ri(6,12)});}}
      }}
    if(g.shake)g.shake=Math.max(0,g.shake-dt);
  },
  burst(g,x,y,col,n){for(let i=0;i<n;i++)g.parts.push({x,y,vx:A.rnd(-150,150),vy:A.rnd(-250,-50),t:.8,col,s:5});},
  pick(x,y,ang){// кирка: върхът е в (x,y), дръжката сочи по ъгъла ang навън
    c.save();c.translate(x,y);c.rotate(ang);
    c.fillStyle='#000';c.fillRect(6,-4,44,8);c.fillStyle='#9a6a3a';c.fillRect(7,-3,42,6);c.fillStyle='#b9854a';c.fillRect(7,-3,42,2);
    c.fillStyle='#000';c.fillRect(-2,-16,12,32);c.fillStyle='#4de8f5';c.fillRect(0,-14,8,28);c.fillStyle='#a8f6ff';c.fillRect(0,-14,3,28);
    c.fillStyle='#2ab6c4';c.fillRect(-4,-17,6,4);c.fillRect(-4,13,6,4);
    c.restore();},
  draw(g){
    A.bg('#2b3d55');for(let x=0;x<480;x+=24)for(let y=0;y<360;y+=24)if((x+y)%48===0){c.fillStyle='#30445e';c.fillRect(x,y,24,24);}
    for(let x=0;x<480;x+=24){A.block(x,336,24,C.grass,8);A.block(x,344,24,C.dirt,16);}
    const cx=this.CX+(g.shake?A.rnd(-3,3):0),cy=this.CY+(g.shake?A.rnd(-3,3):0),R=this.R;
    if(!g.brk){
      g.stuck.forEach(a=>{const w=a+g.rot;this.pick(cx+Math.cos(w)*(R-6),cy+Math.sin(w)*(R-6),w);});
      c.save();c.translate(cx,cy);c.rotate(g.rot);
      c.beginPath();c.arc(0,0,R,0,Math.PI*2);c.fillStyle='#000';c.fill();
      c.beginPath();c.arc(0,0,R-3,0,Math.PI*2);c.fillStyle='#9a6a3a';c.fill();
      c.save();c.beginPath();c.arc(0,0,R-3,0,Math.PI*2);c.clip();
      for(let x=-R;x<R;x+=12)for(let y=-R;y<R;y+=12){const r=Math.hypot(x+6,y+6);c.fillStyle=Math.floor(r/12)%2?'#b9854a':'#8a5a2c';c.fillRect(x,y,12,12);}
      c.fillStyle='#5c3a1a';c.fillRect(-6,-6,12,12);c.restore();
      c.restore();
      g.apples.forEach(a=>{const w=a+g.rot,x=cx+Math.cos(w)*(R+8),y=cy+Math.sin(w)*(R+8);A.block(x-8,y-8,16,C.red);c.fillStyle='#3f8a24';c.fillRect(x-1,y-12,4,5);});
    }
    if(g.fly)this.pick(this.CX,g.fly.y,Math.PI/2);
    else if(g.left>0&&!g.brk&&A.state==='play')this.pick(this.CX,316,Math.PI/2);
    g.parts.forEach(p=>A.block(p.x,p.y,p.s,p.col));
    for(let i=0;i<g.left;i++){c.fillStyle=i===0&&!g.fly?'#4de8f5':'#2ab6c4';c.fillRect(14,320-i*16,14,10);c.fillStyle='#9a6a3a';c.fillRect(28,323-i*16,10,4);}
    A.txt('Ниво '+g.lvl,470,16,14,'#ffd54f','right');A.txt('Кирки: '+g.left,10,16,14);
    if(g.msg)A.txt(g.msg.s,240,250,26,'#ffd54f','center');
  }
});
</script>
</body>
</html>
