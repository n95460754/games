<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Релси по броя</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🛤️ Релси по броя</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 305. Релси по броя
const RC_D=[[1,0],[-1,0],[0,1],[0,-1]];
A.add({id:'railcount',cat:'puzzle',icon:'🛤️',name:'Релси по броя',desc:'Положи релси от входа до изхода — числата казват колко релси има във всеки ред и колона',
  help:'Положи релси от входа (вляво) до изхода (вдясно) в една непрекъсната линия без разклонения. Числата горе и вдясно казват колко релси има в колоната / реда. Клик / докосване — релса → ✕ → празно. Стрелки / WASD — курсор, Space — релса, X — ✕, R — нивото отначало. Ниво = точки според размера, +10 сек. 4 минути.',
  start(g){g.time=240;g.lv=0;g.cx=0;g.cy=0;this.make(g);},
  make(g){
    const N=Math.min(8,5+Math.floor(g.lv/2));g.N=N;g.T=Math.floor(Math.min(46,280/N));g.ox=Math.floor((430-N*g.T)/2)+10;g.oy=Math.floor(40+(300-N*g.T)/2)+10;
    const minLen=N+2+Math.min(g.lv,6);let path=null;
    for(let tries=0;tries<4000&&!path;tries++){
      const sy=A.ri(0,N-1),p=[[0,sy]],used=new Set([sy*N]);let x=0,y=sy;
      while(true){
        const cand=[];
        for(const[dx,dy]of RC_D){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=N||Y>=N||used.has(Y*N+X))continue;
          if(X===N-1&&p.length+1<minLen)continue;
          let bad=false;for(const[ex,ey]of RC_D){const ax=X+ex,ay=Y+ey;if((ax!==x||ay!==y)&&ax>=0&&ay>=0&&ax<N&&ay<N&&used.has(ay*N+ax)){bad=true;break;}}
          if(!bad)cand.push([X,Y]);}
        if(!cand.length)break;
        const[nx,ny]=A.pick(cand);x=nx;y=ny;p.push([x,y]);used.add(y*N+x);
        if(x===N-1){path=p;break;}}
    }
    if(!path){path=[];const r=A.ri(0,N-1);for(let i=0;i<N;i++)path.push([i,r]);}
    g.sol=path;g.a=path[0];g.b=path[path.length-1];
    g.rows=new Array(N).fill(0);g.cols=new Array(N).fill(0);for(const[x,y]of path){g.rows[y]++;g.cols[x]++;}
    g.fix=new Set([g.a[1]*N+g.a[0],g.b[1]*N+g.b[0]]);
    const extra=N>=6?Math.min(2,N-5):0;const mid=A.shuffle(path.slice(2,-2));for(let i=0;i<extra&&i<mid.length;i++)g.fix.add(mid[i][1]*N+mid[i][0]);
    this.reset(g);},
  reset(g){g.m=new Array(g.N*g.N).fill(0);for(const i of g.fix)g.m[i]=1;g.win=0;g.cx=Math.min(g.cx,g.N-1);g.cy=Math.min(g.cy,g.N-1);},
  rail(g,i){return i>=0&&g.m[i]===1;},
  nb(g,x,y){const r=[];for(const[dx,dy]of RC_D){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<g.N&&Y<g.N&&g.m[Y*g.N+X]===1)r.push([X,Y]);}return r;},
  check(g){const N=g.N;
    for(let i=0;i<N;i++){let r=0,cc=0;for(let j=0;j<N;j++){if(g.m[i*N+j]===1)r++;if(g.m[j*N+i]===1)cc++;}if(r!==g.rows[i]||cc!==g.cols[i])return false;}
    let total=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g.m[y*N+x]===1){total++;const d=this.nb(g,x,y).length,end=(x===g.a[0]&&y===g.a[1])||(x===g.b[0]&&y===g.b[1]);
      if(end?d!==1:d!==2)return false;}
    const seen=new Set([g.a[1]*N+g.a[0]]),st=[g.a];while(st.length){const[x,y]=st.pop();for(const[X,Y]of this.nb(g,x,y)){const k=Y*N+X;if(!seen.has(k)){seen.add(k);st.push([X,Y]);}}}
    return seen.size===total&&seen.has(g.b[1]*N+g.b[0]);},
  set(g,x,y,v){const i=y*g.N+x;if(g.fix.has(i)||g.win>0)return;g.m[i]=v===undefined?(g.m[i]+1)%3:(g.m[i]===v?0:v);A.beep(g.m[i]===1?520:g.m[i]===2?300:200,.04);
    if(this.check(g)){const pts=g.N-3;g.score+=pts;g.pts=pts;g.time+=10;g.win=1.4;A.tune([523,659,784,1047]);}},
  key(g,k){if(k==='KeyR'){this.reset(g);return;}
    const mv={ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1]}[k];
    if(mv){g.cx=A.clamp(g.cx+mv[0],0,g.N-1);g.cy=A.clamp(g.cy+mv[1],0,g.N-1);g.kb=1;return;}
    if(k==='Space'||k==='Enter')this.set(g,g.cx,g.cy,1);else if(k==='KeyX')this.set(g,g.cx,g.cy,2);},
  click(g,mx,my){if(my<30&&mx>400){this.reset(g);return;}g.kb=0;
    const x=Math.floor((mx-g.ox)/g.T),y=Math.floor((my-g.oy)/g.T);if(x<0||y<0||x>=g.N||y>=g.N)return;g.cx=x;g.cy=y;this.set(g,x,y);},
  update(g,dt){g.time-=dt;if(g.time<=0)return A.over(g,'Времето изтече! Ниво '+(g.lv+1));
    if(g.win>0){g.win-=dt;if(g.win<=0){g.lv++;this.make(g);}}},
  draw(g){A.bg('#2b3a2a');const N=g.N,T=g.T,ox=g.ox,oy=g.oy;
    // броячи
    const cnt=(i,row)=>{let n=0;for(let j=0;j<N;j++)if(g.m[row?i*N+j:j*N+i]===1)n++;return n;};
    for(let i=0;i<N;i++){const cc=cnt(i,0),cr=cnt(i,1);
      A.txt(String(g.cols[i]),ox+i*T+T/2,oy-14,16,cc===g.cols[i]?'#9ccc65':cc>g.cols[i]?'#ff7043':'#fff','center');
      A.txt(String(g.rows[i]),ox+N*T+16,oy+i*T+T/2,16,cr===g.rows[i]?'#9ccc65':cr>g.rows[i]?'#ff7043':'#fff','center');}
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,px=ox+x*T,py=oy+y*T;
      c.fillStyle=(x+y)%2?'#6a8f3e':'#729a44';c.fillRect(px,py,T,T);c.fillStyle='#5e8236';c.fillRect(px+T*.2,py+T*.3,3,4);c.fillRect(px+T*.7,py+T*.65,3,4);
      if(g.m[i]===2){c.strokeStyle='#3a2a1a';c.lineWidth=3;c.beginPath();c.moveTo(px+T*.3,py+T*.3);c.lineTo(px+T*.7,py+T*.7);c.moveTo(px+T*.7,py+T*.3);c.lineTo(px+T*.3,py+T*.7);c.stroke();}}
    // релси: траверси и релси към съседите
    const seg=(x,y,dx,dy)=>{const cx=ox+x*T+T/2,cy=oy+y*T+T/2,ex=cx+dx*T/2,ey=cy+dy*T/2;
      c.fillStyle='#7a5233';for(let k=0;k<3;k++){const t=k/3+.1,sx=cx+(ex-cx)*t,sy=cy+(ey-cy)*t;if(dx)c.fillRect(sx-2,sy-T*.3,5,T*.6);else c.fillRect(sx-T*.3,sy-2,T*.6,5);}
      c.fillStyle='#b0b0b0';const o=T*.18;if(dx){c.fillRect(Math.min(cx,ex),cy-o-1,Math.abs(ex-cx)+1,3);c.fillRect(Math.min(cx,ex),cy+o-1,Math.abs(ex-cx)+1,3);}
      else{c.fillRect(cx-o-1,Math.min(cy,ey),3,Math.abs(ey-cy)+1);c.fillRect(cx+o-1,Math.min(cy,ey),3,Math.abs(ey-cy)+1);}};
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(g.m[y*N+x]!==1)continue;const nb=this.nb(g,x,y);
      const isA=x===g.a[0]&&y===g.a[1],isB=x===g.b[0]&&y===g.b[1];
      if(isA)seg(x,y,-1,0);if(isB)seg(x,y,1,0);
      for(const[X,Y]of nb)seg(x,y,X-x,Y-y);
      if(!nb.length&&!isA&&!isB){c.fillStyle='#7a5233';c.fillRect(ox+x*T+T*.2,oy+y*T+T*.4,T*.6,T*.2);}
      if(g.fix.has(y*N+x)){c.fillStyle='rgba(255,213,79,.8)';c.fillRect(ox+x*T+2,oy+y*T+2,5,5);}}
    c.strokeStyle='#1d2a1c';c.lineWidth=2;c.strokeRect(ox,oy,N*T,N*T);
    // вход и изход
    A.block(ox-26,oy+g.a[1]*T+T/2-10,20,'#9e9e9e',20);A.txt('→',ox-16,oy+g.a[1]*T+T/2,14,'#ffd54f','center');
    A.block(ox+N*T+30,oy+g.b[1]*T+T/2-12,22,'#ffd23f',24);A.txt('⛏',ox+N*T+41,oy+g.b[1]*T+T/2,12,'#000','center');
    // вагонетка при победа
    if(g.win>0){const k=Math.min(g.sol.length-1,Math.floor((1.4-g.win)/1.2*g.sol.length));const[x,y]=g.sol[Math.max(0,k)];
      A.block(ox+x*T+T/2-10,oy+y*T+T/2-8,20,'#8a8a8a',14);c.fillStyle='#ffd23f';c.fillRect(ox+x*T+T/2-7,oy+y*T+T/2-11,14,4);}
    if(g.kb){c.strokeStyle='#ffd54f';c.lineWidth=3;c.strokeRect(ox+g.cx*T+1,oy+g.cy*T+1,T-2,T-2);}
    c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,480,30);
    A.txt('⏱ '+Math.ceil(g.time)+'   Ниво '+(g.lv+1)+' ('+N+'×'+N+')',8,15,13,'#fff');
    A.block(404,4,70,'#5a6b8c',22);A.txt('↺ R',439,15,12,'#fff','center');
    if(g.win>0){c.fillStyle='rgba(0,0,0,.45)';c.fillRect(0,320,480,40);A.txt('Пътят е готов! +'+g.pts+' т. · +10 сек.',240,340,18,'#ffd54f','center');}
  }
});
</script>
</body>
</html>
