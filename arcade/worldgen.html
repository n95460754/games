<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор на светове</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🗺️ Генератор на светове</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 125. Генератор на светове
A.add({id:'worldgen',cat:'board',icon:'🗺️',name:'Генератор на светове',desc:'Безкрайна карта с биоми',noScore:true,help:'Стрелки / влачене с мишката — разглеждай безкрайната карта. N — нов свят (ново семе). Океани, плажове, гори, пустини, планини и сняг — всичко от формулата за шум!',
  start(g){g.seed=A.ri(1,99999);g.ox=0;g.oy=0;g.cache=new Map();},
  h(g,x,y){const s=g.seed;const n=(X,Y)=>{let v=Math.sin(X*127.1+Y*311.7+s*.13)*43758.5453;return v-Math.floor(v);};
    const sm=(x,y,f)=>{x*=f;y*=f;const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=n(xi,yi),b=n(xi+1,yi),c2=n(xi,yi+1),d=n(xi+1,yi+1);return a+(b-a)*u+(c2-a)*v+(a-b-c2+d)*u*v;};
    return sm(x,y,.02)*.55+sm(x,y,.05)*.28+sm(x,y,.12)*.12+sm(x,y,.3)*.05;},
  key(g,k){if(k==='KeyN'){g.seed=A.ri(1,99999);g.cache.clear();A.beep(500,.05);}},
  click(g,mx,my){g.drag={x:mx,y:my,ox:g.ox,oy:g.oy};},
  move(g,mx,my){if(g.drag&&A.mouse.down){g.ox=g.drag.ox-(mx-g.drag.x)/8;g.oy=g.drag.oy-(my-g.drag.y)/8;}},
  release(g){g.drag=null;},
  update(g,dt){const s=30*dt;if(A.keys.ArrowLeft||A.keys.KeyA)g.ox-=s;if(A.keys.ArrowRight||A.keys.KeyD)g.ox+=s;if(A.keys.ArrowUp||A.keys.KeyW)g.oy-=s;if(A.keys.ArrowDown||A.keys.KeyS)g.oy+=s;},
  draw(g){const T=8,X0=Math.floor(g.ox),Y0=Math.floor(g.oy);for(let y=0;y<45;y++)for(let x=0;x<60;x++){const wx=X0+x,wy=Y0+y,K=wx+','+wy;let v=g.cache.get(K);if(v===undefined){v=this.h(g,wx,wy);if(g.cache.size>60000)g.cache.clear();g.cache.set(K,v);}
      const t=Math.sin(wy*.02+g.seed)*.5+.5;let col=v<.38?'#1e5aa8':v<.45?'#3b7bd6':v<.48?C.sand:v<.62?(t>.65?'#d9c070':C.grass):v<.7?(t>.65?'#c2a050':'#2e6b1e'):v<.78?C.stone:'#f5f5f5';
      c.fillStyle=col;c.fillRect((x-(g.ox-X0))*T,(y-(g.oy-Y0))*T,T+1,T+1);}
    c.fillStyle='rgba(0,0,0,.5)';c.fillRect(0,0,480,18);A.txt('Семе '+g.seed+'   X '+Math.round(g.ox)+'  Y '+Math.round(g.oy)+'   N = нов свят',8,9,11,'#fff');}
});
</script>
</body>
</html>
