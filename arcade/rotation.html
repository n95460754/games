<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Завъртяна фигура</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🔄 Завъртяна фигура</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 172. Завъртяната фигура
A.add(choiceGame({id:'rotation',cat:'puzzle',icon:'🔄',name:'Завъртяна фигура',desc:'Коя е същата, само завъртяна?',help:'Горе е фигура. Само ЕДНА от долните е същата, завъртяна (без огледален образ). Избери я (клик или 1–4). 60 секунди.',
  shape(){const s=new Set(['0,0']);let x=0,y=0;while(s.size<5){const[dx,dy]=A.pick([[1,0],[-1,0],[0,1],[0,-1]]);x+=dx;y+=dy;s.add(x+','+y);}return[...s].map(k=>k.split(',').map(Number));},
  norm(p){const mx=Math.min(...p.map(q=>q[0])),my=Math.min(...p.map(q=>q[1]));return p.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);},
  rot(p,n){for(let i=0;i<n;i++)p=p.map(([x,y])=>[-y,x]);return this.norm(p);},
  key2(p){return this.norm(p).join(';');},
  next(g){let s,mir;for(;;){s=this.shape();mir=s.map(([x,y])=>[-x,y]);const rs=[0,1,2,3].map(n=>this.key2(this.rot(s,n)));if(!rs.includes(this.key2(mir)))break;}
    g.base=this.norm(s);const right=this.rot(s,A.ri(1,3));const wrong=[this.rot(mir,A.ri(0,3)),this.rot(mir,A.ri(0,3))];let other;do{other=this.shape();}while([0,1,2,3].some(n=>this.key2(this.rot(other,n))===this.key2(s)));wrong.push(this.rot(other,0));
    g.shapes=A.shuffle([{p:right,ok:true},...wrong.map(p=>({p}))]);g.opts=g.shapes.map((_,i)=>'#'+(i+1));g.ans='#'+(g.shapes.findIndex(q=>q.ok)+1);},
  draw2(p,ox,oy,T,col){for(const[x,y]of p)A.block(ox+x*T,oy+y*T,T,col);},
  pic(g){this.draw2(g.base,200,20,20,C.gold);g.shapes.forEach((q,i)=>this.draw2(q.p,i*120+25,150,16,C.gem));}}));
</script>
</body>
</html>
