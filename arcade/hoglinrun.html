<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бягай от хоглините</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🐗 Бягай от хоглините</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 373. Бягай от хоглините
A.add({id:'hoglinrun',cat:'action',icon:'🐗',name:'Бягай от хоглините',desc:'Събирай злато в Недъра, а хоглините се засилват по червената линия — отскочи навреме!',
  help:'Стрелки / WASD или задръж мишката/пръста — тичай натам. Златно зрънце = 1 т. Червената линия показва накъде ще се засили хоглинът. Синята гъба = 5 т. и прогонва всички хоглини. 3 живота.',
  start(g){g.p={x:240,y:190};g.lives=3;g.inv=0;g.h=[];g.spawn=1.2;g.nug=this.spot(g);g.fung=null;g.fT=9;g.parts=[];g.shake=0;},
  spot(g){let x,y,n=0;do{x=A.rnd(30,450);y=A.rnd(46,340);}while(n++<50&&Math.hypot(x-g.p.x,y-g.p.y)<90);return {x,y};},
  puff(g,x,y,col,n){for(let i=0;i<n;i++)g.parts.push({x,y,vx:A.rnd(-90,90),vy:A.rnd(-90,90),t:A.rnd(.3,.7),col});},
  addH(g){const s=A.ri(0,3);let x,y;
    if(s===0){x=A.rnd(30,450);y=34;}else if(s===1){x=A.rnd(30,450);y=346;}else if(s===2){x=14;y=A.rnd(46,340);}else{x=466;y=A.rnd(46,340);}
    g.h.push({x,y,st:'aim',t:Math.max(.6,1.2-g.score*.012),ang:Math.atan2(g.p.y-y,g.p.x-x),v:0});A.beep(110,.15,'sawtooth',.03);},
  update(g,dt){
    const p=g.p,K=A.keys;let dx=0,dy=0;
    if(K.ArrowLeft||K.KeyA)dx--;if(K.ArrowRight||K.KeyD)dx++;if(K.ArrowUp||K.KeyW)dy--;if(K.ArrowDown||K.KeyS)dy++;
    if(A.mouse.down){const mx=A.mouse.x-p.x,my=A.mouse.y-p.y,d=Math.hypot(mx,my);if(d>6){dx=mx/d;dy=my/d;}}
    const l=Math.hypot(dx,dy);if(l){p.x+=dx/l*155*dt;p.y+=dy/l*155*dt;}
    p.x=A.clamp(p.x,16,464);p.y=A.clamp(p.y,40,344);
    if(g.inv>0)g.inv-=dt;if(g.shake>0)g.shake-=dt;
    if(Math.hypot(p.x-g.nug.x,p.y-g.nug.y)<18){g.score++;A.beep(900,.05,'triangle');this.puff(g,g.nug.x,g.nug.y,C.gold,6);g.nug=this.spot(g);}
    g.fT-=dt;if(!g.fung&&g.fT<=0){g.fung=this.spot(g);g.fung.life=6;}
    if(g.fung){g.fung.life-=dt;
      if(Math.hypot(p.x-g.fung.x,p.y-g.fung.y)<20){g.score+=5;A.tune([523,659,784]);g.h.forEach(h=>this.puff(g,h.x,h.y,'#14b4a0',8));g.h=[];g.spawn=2;g.fung=null;g.fT=A.rnd(10,16);}
      else if(g.fung.life<=0){g.fung=null;g.fT=A.rnd(8,14);}}
    const max=Math.min(7,1+Math.floor(g.score/6));
    g.spawn-=dt;if(g.spawn<=0){g.spawn=A.rnd(.5,1.3);if(g.h.length<max)this.addH(g);}
    for(let i=g.h.length-1;i>=0;i--){const h=g.h[i];
      if(h.st==='aim'){h.t-=dt;if(h.t>.25)h.ang=Math.atan2(p.y-h.y,p.x-h.x);if(h.t<=0){h.st='run';h.v=Math.min(430,240+g.score*3);A.beep(160,.12,'square',.03);}}
      else{h.x+=Math.cos(h.ang)*h.v*dt;h.y+=Math.sin(h.ang)*h.v*dt;if(Math.random()<.3)g.parts.push({x:h.x,y:h.y,vx:0,vy:0,t:.25,col:'#7a2a2a'});
        if(h.x<-40||h.x>520||h.y<-40||h.y>400){g.h.splice(i,1);continue;}}
      if(g.inv<=0&&Math.hypot(h.x-p.x,h.y-p.y)<20){g.lives--;g.inv=1.5;g.shake=.3;A.beep(90,.3,'sawtooth',.06);this.puff(g,p.x,p.y,C.red,10);
        if(g.lives<=0)return A.over(g,'Хоглинът те помете!');}
    }
    for(let i=g.parts.length-1;i>=0;i--){const q=g.parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;if(q.t<=0)g.parts.splice(i,1);}
  },
  draw(g){
    c.save();if(g.shake>0)c.translate(A.rnd(-3,3),A.rnd(-3,3));
    A.bg('#5a1e1e');
    for(let x=0;x<24;x++)for(let y=1;y<18;y++){const v=(x*7+y*13+x*y)%5;c.fillStyle=['#6b2222','#5e1d1d','#732828','#541a1a','#682020'][v];c.fillRect(x*20,y*20+6,20,20);}
    // предупредителни линии
    g.h.forEach(h=>{if(h.st!=='aim')return;const a=.25+.25*Math.sin(g.t*20);c.strokeStyle='rgba(255,40,40,'+a+')';c.lineWidth=16;c.beginPath();c.moveTo(h.x,h.y);c.lineTo(h.x+Math.cos(h.ang)*700,h.y+Math.sin(h.ang)*700);c.stroke();});
    // злато
    const n=g.nug,b=Math.sin(g.t*5)*2;A.block(n.x-5,n.y-5+b,10,C.gold);c.fillStyle='#fff7c0';c.fillRect(n.x-3,n.y-3+b,3,3);
    if(g.fung&&(g.fung.life>1.5||Math.sin(g.t*20)>0)){const f=g.fung;c.fillStyle='#d8c8a0';c.fillRect(f.x-2,f.y,5,10);A.block(f.x-9,f.y-8,18,'#14b4a0',9);c.fillStyle='#ff9a3c';c.fillRect(f.x-5,f.y-6,3,3);c.fillRect(f.x+3,f.y-5,3,3);}
    // хоглини
    g.h.forEach(h=>{c.save();c.translate(h.x,h.y);c.rotate(h.ang);
      A.block(-14,-10,24,'#c4876a',20);A.block(8,-8,10,'#b0705a',16);c.fillStyle='#f0e8d8';c.fillRect(16,-9,4,4);c.fillRect(16,5,4,4);
      c.fillStyle='#000';c.fillRect(11,-5,3,3);c.fillRect(11,2,3,3);c.fillStyle='#e8c060';c.fillRect(-14,-11,20,3);c.restore();});
    // играч
    const p=g.p;if(g.inv<=0||Math.sin(g.t*30)>0){A.block(p.x-8,p.y-2,16,'#2fa8c8',10);A.block(p.x-8,p.y-10,16,'#c99a6e',9);c.fillStyle='#4a2c18';c.fillRect(p.x-8,p.y-10,16,3);c.fillStyle='#2b3a9a';c.fillRect(p.x-5,p.y-6,2,2);c.fillRect(p.x+3,p.y-6,2,2);}
    g.parts.forEach(q=>{c.fillStyle=q.col;c.fillRect(q.x-2,q.y-2,4,4);});
    c.restore();
    c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,480,26);
    A.txt('❤'.repeat(Math.max(0,g.lives)),8,13,16,'#ff5252');A.txt('Злато: '+g.score,240,13,15,C.gold,'center');
    A.txt('Хоглини: '+g.h.length,472,13,13,'#ffab91','right');
  }
});
</script>
</body>
</html>
