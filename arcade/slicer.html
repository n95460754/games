<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блокосечене</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🔪 Блокосечене</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 85. Блокосечене
A.add({id:'slicer',cat:'skill',icon:'🔪',name:'Блокосечене',desc:'Посичай летящите блокове',help:'Задръж бутона на мишката и прокарай бързо през летящите блокове, за да ги разсечеш. Не сечи динамита! 3 изпуснати блока и край.',
  start(g){g.it=[];g.sp=0;g.trail=[];g.miss=0;g.parts=[];},
  update(g,dt){g.sp-=dt;if(g.sp<=0){g.sp=Math.max(.35,1-g.t*.015);for(let i=0;i<A.ri(1,2+Math.floor(g.t/20));i++)g.it.push({x:A.rnd(60,420),y:380,vx:A.rnd(-80,80),vy:-A.rnd(430,540),bomb:Math.random()<.15,col:A.pick([C.red,C.gold,C.grass,C.water,'#ff8c1a'])});}
    if(A.mouse.down){g.trail.push([A.mouse.x,A.mouse.y,.2]);}g.trail.forEach(t=>t[2]-=dt);g.trail=g.trail.filter(t=>t[2]>0);
    for(const it of g.it){it.vy+=420*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;
      if(A.mouse.down&&g.trail.length>2){const[a,b]=g.trail[g.trail.length-2],sp=Math.hypot(A.mouse.x-a,A.mouse.y-b);if(sp>6&&Math.abs(A.mouse.x-it.x)<24&&Math.abs(A.mouse.y-it.y)<24){it.cut=1;
        if(it.bomb){A.beep(80,.4,'sawtooth',.1);return A.over(g,'Сряза динамит! 💥');}g.score++;A.beep(900,.04);for(let k=0;k<2;k++)g.parts.push({x:it.x,y:it.y,vx:(k?1:-1)*120,vy:-100,col:it.col,t:.8});}}
      if(!it.cut&&it.vy>0&&it.y>390&&!it.bomb){it.cut=1;g.miss++;A.beep(150,.1);if(g.miss>=3)return A.over(g,'Изпусна 3 блока');}}
    g.it=g.it.filter(it=>!it.cut&&it.y<400);for(const p of g.parts){p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;}g.parts=g.parts.filter(p=>p.t>0);},
  draw(g){A.bg('#3a2a1c');for(const it of g.it){if(it.bomb){A.block(it.x-18,it.y-18,36,'#c62828');c.fillStyle='#fff';c.fillRect(it.x-14,it.y-3,28,6);}else A.block(it.x-18,it.y-18,36,it.col);}
    for(const p of g.parts)A.block(p.x-9,p.y-18,18,p.col,36);c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();g.trail.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();A.txt('Изпуснати: '+'✖'.repeat(g.miss),10,14,14,'#f88');}
});
</script>
</body>
</html>
