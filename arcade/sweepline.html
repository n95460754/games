<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Метящата линия</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131b;color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:#ffd54f}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:#b9c6d6;font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="game">
  <div id="top"><span id="gname">🟩 Метящата линия</span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart" title="Отначало">↻</button> <button id="exit">☰ Всички игри (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script src="engine.js"></script>
<script>
// 353. Метящата линия
// Падат блокове 2×2 от трева и тухли. Направи квадрат 2×2 от един цвят — той светва,
// а метящата линия, която обикаля дъската отляво надясно, го изтрива. Не стигай върха!
const SC=16,SR=14,SZ=22,SX=8,SY=40,BW=SC*SZ;
const SCOL=['#5aa13a','#d8763a'];
A.add({id:'sweepline',cat:'action',icon:'🟩',name:'Метящата линия',desc:'Падащи 2×2 блока трева и тухли: събери квадрати от един цвят, а линията ги изтрива!',repeat:true,
  help:'← → / A D или мишка — местене · ↑ / W / Space или клик — завърти · ↓ — по-бързо · Enter или плъзни надолу — пусни веднага. Квадрат 2×2 от един цвят светва и линията го изтрива. Много квадрати в едно минаване = КОМБО!',
  start(g){g.gr=[...Array(SR)].map(()=>Array(SC).fill(null));g.nx=[this.mk(),this.mk()];g.line=0;g.passN=0;g.fall=0;g.parts=[];g.pop=null;g.drag=null;g.tx=null;this.spawn(g);},
  mk(){let p;do{p=[A.ri(0,1),A.ri(0,1),A.ri(0,1),A.ri(0,1)];}while(Math.random()<.4&&p[0]===p[1]&&p[1]===p[2]&&p[2]===p[3]);return p;},
  spawn(g){g.p={x:7,y:0,c:g.nx.shift()};g.nx.push(this.mk());g.fall=0;if(!this.fits(g,7,0)){g.p=null;A.over(g,'Блоковете стигнаха върха!');}},
  fits(g,x,y){if(x<0||x>SC-2||y<0||y>SR-2)return false;return !g.gr[y][x]&&!g.gr[y][x+1]&&!g.gr[y+1][x]&&!g.gr[y+1][x+1];},
  rot(g){if(!g.p)return;const c0=g.p.c;g.p.c=[c0[2],c0[0],c0[3],c0[1]];A.beep(520,.03);},
  shift(g,d){if(g.p&&this.fits(g,g.p.x+d,g.p.y)){g.p.x+=d;return true;}return false;},
  drop(g){if(!g.p)return;while(this.fits(g,g.p.x,g.p.y+1))g.p.y++;this.land(g);},
  land(g){const p=g.p;g.p=null;
    for(let i=0;i<2;i++){const x=p.x+i;for(const ci of [2+i,i]){let y=SR-1;while(y>=0&&g.gr[y][x])y--;if(y>=0)g.gr[y][x]={c:p.c[ci],m:false};}}
    A.beep(190,.05);this.marks(g);this.spawn(g);},
  // всички квадрати 2×2 от един цвят светват
  marks(g){const G=g.gr;for(let y=0;y<SR-1;y++)for(let x=0;x<SC-1;x++){const a=G[y][x],b=G[y][x+1],d=G[y+1][x],e=G[y+1][x+1];
    if(a&&b&&d&&e&&a.c===b.c&&a.c===d.c&&a.c===e.c){if(!a.m||!b.m||!d.m||!e.m)A.beep(880,.03,'triangle');a.m=b.m=d.m=e.m=true;}}},
  sweep(g,x){let n=0;const col=[];for(let y=SR-1;y>=0;y--){const v=g.gr[y][x];if(!v)continue;if(v.m){n++;if(g.parts.length<120)for(let k=0;k<2;k++)g.parts.push({x:SX+x*SZ+11,y:SY+y*SZ+11,vx:A.rnd(-60,60),vy:A.rnd(-120,-20),t:.6,col:SCOL[v.c]});}else col.push(v);}
    if(!n)return;for(let y=SR-1,i=0;y>=0;y--,i++)g.gr[y][x]=col[i]||null;
    g.passN+=n;g.score+=n;A.beep(300+n*60,.04,'square',.03);this.marks(g);},
  key(g,k){if(!g.p)return;
    if(k==='ArrowLeft'||k==='KeyA')this.shift(g,-1);else if(k==='ArrowRight'||k==='KeyD')this.shift(g,1);
    else if(k==='ArrowUp'||k==='KeyW'||k==='Space'||k==='KeyX')this.rot(g);else if(k==='Enter')this.drop(g);},
  click(g,mx,my){if(mx>=SX+BW+8){if(my>=236&&my<282)this.rot(g);else if(my>=290&&my<336)this.drop(g);return;}g.drag={x:mx,y:my,moved:false};},
  move(g,mx,my){if(g.drag&&(Math.abs(mx-g.drag.x)>10||Math.abs(my-g.drag.y)>10))g.drag.moved=true;
    if(mx<SX||mx>SX+BW||!g.p)return;const tx=A.clamp(Math.floor((mx-SX)/SZ-.5),0,SC-2);
    while(g.p.x<tx&&this.shift(g,1));while(g.p.x>tx&&this.shift(g,-1));},
  release(g,mx,my){const d=g.drag;g.drag=null;if(!d)return;if(!d.moved)this.rot(g);else if(my-d.y>50)this.drop(g);},
  update(g,dt){
    if(g.p){const fast=A.keys.ArrowDown||A.keys.KeyS;g.fall+=dt;const iv=fast?.035:Math.max(.16,.75-g.score*.0012);
      if(g.fall>=iv){g.fall=0;if(this.fits(g,g.p.x,g.p.y+1))g.p.y++;else this.land(g);}}
    if(A.state!=='play')return;
    const sp=3.2+Math.min(2,g.score/400),old=g.line;g.line+=dt*sp;
    for(let x=Math.floor(old);x<Math.floor(g.line)&&x<SC;x++)this.sweep(g,x);
    if(g.line>=SC){g.line-=SC;if(g.passN>=16){const b=g.passN;g.score+=b;g.pop={s:'КОМБО ×2! +'+b,t:1.4};A.tune([660,880,1100]);}else if(g.passN)g.pop={s:'+'+g.passN,t:.8};g.passN=0;}
    for(const p of g.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.t-=dt;}g.parts=g.parts.filter(p=>p.t>0);
    if(g.pop){g.pop.t-=dt;if(g.pop.t<=0)g.pop=null;}},
  draw(g){A.bg('#141a24');c.fillStyle='#0b0f16';c.fillRect(SX,SY,BW,SR*SZ);c.fillStyle='rgba(255,80,80,.08)';c.fillRect(SX,SY,BW,2*SZ);
    c.fillStyle='rgba(255,255,255,.04)';for(let x=0;x<=SC;x++)c.fillRect(SX+x*SZ,SY,1,SR*SZ);for(let y=0;y<=SR;y++)c.fillRect(SX,SY+y*SZ,BW,1);
    const T=performance.now()/150;
    const cell=(x,y,v,mk)=>{A.block(x,y,SZ,SCOL[v]);if(v){c.fillStyle='rgba(255,255,255,.18)';c.fillRect(x+3,y+5,7,3);c.fillRect(x+12,y+13,7,3);}else{c.fillStyle='#7a5233';c.fillRect(x+2,y+15,18,5);}
      if(mk){c.fillStyle='rgba(255,255,255,'+(.3+.15*Math.sin(T))+')';c.fillRect(x+2,y+2,SZ-4,SZ-4);}};
    for(let y=0;y<SR;y++)for(let x=0;x<SC;x++){const v=g.gr[y][x];if(v)cell(SX+x*SZ,SY+y*SZ,v.c,v.m);}
    if(g.p){let gy=g.p.y;while(this.fits(g,g.p.x,gy+1))gy++;c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=1;c.strokeRect(SX+g.p.x*SZ+.5,SY+gy*SZ+.5,SZ*2-1,SZ*2-1);
      for(let i=0;i<4;i++)cell(SX+(g.p.x+i%2)*SZ,SY+(g.p.y+(i>>1))*SZ,g.p.c[i],false);}
    const lx=SX+g.line*SZ;c.fillStyle='rgba(77,232,245,.18)';c.fillRect(lx-10,SY,10,SR*SZ);c.fillStyle='#4de8f5';c.fillRect(lx-1,SY,3,SR*SZ);A.block(lx-6,SY-10,12,'#4de8f5');
    for(const p of g.parts){c.fillStyle=p.col;c.fillRect(p.x-3,p.y-3,6,6);}
    A.txt('Метене: '+g.passN+' блока',SX,20,13,g.passN>=16?'#ffd54f':'#b9c6d6');
    const px=SX+BW+8,pw=480-px-6;A.txt('Следващи',px+pw/2,52,12,'#ffd54f','center');
    g.nx.forEach((n,k)=>{for(let i=0;i<4;i++)A.block(px+pw/2-16+(i%2)*16,66+k*44+(i>>1)*16,16,SCOL[n[i]]);});
    A.txt('Квадрат',px+pw/2,170,11,'#b9c6d6','center');A.txt('2×2 от един',px+pw/2,186,11,'#b9c6d6','center');A.txt('цвят!',px+pw/2,202,11,'#b9c6d6','center');
    A.block(px,236,pw,'#5a6b8c',46);A.txt('⟳',px+pw/2,259,22,'#fff','center');A.block(px,290,pw,'#5a6b8c',46);A.txt('⬇',px+pw/2,313,22,'#fff','center');
    if(g.pop)A.txt(g.pop.s,SX+BW/2,SY+SR*SZ/2,g.pop.s.length>6?24:30,'#ffd54f','center');}
});
</script>
</body>
</html>
