name: Build Master Bot

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "Build-Master-Bot"
          git config user.email "build-master-bot@users.noreply.github.com"
          echo "## 🏗️ Build-Master-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** Всички артефакти и скриптове са сглобени без конфликти!" >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "build(ci): verify pipeline status and zero-error state" || exit 0
          git pull --rebase origin main && git push origin main
