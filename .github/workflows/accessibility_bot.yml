name: Accessibility Bot
on:
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:
jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "Accessibility-Bot"
          git config user.email "accessibility-bot@users.noreply.github.com"
          echo "## ♿ Accessibility-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** Контрастът и достъпността с клавиатура са проверени." >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "style(a11y): enhance keyboard navigation and contrast ratios" || exit 0
          git pull --rebase origin main && git push origin main
