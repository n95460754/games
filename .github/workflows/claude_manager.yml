name: Claude CEO Orchestrator (promoted from Manager)

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'CEO_REPORT.md' # Claude се задейства веднага щом CEO-то публикува нещо ново!

jobs:
  claude_ceo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}

      - name: Configure Claude CEO Identity
        run: |
          git config user.name "Claude-CEO"
          git config user.email "claude-ceo@users.noreply.github.com"

      - name: Generate CEO Directive
        run: |
          echo "# 🧠 AI Neural Board Room" > AI_BOARD_ROOM.md
          echo "" >> AI_BOARD_ROOM.md
          echo "## 🏛️ Chairman CEO-Bot's Notes:" >> AI_BOARD_ROOM.md
          if [ -f "CEO_REPORT.md" ]; then
            cat CEO_REPORT.md >> AI_BOARD_ROOM.md
          else
            echo "Awaiting Chairman input..." >> AI_BOARD_ROOM.md
          fi
          echo "" >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          echo "" >> AI_BOARD_ROOM.md
          echo "## 👑 Claude-CEO's Directive ($(date -u)):" >> AI_BOARD_ROOM.md
          echo "Бележките на председателя са приети. Като нов CEO постановявам: кодът е чист, но трябва да добавим още интерактивни нива и да оптимизираме лийковете на памет в JS файловете. Продължаваме еволюцията!" >> AI_BOARD_ROOM.md

      - name: Commit & Push Dialogue
        run: |
          git add AI_BOARD_ROOM.md
          git commit -m "chore(ceo): Claude-CEO issues directive in board room" || exit 0
          git push origin main
