name: Claude Manager Orchestrator

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  claude_management:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}

      - name: Configure Claude Manager Identity
        run: |
          git config user.name "Claude-Manager"
          git config user.email "claude-manager@users.noreply.github.com"

      - name: Read CEO Report and Reply
        run: |
          echo "## 🤖 AI Board Room Discussion" > AI_BOARD_ROOM.md
          echo "" >> AI_BOARD_ROOM.md
          echo "**CEO-Bot Status Review:**" >> AI_BOARD_ROOM.md
          if [ -f "CEO_REPORT.md" ]; then
            cat CEO_REPORT.md >> AI_BOARD_ROOM.md
          else
            echo "No CEO report found yet." >> AI_BOARD_ROOM.md
          fi
          echo "" >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          echo "" >> AI_BOARD_ROOM.md
          echo "**Claude-Manager Response ($(date -u))**: " >> AI_BOARD_ROOM.md
          echo "Здравей, шефе! Анализирах кода на игрите. Архитектурата е стабилна, но трябва да добавим още нива и подобрим оптимизацията на анимациите. Продължаваме напред!" >> AI_BOARD_ROOM.md

      - name: Push Claude Dialogue Commit
        run: |
          git add AI_BOARD_ROOM.md
          git commit -m "chore(claude): reply to CEO in AI board room discussion" || exit 0
          git push origin main
