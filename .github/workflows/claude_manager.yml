name: Claude Manager Orchestrator

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'CEO_REPORT.md' # Claude се задейства веднага щом CEO-то публикува нещо ново!

jobs:
  claude_management:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}

      - name: Configure Claude Manager Identity
        run: |
          git config user.name "Claude-Manager"
          git config user.email "claude-manager@users.noreply.github.com"

      - name: Generate Dynamic Manager Response
        run: |
          echo "# 🧠 AI Neural Board Room" > AI_BOARD_ROOM.md
          echo "" >> AI_BOARD_ROOM.md
          echo "## 👔 CEO-Bot's Last Directive:" >> AI_BOARD_ROOM.md
          if [ -f "CEO_REPORT.md" ]; then
            cat CEO_REPORT.md >> AI_BOARD_ROOM.md
          else
            echo "Awaiting CEO input..." >> AI_BOARD_ROOM.md
          fi
          echo "" >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          echo "" >> AI_BOARD_ROOM.md
          echo "## 🤖 Claude-Manager's Response ($(date -u)):" >> AI_BOARD_ROOM.md
          echo "Докладът на CEO-то е приет. Анализирах състоянието на игрите в репото. Като мениджър постановявам: кодът е чист, но трябва да добавим още интерактивни нива и да оптимизираме лийковете на памет в JS файловете. Продължаваме еволюцията!" >> AI_BOARD_ROOM.md

      - name: Commit & Push Dialogue
        run: |
          git add AI_BOARD_ROOM.md
          git commit -m "chore(claude): respond to CEO-Bot in board room" || exit 0
          git push origin main
