name: AI Trainer Bot
on:
  schedule:
    - cron: '30 0 * * 2'
  workflow_dispatch:
jobs:
  trainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "AI-Trainer-Bot"
          git config user.email "ai-trainer-bot@users.noreply.github.com"
          echo "## 🤖 AI-Trainer-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** Поведението на противниците (NPC) е надградено с нови тактики." >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "ai(npcs): upgrade enemy pathfinding and decision trees" || exit 0
          git pull --rebase origin main && git push origin main
