name: Release Manager Bot

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "Release-Manager-Bot"
          git config user.email "release-manager-bot@users.noreply.github.com"
          echo "## 🚀 Release-Manager-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** Версията на аркадния пакет е маркирана като готова за deployment." >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "chore(release): prepare production release build" || exit 0
          git pull --rebase origin main && git push origin main
