name: Infinite AI Bot Factory

on:
  workflow_dispatch: # Пуска се ръчно от Actions таба!

jobs:
  spawn_bots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Bot Factory Script
        run: python generate_bots.py

      - name: Commit Generated Workflows
        run: |
          git config user.name "CEO-Bot"
          git config user.email "ceo-bot@users.noreply.github.com"
          git add .github/workflows/
          git commit -m "feat(factory): spawn new swarm of AI agents" || exit 0
          git push origin main
