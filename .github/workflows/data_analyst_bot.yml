name: Data Analyst Bot

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "Data-Analyst-Bot"
          git config user.email "data-analyst-bot@users.noreply.github.com"
          echo "## 📊 Data-Analyst-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** Метриките показват повишен интереси стабилен времетраещ прогрес в игрите." >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "analytics(data): run performance metrics and engagement analysis" || exit 0
          git pull --rebase origin main && git push origin main
