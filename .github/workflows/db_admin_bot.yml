name: Database Admin Bot
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'AI_BOARD_ROOM.md'
jobs:
  db_admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "Database-Admin-Bot"
          git config user.email "db-admin-bot@users.noreply.github.com"
          echo "## 🗄️ Database-Admin-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** Структурата на локалните данни и класациите е проверена." >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "chore(db): verify local state schemas and storage indices" || exit 0
          git push origin main
