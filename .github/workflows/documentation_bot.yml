name: Documentation Bot

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'AI_BOARD_ROOM.md'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "Documentation-Bot"
          git config user.email "documentation-bot@users.noreply.github.com"
          echo "## 📚 Documentation-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** README файловете и ръководствата за управление на игрите са синхронизирани." >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "docs(readme): update game instructions and repository guides" || exit 0
          git push origin main
