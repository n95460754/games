name: HR Bot (hires employees every 5 min)

# Наема по 1 служител на всеки 5 минути за CEO-Bot.
# Безопасен дизайн:
#  - push с GITHUB_TOKEN (НЕ с CEO_BOT_TOKEN) -> не задейства останалите ботове
#  - пише само в employees/ и EMPLOYEES.md, НЕ в AI_BOARD_ROOM.md / CEO_REPORT.md
#  - не създава нови workflow файлове; спира при MAX_EMPLOYEES

on:
  schedule:
    - cron: '*/5 * * * *'   # минимумът в GitHub; реално може да закъснява 5-15 мин
  workflow_dispatch:
    inputs:
      count:
        description: 'Колко служители да наеме сега'
        default: '1'

permissions:
  contents: write

concurrency:
  group: hr-bot
  cancel-in-progress: false

jobs:
  hire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MAX_EMPLOYEES: '500'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hire employee
        run: node scripts/hire-employee.js "${{ github.event.inputs.count || '1' }}"

      - name: Employees talk to each other
        run: node scripts/office-chat.js 2

      - name: Commit & push
        run: |
          git config user.name "HR-Bot"
          git config user.email "hr-bot@users.noreply.github.com"
          git add employees/employees.json employees/chat.json EMPLOYEES.md OFFICE_CHAT.md
          git diff --cached --quiet && { echo "Нищо ново."; exit 0; }
          git commit -m "chore(hr): hire new employee for CEO-Bot"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
