name: Game Physics Bot
on:
  schedule:
    - cron: '0 22 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'AI_BOARD_ROOM.md'
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "Game-Physics-Bot"
          git config user.email "game-physics-bot@users.noreply.github.com"
          echo "## ⚛️ Game-Physics-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** Гравитационните константи и засичането на сблъсъци са калибрирани." >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "physics(engine): tune gravity vectors and collision boxes" || exit 0
          git push origin main
