name: DevOps Master Bot
on:
  schedule:
    - cron: '0 19 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'AI_BOARD_ROOM.md'
jobs:
  devops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "DevOps-Master-Bot"
          git config user.email "devops-master-bot@users.noreply.github.com"
          echo "## ⚙️ DevOps-Master-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** CI/CD пайплайните и автоматизациите работят на пълна мощност." >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "chore(devops): streamline pipeline runners and action triggers" || exit 0
          git push origin main
