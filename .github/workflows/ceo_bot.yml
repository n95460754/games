name: Chairman Bot (former CEO)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'AI_BOARD_ROOM.md' # CEO-то се събужда веднага щом Claude напише отговор!

jobs:
  ceo_executive_action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}

      - name: Configure Chairman Identity
        run: |
          git config user.name "Chairman-CEO-Bot"
          git config user.email "ceo-bot@users.noreply.github.com"

      - name: Chairman Notes
        run: |
          echo "# Chairman Report (бивш CEO)" > CEO_REPORT.md
          echo "Executive: CEO-Bot, Председател на борда" >> CEO_REPORT.md
          echo "New CEO: Claude (повишен от Claude-Manager)" >> CEO_REPORT.md
          echo "Status: Reviewing Claude-CEO's directive..." >> CEO_REPORT.md
          echo "Notes: Бордът подкрепя новия CEO Claude. Продължавайте с оптимизацията на JS кода!" >> CEO_REPORT.md
          echo "Last Review: $(date -u)" >> CEO_REPORT.md

      - name: Push Chairman Commit
        run: |
          git add CEO_REPORT.md
          git commit -m "chore(chairman): board notes for Claude-CEO" || exit 0
          git push origin main
