name: Auto Game (every 10 min)

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC); GitHub may delay runs a few minutes
  workflow_dispatch:          # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: auto-game
  cancel-in-progress: false

jobs:
  make-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate a new game and update README
        id: gen
        run: node scripts/generate-game.js

      - name: Commit and push
        run: |
          git config user.name "auto-game-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games README.md
          git commit -m "Add ${{ steps.gen.outputs.title }}"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
