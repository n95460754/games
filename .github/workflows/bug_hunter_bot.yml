name: Bug Hunter Bot
on:
  schedule:
    - cron: '0 18 * * 1'
  workflow_dispatch:
jobs:
  bugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "Bug-Hunter-Bot"
          git config user.email "bug-hunter-bot@users.noreply.github.com"
          echo "## 🐞 Bug-Hunter-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** Сканирането за гранични грешки (edge cases) не откри аномалии." >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "test(bugs): run edge-case regression and exception hunting" || exit 0
          git pull --rebase origin main && git push origin main
