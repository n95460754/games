name: Refactoring Bot
on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CEO_BOT_TOKEN }}
      - run: |
          git config user.name "Refactoring-Bot"
          git config user.email "refactoring-bot@users.noreply.github.com"
          echo "## 🧹 Refactoring-Bot Report ($(date -u))" >> AI_BOARD_ROOM.md
          echo "**Status:** Излишният код и неизползваните функции са почистени." >> AI_BOARD_ROOM.md
          echo "---" >> AI_BOARD_ROOM.md
          git add AI_BOARD_ROOM.md
          git commit -m "refactor(code): clean up dead scripts and unused variables" || exit 0
          git pull --rebase origin main && git push origin main
