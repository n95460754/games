<title>Блокова аркада</title>
<style>
:root{--bg:#1b2430;--card:#2b3646;--hl:#ffd54f;--sub:#b9c6d6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#eef3f8;font-family:Consolas,"Courier New",monospace}
header{text-align:center;padding:26px 16px 6px}
h1{margin:0;font-size:clamp(28px,6vw,46px);color:var(--hl);text-shadow:4px 4px 0 #000}
header p{color:var(--sub);margin:8px 0 0}
#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:14px 16px 4px}
#tools button,#tools input{font:inherit;font-size:14px;padding:6px 12px;background:var(--card);color:#fff;border:3px solid #000;cursor:pointer}
#tools button.on{background:#5d9c3a}
#tools input{cursor:text;width:180px}
#grid{max-width:1100px;margin:0 auto;padding:14px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
a.card{display:block;color:inherit;text-decoration:none;background:var(--card);border:3px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.07);padding:10px;text-align:center;transition:transform .1s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);outline:3px solid var(--hl)}
.ic{font-size:34px;line-height:1.2}
.card b{display:block;font-size:13.5px;margin:4px 0 2px}
.card small{color:var(--sub);font-size:11px}
.num{float:left;font-size:10px;color:#889}
#back{display:block;text-align:center;color:#9ecbff;padding-bottom:30px}
</style>
</head>

function best(d){try{const v=localStorage.getItem('arc_'+d.id);return v===null?null:JSON.parse(v);}catch(e){return null;}}
function fmt(d,v){return v===null?'-':(d.unit?(+v).toFixed(d.dec)+d.unit:Math.floor(v));}
let cat='all',q='';
function tools(){
  const t=document.getElementById('tools');t.innerHTML='';
  const mk=(k,l)=>{const b=document.createElement('button');b.textContent=l;if(cat===k)b.className='on';b.onclick=()=>{cat=k;tools();};t.appendChild(b);};
  mk('all','Всички');for(const k in CATS)mk(k,CATS[k]);
  const inp=document.createElement('input');inp.placeholder='🔍 търси...';inp.value=q;inp.oninput=()=>{q=inp.value.toLowerCase();grid();};t.appendChild(inp);
  grid();
}
function grid(){
  const gr=document.getElementById('grid');gr.innerHTML='';
  GAMES.forEach((d,i)=>{
    if(cat!=='all'&&d.cat!==cat)return;
    if(q&&!(d.name+' '+d.desc).toLowerCase().includes(q))return;
    const a=document.createElement('a');a.className='card';a.href='arcade/'+d.id+'.html';
    a.innerHTML='<span class="num">#'+(i+1)+'</span><div class="ic">'+d.icon+'</div><b>'+d.name+'</b><small>'+d.desc+'</small><br><small>'+(d.noScore?'':'🏆 '+fmt(d,best(d)))+'</small>';
    gr.appendChild(a);
  });
}
document.getElementById('count').textContent=GAMES.length;
// стари линкове arcade.html#snake водят към новия файл
const h=location.hash.slice(1);if(GAMES.some(g=>g.id===h))location.replace('arcade/'+h+'.html');
