<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блокова аркада</title>
<style>
:root{--bg:#1b2430;--card:#2b3646;--hl:#ffd54f;--sub:#b9c6d6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#eef3f8;font-family:Consolas,"Courier New",monospace}
header{text-align:center;padding:26px 16px 6px}
h1{margin:0;font-size:clamp(28px,6vw,46px);color:var(--hl);text-shadow:4px 4px 0 #000}
header p{color:var(--sub);margin:8px 0 0}
#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:14px 16px 4px}
#tools button,#tools input{font:inherit;font-size:14px;padding:6px 12px;background:var(--card);color:#fff;border:3px solid #000;cursor:pointer}
#tools button.on{background:#5d9c3a}
#tools input{cursor:text;width:180px}
#grid{max-width:1100px;margin:0 auto;padding:14px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
a.card{display:block;color:inherit;text-decoration:none;background:var(--card);border:3px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.07);padding:10px;text-align:center;transition:transform .1s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);outline:3px solid var(--hl)}
.ic{font-size:34px;line-height:1.2}
.card b{display:block;font-size:13.5px;margin:4px 0 2px}
.card small{color:var(--sub);font-size:11px}
.num{float:left;font-size:10px;color:#889}
#back{display:block;text-align:center;color:#9ecbff;padding-bottom:30px}
</style>
</head>
<body>
<header><h1>🕹️ Блокова аркада</h1><p><span id="count"></span> мини-игри в блоков свят. Всяка е отделна страница — избери една!</p></header>
<div id="tools"></div>
<div id="grid"></div>
<a id="back" href="games.html">← към всички игри</a>
<script>
// всяка игра е в отделен файл: arcade/<id>.html
const GAMES=[
  {"id": "snake", "cat": "action", "icon": "🐍", "name": "Блокова змия", "desc": "Яж ябълки и расти", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "breaker", "cat": "action", "icon": "🧱", "name": "Рудотрошач", "desc": "Чупи рудите с топче", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "catcher", "cat": "action", "icon": "🛒", "name": "Ловец на руди", "desc": "Хващай рудите, не бомбите", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "bat", "cat": "action", "icon": "🦇", "name": "Прилепче", "desc": "Лети през пещерата", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "lavarain", "cat": "action", "icon": "🌋", "name": "Лавов дъжд", "desc": "Оцелей колкото можеш", "unit": " с", "dec": 1, "low": false, "noScore": false}, {"id": "invaders", "cat": "action", "icon": "👾", "name": "Нашествие", "desc": "Стреляй по слузите", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "crossing", "cat": "action", "icon": "🐔", "name": "Пресечи релсите", "desc": "Стигни отсреща жив", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "pong", "cat": "action", "icon": "🏓", "name": "Блоков тенис", "desc": "Победи робота до 7", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "meteors", "cat": "action", "icon": "☄️", "name": "Метеоритен миньор", "desc": "Разбивай каменните блокове", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "runner", "cat": "action", "icon": "🏃", "name": "Блоков бегач", "desc": "Прескачай кактусите", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "trimino", "cat": "puzzle", "icon": "🟫", "name": "Тримино", "desc": "Нареди падащите тройки", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "match3", "cat": "puzzle", "icon": "💎", "name": "Три в ред", "desc": "Размествай скъпоценности", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "sapper", "cat": "puzzle", "icon": "💣", "name": "Сапьор", "desc": "Намери всички безопасни блокове", "unit": " с", "dec": 0, "low": true, "noScore": false}, {"id": "memory", "cat": "puzzle", "icon": "🃏", "name": "Памет", "desc": "Намери двойките блокове", "unit": " хода", "dec": 0, "low": true, "noScore": false}, {"id": "slide15", "cat": "puzzle", "icon": "🔢", "name": "Плъзгащ пъзел", "desc": "Подреди от 1 до 15", "unit": " хода", "dec": 0, "low": true, "noScore": false}, {"id": "lightsout", "cat": "puzzle", "icon": "🔦", "name": "Изгаси факлите", "desc": "Загаси всички факли", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "pushbox", "cat": "puzzle", "icon": "📦", "name": "Бутай сандъците", "desc": "Сложи сандъците на местата им", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "maze", "cat": "puzzle", "icon": "🌀", "name": "Лабиринт", "desc": "Бягай от лабиринтите", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "flood", "cat": "puzzle", "icon": "🌊", "name": "Наводнение", "desc": "Залей всичко с един цвят", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "collapse", "cat": "puzzle", "icon": "🧊", "name": "Сборни блокове", "desc": "Махай групи еднакви блокове", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "quickmath", "cat": "brain", "icon": "➕", "name": "Бърза сметка", "desc": "Колко сметки за 60 секунди?", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "compare", "cat": "brain", "icon": "⚖️", "name": "Везни", "desc": "Коя страна тежи повече?", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "countblocks", "cat": "brain", "icon": "👀", "name": "Бърз поглед", "desc": "Преброй блоковете за миг", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "simon", "cat": "brain", "icon": "🎵", "name": "Повтори", "desc": "Запомни реда на светлините", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "reaction", "cat": "brain", "icon": "⚡", "name": "Реакция", "desc": "Колко бърз си?", "unit": " мс", "dec": 0, "low": true, "noScore": false}, {"id": "aim", "cat": "brain", "icon": "🎯", "name": "Мерник", "desc": "Уцели блоковете с мишката", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "binary", "cat": "brain", "icon": "💾", "name": "Двоичен код", "desc": "Състави числото от битове", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "primes", "cat": "brain", "icon": "🔢", "name": "Просто ли е?", "desc": "Прости числа на скорост", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "fractions", "cat": "brain", "icon": "🍕", "name": "Дроби", "desc": "Коя дроб е по-голяма?", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "sequence", "cat": "brain", "icon": "🔮", "name": "Редици", "desc": "Кое е следващото число?", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "whack", "cat": "skill", "icon": "🔨", "name": "Удари слузите", "desc": "Халосай ги, преди да се скрият", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "stacker", "cat": "skill", "icon": "🏗️", "name": "Кулостроител", "desc": "Строй колкото можеш по-високо", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "rhythm", "cat": "skill", "icon": "🎶", "name": "Ритъм", "desc": "Удряй нотите в такт", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "shield", "cat": "skill", "icon": "🛡️", "name": "Щит", "desc": "Пази кристала от стрелите", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "golf", "cat": "skill", "icon": "⛳", "name": "Мини голф", "desc": "9 дупки, малко удари", "unit": " удара", "dec": 0, "low": true, "noScore": false}, {"id": "catapult", "cat": "skill", "icon": "🎯", "name": "Катапулт", "desc": "Уцели целта с правилния ъгъл", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "ski", "cat": "skill", "icon": "⛷️", "name": "Ски спускане", "desc": "Мини през вратичките", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "fishing", "cat": "skill", "icon": "🎣", "name": "Риболов", "desc": "Закачи и издърпай рибата", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "bee", "cat": "skill", "icon": "🐝", "name": "Пчеличка", "desc": "Събирай цветен прашец", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "snowball", "cat": "skill", "icon": "⛄", "name": "Снежна битка", "desc": "Уцели снежните човеци", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "tictactoe", "cat": "board", "icon": "❌", "name": "Морски шах", "desc": "Три в ред срещу робота", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "connect4", "cat": "board", "icon": "🔴", "name": "Четири в ред", "desc": "Пусни 4 в линия", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "nim", "cat": "board", "icon": "🪨", "name": "Ним", "desc": "Вземи последния блок", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "flipper", "cat": "board", "icon": "⚫", "name": "Обърни блоковете", "desc": "Обграждай и обръщай", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "paint", "cat": "board", "icon": "🎨", "name": "Пикселно платно", "desc": "Рисувай с блокчета", "unit": "", "dec": 0, "low": false, "noScore": true}, {"id": "nonogram", "cat": "board", "icon": "🖼️", "name": "Нонограм", "desc": "Разкрий скритата картинка", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "sudoku", "cat": "board", "icon": "🔢", "name": "Мини судоку", "desc": "Судоку 4×4", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "sandbox", "cat": "board", "icon": "⏳", "name": "Пясъчник", "desc": "Пясък, вода, лава и камък", "unit": "", "dec": 0, "low": false, "noScore": true}, {"id": "pipes", "cat": "board", "icon": "🚰", "name": "Водопровод", "desc": "Свържи тръбите", "unit": "", "dec": 0, "low": false, "noScore": false}, {"id": "dungeon", "cat": "board", "icon": "🗡️", "name": "Пещерен изследовател", "desc": "Кристали, чудовища и стълби", "unit": "", "dec": 0, "low": false, "noScore": false}
];
const CATS={action:'⚡ Екшън',puzzle:'🧩 Пъзели',brain:'🧠 Ум и математика',skill:'🎯 Умения',board:'♟️ Настолни и пясъчник'};
function best(d){try{const v=localStorage.getItem('arc_'+d.id);return v===null?null:JSON.parse(v);}catch(e){return null;}}
function fmt(d,v){return v===null?'-':(d.unit?(+v).toFixed(d.dec)+d.unit:Math.floor(v));}
let cat='all',q='';
function tools(){
  const t=document.getElementById('tools');t.innerHTML='';
  const mk=(k,l)=>{const b=document.createElement('button');b.textContent=l;if(cat===k)b.className='on';b.onclick=()=>{cat=k;tools();};t.appendChild(b);};
  mk('all','Всички');for(const k in CATS)mk(k,CATS[k]);
  const inp=document.createElement('input');inp.placeholder='🔍 търси...';inp.value=q;inp.oninput=()=>{q=inp.value.toLowerCase();grid();};t.appendChild(inp);
  grid();
}
function grid(){
  const gr=document.getElementById('grid');gr.innerHTML='';
  GAMES.forEach((d,i)=>{
    if(cat!=='all'&&d.cat!==cat)return;
    if(q&&!(d.name+' '+d.desc).toLowerCase().includes(q))return;
    const a=document.createElement('a');a.className='card';a.href='arcade/'+d.id+'.html';
    a.innerHTML='<span class="num">#'+(i+1)+'</span><div class="ic">'+d.icon+'</div><b>'+d.name+'</b><small>'+d.desc+'</small><br><small>'+(d.noScore?'':'🏆 '+fmt(d,best(d)))+'</small>';
    gr.appendChild(a);
  });
}
document.getElementById('count').textContent=GAMES.length;
// стари линкове arcade.html#snake водят към новия файл
const h=location.hash.slice(1);if(GAMES.some(g=>g.id===h))location.replace('arcade/'+h+'.html');
tools();
</script>
</body>
</html>
