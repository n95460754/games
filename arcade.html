<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блокова аркада</title>
<style>
:root{--bg:#1b2430;--card:#2b3646;--hl:#ffd54f;--sub:#b9c6d6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#eef3f8;font-family:Consolas,"Courier New",monospace}
#menu header{text-align:center;padding:26px 16px 6px}
#menu h1{margin:0;font-size:clamp(28px,6vw,46px);color:var(--hl);text-shadow:4px 4px 0 #000}
#menu header p{color:var(--sub);margin:8px 0 0}
#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:14px 16px 4px}
#tools button,#tools input{font:inherit;font-size:14px;padding:6px 12px;background:var(--card);color:#fff;border:3px solid #000;cursor:pointer}
#tools button.on{background:#5d9c3a}
#tools input{cursor:text;width:180px}
#grid{max-width:1100px;margin:0 auto;padding:14px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:3px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.07);padding:10px;cursor:pointer;text-align:center;transition:transform .1s}
.card:hover,.card:focus-visible{transform:translateY(-3px);outline:3px solid var(--hl)}
.card .ic{font-size:34px;line-height:1.2}
.card b{display:block;font-size:13.5px;margin:4px 0 2px}
.card small{color:var(--sub);font-size:11px}
.card .num{float:left;font-size:10px;color:#889}
#back{display:block;text-align:center;color:#9ecbff;padding-bottom:30px}
#game{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0e131b}
#top{display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;max-width:960px;padding:6px 12px;font-size:15px;text-shadow:2px 2px 0 #000}
#top b{color:var(--hl)}
#top button{font:inherit;font-size:13px;padding:4px 10px;background:#5a6b8c;color:#fff;border:3px solid #000;cursor:pointer}
canvas{image-rendering:pixelated;border:3px solid #000;touch-action:none;background:#000}
#help{color:var(--sub);font-size:13px;padding:6px 12px;text-align:center;max-width:900px}
</style>
</head>
<body>
<div id="menu">
  <header><h1>🕹️ Блокова аркада</h1><p><span id="count"></span> мини-игри в блоков свят. Избери една!</p></header>
  <div id="tools"></div>
  <div id="grid"></div>
  <a id="back" href="games.html">← към всички игри</a>
</div>
<div id="game">
  <div id="top"><span id="gname"></span><span>Точки: <b id="gscore">0</b> · Рекорд: <b id="gbest">-</b></span><span><button id="restart">↻</button> <button id="exit">☰ Меню (Esc)</button></span></div>
  <canvas id="cv" width="480" height="360"></canvas>
  <div id="help"></div>
</div>
<script>
// ================= ДВИГАТЕЛ =================
const A={games:[],W:480,H:360,keys:{},mouse:{x:0,y:0,down:false},def:null,g:null,state:'menu'};
A.add=d=>A.games.push(d);
A.C={grass:'#5aa13a',dirt:'#7a5233',stone:'#7d7d7d',wood:'#9a6a3a',gold:'#ffd23f',gem:'#4de8f5',ruby:'#ff2e55',lava:'#ff6a00',
  water:'#3b7bd6',leaf:'#3f8a24',sand:'#e0c068',snow:'#eef4ff',coal:'#2a2a2a',purple:'#8e24aa',sky:'#6fb3e8',iron:'#d8a07a',red:'#d84a3a',white:'#e8e8e8'};
A.rnd=(a,b)=>a+Math.random()*(b-a);
A.ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
A.pick=a=>a[Math.floor(Math.random()*a.length)];
A.clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
A.shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
A.hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const cv=document.getElementById('cv'),c=cv.getContext('2d');
A.c=c;
// блок с пикселна сянка
A.block=(x,y,s,col,h)=>{
  c.fillStyle=col;c.fillRect(x,y,s,h||s);const H=h||s,e=Math.max(1,Math.round(s/8));
  c.fillStyle='rgba(255,255,255,.22)';c.fillRect(x,y,s,e);c.fillRect(x,y,e,H);
  c.fillStyle='rgba(0,0,0,.28)';c.fillRect(x,y+H-e,s,e);c.fillRect(x+s-e,y,e,H);
};
A.txt=(s,x,y,size,col,al)=>{c.font='bold '+(size||16)+'px Consolas,monospace';c.textAlign=al||'left';c.textBaseline='middle';
  c.fillStyle='#000';c.fillText(s,x+2,y+2);c.fillStyle=col||'#fff';c.fillText(s,x,y);};
A.bg=col=>{c.fillStyle=col;c.fillRect(0,0,A.W,A.H);};
let ac=null;
A.beep=(f,d,type,vol)=>{try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=f;
  g.gain.setValueAtTime(vol||0.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+(d||.08));
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.08));}catch(e){}};
A.tune=fs=>fs.forEach((f,i)=>setTimeout(()=>A.beep(f,.12,'triangle'),i*100));
function load(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
A.best=d=>load('arc_'+d.id,null);
A.fmt=(d,v)=>v===null||v===undefined?'-':(d.unit?(+v).toFixed(d.dec||0)+d.unit:Math.floor(v));
// край на играта
A.over=(g,msg)=>{
  if(A.state!=='play')return;
  A.state='over';A.overMsg=msg||'Край на играта!';A.overAt=performance.now();
  const d=A.def,b=A.best(d),s=g.score;
  A.newBest=false;
  if(!d.noScore&&s!==undefined&&(d.low?s>0&&(b===null||s<b):(b===null||s>b))){save('arc_'+d.id,s);A.newBest=true;}
  A.beep(A.newBest?880:220,.25,'triangle',.06);
  updTop();
};
// ================= МЕНЮ =================
const CATS={action:'⚡ Екшън',puzzle:'🧩 Пъзели',brain:'🧠 Ум и математика',skill:'🎯 Умения',board:'♟️ Настолни и пясъчник'};
let cat='all',q='';
function buildMenu(){
  document.getElementById('count').textContent=A.games.length;
  const t=document.getElementById('tools');
  t.innerHTML='';
  const mk=(k,l)=>{const b=document.createElement('button');b.textContent=l;if(cat===k)b.className='on';b.onclick=()=>{cat=k;buildMenu();};t.appendChild(b);};
  mk('all','Всички');for(const k in CATS)mk(k,CATS[k]);
  const inp=document.createElement('input');inp.placeholder='🔍 търси...';inp.value=q;inp.oninput=()=>{q=inp.value.toLowerCase();grid();};t.appendChild(inp);
  grid();
}
function grid(){
  const gr=document.getElementById('grid');gr.innerHTML='';
  A.games.forEach((d,i)=>{
    if(cat!=='all'&&d.cat!==cat)return;
    if(q&&!(d.name+' '+d.desc).toLowerCase().includes(q))return;
    const b=A.best(d);
    const el=document.createElement('div');el.className='card';el.tabIndex=0;
    el.innerHTML='<span class="num">#'+(i+1)+'</span><div class="ic">'+d.icon+'</div><b>'+d.name+'</b><small>'+d.desc+'</small><br><small>'+(d.noScore?'':'🏆 '+A.fmt(d,b))+'</small>';
    el.onclick=()=>A.play(d);el.onkeydown=e=>{if(e.key==='Enter')A.play(d);};
    gr.appendChild(el);
  });
}
// ================= ИГРА =================
function updTop(){
  const d=A.def;if(!d)return;
  document.getElementById('gscore').textContent=d.noScore?'-':A.fmt(d,A.g.score);
  document.getElementById('gbest').textContent=d.noScore?'-':A.fmt(d,A.best(d));
}
A.play=d=>{
  A.def=d;A.g={score:0,t:0};A.keys={};A.state='play';
  document.getElementById('menu').style.display='none';document.getElementById('game').style.display='flex';
  document.getElementById('gname').textContent=d.icon+' '+d.name;
  document.getElementById('help').textContent=d.help;
  d.start(A.g);fit();updTop();
  history.replaceState(null,'','#'+d.id);
};
A.exit=()=>{A.state='menu';A.def=null;document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block';history.replaceState(null,'',location.pathname);grid();};
document.getElementById('exit').onclick=A.exit;
document.getElementById('restart').onclick=()=>A.play(A.def);
function fit(){const s=Math.min((innerWidth-16)/A.W,(innerHeight-110)/A.H);cv.style.width=Math.floor(A.W*s)+'px';cv.style.height=Math.floor(A.H*s)+'px';}
addEventListener('resize',fit);

// ---------- вход ----------
addEventListener('keydown',e=>{
  if(A.state==='menu')return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.code==='Escape'){A.exit();return;}
  if(A.state==='over'){if((e.code==='Space'||e.code==='Enter')&&performance.now()-A.overAt>400)A.play(A.def);return;}
  const first=!A.keys[e.code];A.keys[e.code]=true;
  if(A.def.key&&(first||A.def.repeat))A.def.key(A.g,e.code,e.key);
});
addEventListener('keyup',e=>{A.keys[e.code]=false;});
function pos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*A.W,(e.clientY-r.top)/r.height*A.H];}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{[A.mouse.x,A.mouse.y]=pos(e);if(A.state==='play'&&A.def.move)A.def.move(A.g,A.mouse.x,A.mouse.y);});
let downAt=null;
cv.addEventListener('pointerdown',e=>{
  [A.mouse.x,A.mouse.y]=pos(e);A.mouse.down=true;downAt={x:e.clientX,y:e.clientY,t:performance.now(),touch:e.pointerType==='touch'};
  if(A.state==='over'){if(performance.now()-A.overAt>400)A.play(A.def);downAt=null;return;}
  if(A.state!=='play')return;
  if(A.def.click)A.def.click(A.g,A.mouse.x,A.mouse.y,e.button);
  else if(A.def.key&&!e.pointerType.startsWith('touch'))A.def.key(A.g,'Space',' ');
});
addEventListener('pointerup',e=>{
  A.mouse.down=false;
  if(A.state==='play'&&A.def.release)A.def.release(A.g,A.mouse.x,A.mouse.y);
  if(!downAt||A.state!=='play')return;
  const dx=e.clientX-downAt.x,dy=e.clientY-downAt.y,touch=downAt.touch;downAt=null;
  if(!touch||A.def.click)return;
  // плъзгане с пръст = стрелка, докосване = Space
  let code='Space';
  if(Math.max(Math.abs(dx),Math.abs(dy))>25)code=Math.abs(dx)>Math.abs(dy)?(dx<0?'ArrowLeft':'ArrowRight'):(dy<0?'ArrowUp':'ArrowDown');
  if(A.def.key)A.def.key(A.g,code,code==='Space'?' ':'');
  A.keys[code]=true;setTimeout(()=>{A.keys[code]=false;},180);
});

// ---------- цикъл ----------
let last=performance.now(),topT=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!A.def)return;
  if(A.state==='play'){A.g.t+=dt;A.def.update&&A.def.update(A.g,dt);}
  c.save();A.def.draw(A.g,c);c.restore();
  if(A.state==='over'){
    c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,0,A.W,A.H);
    A.txt(A.overMsg,A.W/2,A.H/2-40,26,'#ffd54f','center');
    if(!A.def.noScore)A.txt('Резултат: '+A.fmt(A.def,A.g.score)+(A.newBest?'  🏆 НОВ РЕКОРД!':''),A.W/2,A.H/2,18,'#fff','center');
    A.txt('Space / клик = пак · Esc = меню',A.W/2,A.H/2+40,14,'#b9c6d6','center');
  }
  topT+=dt;if(topT>.1){topT=0;updTop();}
}
requestAnimationFrame(loop);
</script>
<script src="arcade/games-action.js"></script>
<script src="arcade/games-puzzle.js"></script>
<script src="arcade/games-brain.js"></script>
<script src="arcade/games-skill.js"></script>
<script src="arcade/games-board.js"></script>
<script>
buildMenu();
// директен линк към игра: arcade.html#snake
const h=location.hash.slice(1);const d=A.games.find(g=>g.id===h);if(d)A.play(d);
</script>
</body>
</html>
